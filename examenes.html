<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Resultados de evaluaciones — AVBA</title>
<link rel="icon" href="icon-192.png">
<style>
  :root { --azul:#0d3a8f; --azul-bg:#eef3fb; --verde:#1f8a4c; --verde-bg:#eaf7ee;
          --rojo:#c0392b; --rojo-bg:#fdecea; --texto:#1c2a3a; --sub:#5d7794;
          --hint:#8fa3bb; --borde:#d7e2ef; --fondo:#f6f9fd; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
         background:var(--fondo); color:var(--texto); line-height:1.5; padding-bottom:50px; }
  .barra { background:var(--azul); color:#fff; padding:13px 18px; display:flex;
           align-items:center; gap:12px; position:sticky; top:0; z-index:20; }
  .barra img { height:26px; }
  .barra .t { font-weight:700; font-size:15px; }
  .barra a { margin-left:auto; color:#fff; font-size:12.5px; text-decoration:none;
             border:1px solid rgba(255,255,255,.3); border-radius:7px; padding:6px 13px; }
  .wrap { max-width:1100px; margin:0 auto; padding:18px 16px; }
  .filtros { display:flex; gap:9px; flex-wrap:wrap; margin-bottom:14px; }
  input, select { padding:9px 12px; border:1px solid var(--borde); border-radius:8px;
                  font-size:13.5px; font-family:inherit; background:#fff; }
  input { flex:1; min-width:200px; }
  .stats { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:14px; }
  .stat { background:#fff; border:1px solid var(--borde); border-radius:10px;
          padding:11px 16px; flex:1; min-width:120px; }
  .stat .n { font-size:21px; font-weight:700; color:var(--azul); }
  .stat .l { font-size:11.5px; color:var(--sub); }
  table { width:100%; border-collapse:collapse; background:#fff;
          border:1px solid var(--borde); border-radius:10px; overflow:hidden; }
  th { background:var(--azul); color:#fff; font-size:12px; padding:10px;
       text-align:left; font-weight:600; }
  td { border-top:1px solid var(--borde); padding:10px; font-size:13px; vertical-align:top; }
  tr:hover td { background:var(--azul-bg); }
  .pill { display:inline-block; padding:2px 10px; border-radius:20px;
          font-size:11px; font-weight:700; }
  .ok { background:var(--verde-bg); color:var(--verde); }
  .no { background:var(--rojo-bg); color:var(--rojo); }
  .calif { font-weight:700; font-size:15px; }
  .btn { background:#fff; border:1px solid var(--borde); border-radius:7px;
         padding:5px 11px; font-size:12px; cursor:pointer; color:var(--azul);
         font-family:inherit; }
  .vacio { text-align:center; padding:40px; color:var(--hint); font-size:13.5px; }
  .ovl { position:fixed; inset:0; background:rgba(12,24,44,.55); display:none;
         align-items:center; justify-content:center; padding:16px; z-index:40; }
  .ovl.open { display:flex; }
  .modal { background:#fff; border-radius:13px; max-width:760px; width:100%;
           max-height:88vh; overflow-y:auto; padding:20px; }
  .modal h2 { font-size:16px; color:var(--azul); margin-bottom:3px; }
  .rsp { border:1px solid var(--borde); border-left-width:3px; border-radius:8px;
         padding:11px 13px; margin-bottom:9px; font-size:13px; }
  .rsp.b { border-left-color:var(--verde); }
  .rsp.m { border-left-color:var(--rojo); }
  .rsp .q { font-weight:600; margin-bottom:6px; }
  .rsp .d { color:var(--sub); font-size:12.5px; }
  .rsp .ref { color:var(--hint); font-size:11.5px; margin-top:5px; }
  .cerrar { float:right; background:none; border:none; font-size:20px;
            cursor:pointer; color:var(--hint); }
</style>
</head>
<body>

<div class="barra">
  <img src="assets/logos/avba.png" alt="AVBA" onerror="this.style.display='none'">
  <div class="t">Resultados de evaluaciones</div>
  <a href="admin.html">← Volver</a>
</div>

<div class="wrap">
  <div class="stats" id="stats"></div>
  <div class="filtros">
    <input id="f-q" placeholder="Buscar por nombre, CURP o empresa…" oninput="debounce()">
    <select id="f-res" onchange="cargar()">
      <option value="">Todos</option>
      <option value="aprobados">Sólo aprobados</option>
      <option value="reprobados">Sólo reprobados</option>
    </select>
  </div>
  <div id="tabla"></div>
</div>

<div class="ovl" id="ovl" onclick="if(event.target===this) cerrar()">
  <div class="modal" id="modal"></div>
</div>

<script>
const API = 'api/index.php';
const _s = JSON.parse(localStorage.getItem('avba_session') || '{}');
if (!_s.token || !['ADMIN','CALIDAD','CERTIFICACIONES'].includes(_s.rol)) {
  localStorage.removeItem('avba_session');
  location.href = 'login.html';
}
const esc = s => String(s ?? '').replace(/[&<>"']/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

async function api(action, params = {}) {
  const q = new URLSearchParams(Object.assign({ action }, params)).toString();
  const r = await fetch(`${API}?${q}`, {
    headers: { 'X-Token': _s.token, 'Authorization': 'Bearer ' + _s.token }
  });
  if (r.status === 401) { localStorage.removeItem('avba_session'); location.href = 'login.html'; return {}; }
  return r.json();
}

let _t = null;
function debounce() { clearTimeout(_t); _t = setTimeout(cargar, 350); }

async function cargar() {
  const d = await api('EXAMEN_RESULTADOS', {
    q: document.getElementById('f-q').value,
    resultado: document.getElementById('f-res').value,
  });
  const r = d.resultados || [];

  const apr = r.filter(x => Number(x.aprobado)).length;
  document.getElementById('stats').innerHTML = `
    <div class="stat"><div class="n">${r.length}</div><div class="l">Evaluaciones presentadas</div></div>
    <div class="stat"><div class="n" style="color:var(--verde)">${apr}</div><div class="l">Aprobadas</div></div>
    <div class="stat"><div class="n" style="color:var(--rojo)">${r.length - apr}</div><div class="l">No aprobadas</div></div>`;

  if (!r.length) {
    document.getElementById('tabla').innerHTML =
      `<div class="vacio">Todavía no hay evaluaciones presentadas.</div>`;
    return;
  }
  document.getElementById('tabla').innerHTML = `
    <table><thead><tr>
      <th>Candidato</th><th>Empresa</th><th>Evaluación</th>
      <th style="text-align:center">Calificación</th><th>Fecha</th><th></th>
    </tr></thead><tbody>${r.map(x => `
      <tr>
        <td><strong>${esc(x.nombre_completo)}</strong>
            ${x.curp ? `<div style="font-size:11.5px;color:var(--hint);font-family:monospace">${esc(x.curp)}</div>` : ''}
            ${x.puesto ? `<div style="font-size:11.5px;color:var(--sub)">${esc(x.puesto)}</div>` : ''}</td>
        <td style="font-size:12.5px;color:var(--sub)">${esc(x.empresa_nombre || '—')}
            ${x.correo ? `<div style="font-size:11.5px;color:var(--hint)">${esc(x.correo)}</div>` : ''}</td>
        <td style="font-size:12.5px">${esc(x.examen)}</td>
        <td style="text-align:center">
          <div class="calif" style="color:${Number(x.aprobado) ? 'var(--verde)' : 'var(--rojo)'}">
            ${Number(x.calificacion).toFixed(0)}</div>
          <div style="font-size:11px;color:var(--hint)">${x.aciertos}/${x.total_preguntas}</div>
          <span class="pill ${Number(x.aprobado) ? 'ok' : 'no'}">
            ${Number(x.aprobado) ? 'Aprobado' : 'No aprobado'}</span>
        </td>
        <td style="font-size:12px;color:var(--sub)">${esc((x.terminado_at || '').slice(0, 16).replace('T', ' '))}</td>
        <td><button class="btn" onclick="detalle(${x.id})">Ver</button></td>
      </tr>`).join('')}</tbody></table>`;
}

async function detalle(id) {
  const d = await api('EXAMEN_DETALLE', { id });
  if (d.status !== 'success') { alert(d.message || 'No se pudo abrir.'); return; }
  const i = d.intento;
  document.getElementById('modal').innerHTML = `
    <button class="cerrar" onclick="cerrar()">✕</button>
    <h2>${esc(i.nombre_completo)}</h2>
    <div style="font-size:12.5px;color:var(--sub);margin-bottom:12px">
      ${esc(i.examen)} · ${i.aciertos} de ${i.total_preguntas} correctas ·
      <strong style="color:${Number(i.aprobado) ? 'var(--verde)' : 'var(--rojo)'}">
        ${Number(i.calificacion).toFixed(0)} — ${Number(i.aprobado) ? 'Aprobado' : 'No aprobado'}</strong>
      (mínima ${Number(i.calificacion_minima).toFixed(0)})
    </div>
    ${(i.respuestas || []).map((r, n) => `
      <div class="rsp ${Number(r.correcta) ? 'b' : 'm'}">
        <div class="q">${n + 1}. ${esc(r.pregunta)}</div>
        <div class="d">Contestó: ${r.respondio ? esc(r.respondio) : '<em>sin contestar</em>'}</div>
        ${Number(r.correcta) ? '' :
          `<div class="d" style="color:var(--verde)">Correcta: ${esc(r.correcta_texto)}</div>`}
        ${r.referencia ? `<div class="ref">${esc(r.referencia)}</div>` : ''}
      </div>`).join('')}`;
  document.getElementById('ovl').classList.add('open');
}
function cerrar() { document.getElementById('ovl').classList.remove('open'); }

cargar();
</script>
</body>
</html>
