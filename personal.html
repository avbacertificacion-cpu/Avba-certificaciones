<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Personal — Supervisión AVBA</title>
<style>
:root{--azul:#185FA5;--azul-dark:#0C447C;--azul-light:#E6F1FB;--verde:#3B6D11;--verde-light:#EAF3DE;--ambar:#854F0B;--ambar-light:#FAEEDA;--rojo:#A32D2D;--rojo-light:#FCEBEB;--gris-bg:#f4f7fb;--borde:#dfe5ef;--texto:#1a1a2e;--texto-sub:#5a6072;--texto-hint:#9299a8;--blanco:#fff;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--gris-bg);min-height:100vh;}
/* Header */
.header{background:var(--azul);padding:14px 24px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 12px rgba(24,95,165,.25);position:sticky;top:0;z-index:50;}
.hdr-l{display:flex;align-items:center;gap:12px;}
.hdr-t{font-size:15px;font-weight:600;color:#fff;}
.hdr-s{font-size:11px;color:rgba(255,255,255,.6);margin-top:1px;}
.hdr-r{display:flex;align-items:center;gap:10px;}
.hdr-user{font-size:13px;font-weight:600;color:#fff;}
.btn-hdr{padding:6px 12px;border-radius:7px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.1);color:#fff;font-size:12px;font-weight:600;cursor:pointer;}
.btn-hdr:hover{background:rgba(255,255,255,.2);}
/* Wrap */
.wrap{max-width:1100px;margin:0 auto;padding:20px 16px 60px;}
/* Stats */
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:18px;}
@media(max-width:700px){.stats{grid-template-columns:repeat(3,1fr);}}
.stat{background:var(--blanco);border-radius:10px;padding:12px 14px;border:1px solid rgba(0,0,0,.05);box-shadow:0 2px 8px rgba(0,0,0,.04);}
.stat-n{font-size:22px;font-weight:700;}
.stat-l{font-size:11px;color:var(--texto-sub);margin-top:2px;}
/* Filters */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;}
.filters input,.filters select{padding:8px 12px;border:1px solid var(--borde);border-radius:8px;font-size:13px;background:var(--blanco);color:var(--texto);min-width:160px;}
.filters input{flex:1;}
.btn-buscar{padding:8px 18px;background:var(--azul);color:#fff;border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;}
.btn-buscar:hover{background:var(--azul-dark);}
/* Table */
.tbl-wrap{background:var(--blanco);border-radius:12px;border:1px solid rgba(0,0,0,.05);box-shadow:0 2px 10px rgba(0,0,0,.04);overflow:hidden;}
.tbl-hdr{padding:12px 16px;border-bottom:1px solid var(--borde);display:flex;align-items:center;justify-content:space-between;}
.tbl-title{font-size:14px;font-weight:600;color:var(--texto);}
.tbl-count{font-size:12px;color:var(--texto-hint);}
table{width:100%;border-collapse:collapse;}
thead th{background:var(--azul);color:#fff;padding:10px 14px;font-size:12px;font-weight:600;text-align:left;}
tbody td{padding:9px 14px;border-bottom:1px solid var(--borde);font-size:13px;color:var(--texto);}
tbody tr:last-child td{border-bottom:none;}
tbody tr:hover td{background:#f8faff;cursor:pointer;}
/* Badges */
.badge{display:inline-flex;align-items:center;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:600;}
.b-pend{background:var(--ambar-light);color:var(--ambar);}
.b-apro{background:var(--azul-light);color:var(--azul-dark);}
.b-emit{background:var(--verde-light);color:var(--verde);}
.b-dev{background:var(--rojo-light);color:var(--rojo);}
/* Modal */
.overlay{position:fixed;inset:0;background:rgba(10,20,40,.5);z-index:200;display:none;align-items:center;justify-content:center;padding:20px;}
.overlay.open{display:flex;}
.modal{background:var(--blanco);border-radius:14px;width:100%;max-width:680px;max-height:88vh;display:flex;flex-direction:column;box-shadow:0 24px 60px rgba(0,0,0,.2);}
.modal-hdr{padding:18px 20px;border-bottom:1px solid var(--borde);display:flex;align-items:center;justify-content:space-between;}
.modal-title{font-size:15px;font-weight:700;color:var(--texto);}
.modal-sub{font-size:12px;color:var(--texto-hint);margin-top:2px;}
.btn-close{padding:5px 10px;border:1px solid var(--borde);border-radius:7px;background:var(--blanco);cursor:pointer;font-size:16px;color:var(--texto-sub);}
.modal-body{padding:20px;overflow-y:auto;flex:1;}
.sec-title{font-size:11px;font-weight:700;color:var(--texto-hint);letter-spacing:.06em;text-transform:uppercase;margin:16px 0 8px;}
.sec-title:first-child{margin-top:0;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
@media(max-width:500px){.grid2{grid-template-columns:1fr;}}
.field{background:var(--gris-bg);border-radius:8px;padding:9px 12px;}
.field-l{font-size:11px;color:var(--texto-hint);margin-bottom:2px;}
.field-v{font-size:13px;font-weight:600;color:var(--texto);}
.docs-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px;}
.btn-doc{padding:7px 14px;border-radius:8px;border:1.5px solid;font-size:12px;font-weight:600;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:5px;}
.btn-cert{background:var(--azul-light);border-color:var(--azul);color:var(--azul-dark);}
.btn-dip{background:var(--verde-light);border-color:#5a8f1e;color:var(--verde);}
.btn-dc3{background:var(--ambar-light);border-color:var(--ambar);color:var(--ambar);}
/* Util */
.spin{width:18px;height:18px;border:2px solid var(--borde);border-top-color:var(--azul);border-radius:50%;animation:giro .7s linear infinite;display:inline-block;vertical-align:middle;}
@keyframes giro{to{transform:rotate(360deg)}}
.empty-row td{text-align:center;padding:40px;color:var(--texto-hint);font-size:13px;}
.loading-row td{text-align:center;padding:30px;}
</style>
</head>
<body>

<div class="header">
  <div class="hdr-l">
    <button class="btn-hdr" onclick="location.href='admin.html'">← Admin</button>
    <div>
      <div class="hdr-t">Personal / Cursos</div>
      <div class="hdr-s">Vista de supervisión — solo lectura</div>
    </div>
  </div>
  <div class="hdr-r">
    <span class="hdr-user" id="hdr-user">—</span>
    <button class="btn-hdr" onclick="logout()">Salir</button>
  </div>
</div>

<div class="wrap">

  <div class="stats">
    <div class="stat"><div class="stat-n" id="s-total" style="color:var(--azul)">—</div><div class="stat-l">Total</div></div>
    <div class="stat"><div class="stat-n" id="s-pend"  style="color:var(--ambar)">—</div><div class="stat-l">Pendientes</div></div>
    <div class="stat"><div class="stat-n" id="s-apro"  style="color:var(--azul)">—</div><div class="stat-l">Aprobados</div></div>
    <div class="stat"><div class="stat-n" id="s-emit"  style="color:var(--verde)">—</div><div class="stat-l">Emitidos</div></div>
    <div class="stat"><div class="stat-n" id="s-dev"   style="color:var(--rojo)">—</div><div class="stat-l">Devueltos</div></div>
  </div>

  <div class="filters">
    <input id="f-buscar" placeholder="Buscar nombre, CURP..." onkeydown="if(event.key==='Enter')cargarParticipantes()">
    <select id="f-curso"><option value="">Todos los cursos</option></select>
    <select id="f-estatus">
      <option value="">Todos los estatus</option>
      <option value="PENDIENTE">Pendiente</option>
      <option value="APROBADO_CALIDAD">Aprobado calidad</option>
      <option value="EMITIDO">Emitido</option>
      <option value="DEVUELTO">Devuelto</option>
    </select>
    <button class="btn-buscar" onclick="cargarParticipantes()">Buscar</button>
  </div>

  <div class="tbl-wrap">
    <div class="tbl-hdr">
      <div class="tbl-title">Participantes en cursos</div>
      <div class="tbl-count" id="tbl-count">—</div>
    </div>
    <div style="overflow-x:auto">
      <table>
        <thead>
          <tr>
            <th>Nombre</th><th>CURP</th><th>Empresa</th><th>Curso</th><th>Fecha</th><th>Estatus</th><th>Documentos</th>
          </tr>
        </thead>
        <tbody id="tabla">
          <tr class="loading-row"><td colspan="7"><span class="spin"></span></td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<!-- Modal detalle (solo lectura) -->
<div class="overlay" id="overlayDetalle" onclick="if(event.target===this)cerrarDetalle()">
  <div class="modal">
    <div class="modal-hdr">
      <div>
        <div class="modal-title" id="det-nombre">—</div>
        <div class="modal-sub" id="det-folio">—</div>
      </div>
      <button class="btn-close" onclick="cerrarDetalle()">✕</button>
    </div>
    <div class="modal-body" id="detalleBody">
      <div style="text-align:center;padding:40px"><span class="spin"></span></div>
    </div>
  </div>
</div>

<script>
const API = 'api/index.php';

// ── Fetch interceptor ──────────────────────────────────────────────────────
const _origFetch = window.fetch.bind(window);
window.fetch = function(url, opts = {}) {
  const s = JSON.parse(localStorage.getItem('avba_session') || '{}');
  const t = s.token || '';
  if (t && typeof url === 'string' && url.includes('api/index.php')) {
    if (!opts.method || opts.method.toUpperCase() === 'GET') {
      opts.headers = Object.assign({}, opts.headers || {}, {
        'Authorization': 'Bearer ' + t,
        'X-Token': t
      });
    } else {
      if (!(opts.body instanceof FormData)) {
        try { const b = JSON.parse(opts.body || '{}'); if (!b.token) { b.token = t; opts.body = JSON.stringify(b); } } catch(_) {}
      }
    }
  }
  return _origFetch(url, opts);
};

// ── Session guard ──────────────────────────────────────────────────────────
const _s = JSON.parse(localStorage.getItem('avba_session') || '{}');
if (!_s.token || !['ADMIN','CALIDAD'].includes(_s.rol)) { location.href = 'login.html'; }
document.getElementById('hdr-user').textContent = (_s.nombre || _s.usuario || '—') + ' · ' + _s.rol;

function logout() { localStorage.removeItem('avba_session'); location.href = 'login.html'; }

// ── Helpers ────────────────────────────────────────────────────────────────
function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function badgeEstatus(e) {
  const map = {
    'PENDIENTE':      'b-pend',
    'APROBADO_CALIDAD':'b-apro',
    'EMITIDO':        'b-emit',
    'DEVUELTO':       'b-dev'
  };
  const label = { 'APROBADO_CALIDAD':'Aprobado' };
  return `<span class="badge ${map[e]||''}">${esc(label[e]||e||'—')}</span>`;
}

// ── Cargar cursos para filtro ──────────────────────────────────────────────
async function cargarCursos() {
  try {
    const res  = await fetch(API + '?action=LISTAR_CURSOS');
    const data = await res.json();
    const sel  = document.getElementById('f-curso');
    (Array.isArray(data) ? data : []).forEach(c => {
      const opt = document.createElement('option');
      opt.value = c.id; opt.textContent = c.nombre;
      sel.appendChild(opt);
    });
  } catch(_) {}
}

// ── Cargar participantes ───────────────────────────────────────────────────
async function cargarParticipantes() {
  document.getElementById('tabla').innerHTML = '<tr class="loading-row"><td colspan="7"><span class="spin"></span></td></tr>';
  const buscar  = encodeURIComponent(document.getElementById('f-buscar').value.trim());
  const curso   = encodeURIComponent(document.getElementById('f-curso').value);
  const estatus = encodeURIComponent(document.getElementById('f-estatus').value);
  try {
    const res  = await fetch(`${API}?action=LISTAR_PARTICIPANTES&buscar=${buscar}&curso_id=${curso}&estatus=${estatus}`);
    const data = await res.json();
    const rows = Array.isArray(data) ? data : (data.data || []);
    renderTabla(rows);
    actualizarStats(rows);
  } catch(e) {
    document.getElementById('tabla').innerHTML = `<tr class="empty-row"><td colspan="7">Error al cargar: ${esc(e.message)}</td></tr>`;
    document.getElementById('tbl-count').textContent = '';
  }
}

function actualizarStats(rows) {
  document.getElementById('s-total').textContent = rows.length;
  document.getElementById('s-pend').textContent  = rows.filter(r => r.estatus === 'PENDIENTE').length;
  document.getElementById('s-apro').textContent  = rows.filter(r => r.estatus === 'APROBADO_CALIDAD').length;
  document.getElementById('s-emit').textContent  = rows.filter(r => r.estatus === 'EMITIDO').length;
  document.getElementById('s-dev').textContent   = rows.filter(r => r.estatus === 'DEVUELTO').length;
}

function renderTabla(rows) {
  document.getElementById('tbl-count').textContent = rows.length + ' registro' + (rows.length !== 1 ? 's' : '');
  if (!rows.length) {
    document.getElementById('tabla').innerHTML = '<tr class="empty-row"><td colspan="7">Sin registros para los filtros seleccionados.</td></tr>';
    return;
  }
  document.getElementById('tabla').innerHTML = rows.map(r => {
    return `<tr onclick="abrirDetalle(${r.id})">
      <td><strong>${esc(r.nombre_completo || '—')}</strong></td>
      <td style="font-family:monospace;font-size:11px">${esc(r.curp || '—')}</td>
      <td>${esc(r.empresa_nombre || '—')}</td>
      <td>${esc(r.curso_nombre || '—')}</td>
      <td>${esc(r.fecha_curso || '—')}</td>
      <td>${badgeEstatus(r.estatus)}</td>
      <td style="font-size:16px">${r.estatus === 'EMITIDO' ? '✅' : '—'}</td>
    </tr>`;
  }).join('');
}

// ── Detalle (solo lectura) ─────────────────────────────────────────────────
async function abrirDetalle(id) {
  document.getElementById('det-nombre').textContent = 'Cargando...';
  document.getElementById('det-folio').textContent  = '';
  document.getElementById('detalleBody').innerHTML  = '<div style="text-align:center;padding:40px"><span class="spin"></span></div>';
  document.getElementById('overlayDetalle').classList.add('open');
  try {
    const res  = await fetch(`${API}?action=OBTENER_PARTICIPANTE&id=${id}`);
    const d    = await res.json();
    if (!d || d.status === 'error') {
      document.getElementById('det-nombre').textContent = 'Error';
      document.getElementById('detalleBody').innerHTML = `<p style="color:var(--rojo);text-align:center;padding:20px">${esc(d?.message || 'No se pudo cargar el participante.')}</p>`;
      return;
    }
    document.getElementById('det-nombre').textContent = d.nombre_completo || '—';
    document.getElementById('det-folio').textContent  = d.control || '';
    renderDetalle(d);
  } catch(e) {
    document.getElementById('detalleBody').innerHTML = `<p style="color:var(--rojo);text-align:center;padding:20px">Error: ${esc(e.message)}</p>`;
  }
}

function campo(label, val) {
  return `<div class="field"><div class="field-l">${label}</div><div class="field-v">${esc(val||'—')}</div></div>`;
}

function renderDetalle(d) {
  const tipoLabel = { DC3: '📋 DC-3', DIPLOMA: '🎓 Diploma', CERTIFICADO: '📜 Certificado' };
  let docs = '';
  if (Array.isArray(d.documentos) && d.documentos.length) {
    // Latest doc per type — always regenerate on click so user sees latest design
    const latest = {};
    d.documentos.forEach(doc => { latest[doc.tipo_doc] = doc; });
    const colorCls = { DC3: 'btn-dc3', DIPLOMA: 'btn-dip', CERTIFICADO: 'btn-cert' };
    docs = `<div class="sec-title">Documentos generados</div><div class="docs-row">
      ${Object.values(latest).map(doc =>
        `<button class="btn-doc ${colorCls[doc.tipo_doc]||'btn-cert'}" onclick="prevDocPersonal(${d.id},'${doc.tipo_doc.toLowerCase()}')">${tipoLabel[doc.tipo_doc] || doc.tipo_doc} <span style="font-size:10px;opacity:.7">${esc(doc.fecha)}</span></button>`
      ).join('')}
    </div>`;
  }

  document.getElementById('detalleBody').innerHTML = `
    <div class="sec-title">Datos del participante</div>
    <div class="grid2">
      ${campo('Nombre completo', d.nombre_completo || d.nombre)}
      ${campo('CURP', d.curp)}
      ${campo('Puesto / Cargo', d.puesto)}
      ${campo('Teléfono', d.telefono)}
      ${campo('Correo', d.correo)}
      ${campo('Ocupación', d.ocupacion_nombre || d.ocupacion)}
    </div>
    <div class="sec-title">Empresa</div>
    <div class="grid2">
      ${campo('Empresa', d.empresa_nombre || d.empresa)}
      ${campo('RFC', d.empresa_rfc || d.rfc)}
      ${campo('Representante', d.empresa_representante || d.representante)}
    </div>
    <div class="sec-title">Curso</div>
    <div class="grid2">
      ${campo('Curso', d.curso_nombre || d.nombre_curso || d.curso)}
      ${campo('Fecha', d.fecha_curso || d.fecha)}
      ${campo('Duración', d.duracion_horas ? d.duracion_horas + ' hrs' : '')}
      ${campo('Capacidad adquirida', d.capacidad_na ? 'N/A' : (d.capacidad || ''))}
    </div>
    <div class="sec-title">Control de flujo</div>
    <div class="grid2">
      ${campo('Folio / Control', d.control || d.folio)}
      ${campo('Estatus', d.estatus)}
      ${campo('Registrado', d.fecha_alta || d.fecha_registro)}
      ${campo('QR asignado', d.qr_codigo || '')}
    </div>
    ${docs}`;
}

function cerrarDetalle() { document.getElementById('overlayDetalle').classList.remove('open'); }

// ── Regenerar documento ────────────────────────────────────────────────────
async function prevDocPersonal(participanteId, tipo) {
  try {
    const res  = await fetch(API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'GENERAR_DOC_PERSONAL', payload: { id: participanteId, tipo } })
    });
    const data = await res.json();
    if (data.status === 'success' && data.url) {
      window.open(data.url, '_blank');
    } else {
      alert('Error: ' + (data.message || 'No se pudo generar el documento'));
    }
  } catch(e) { alert('Error de conexion'); }
}

// ── Init ───────────────────────────────────────────────────────────────────
(async function init() {
  await cargarCursos();
  await cargarParticipantes();
})();
</script>
</body>
</html>
