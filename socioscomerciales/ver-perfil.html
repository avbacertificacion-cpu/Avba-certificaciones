<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Perfil del candidato — Socios Comerciales AVBA</title>
<meta name="description" content="Perfil profesional de un candidato en Socios Comerciales AVBA.">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="stylesheet" href="assets/avba.css">
<style>
  /* ── Accesibilidad base ──────────────────────────────── */
  a:focus-visible, button:focus-visible {
    outline: 3px solid var(--acento); outline-offset: 2px; border-radius: var(--r-sm);
  }
  .sr-solo {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }

  /* ── Volver ──────────────────────────────────────────── */
  .volver-link {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 13.5px; font-weight: 600; color: var(--texto-sub); margin: 22px 0 14px;
  }
  .volver-link:hover { color: var(--azul); }
  .volver-link svg { width: 15px; height: 15px; }

  /* ── Encabezado del perfil ───────────────────────────── */
  /* La portada compartida es un degradado plano; aquí le damos profundidad
     para que el encabezado del CV se sienta más cuidado. */
  .portada { position: relative; overflow: hidden; }
  .portada::after {
    content: ''; position: absolute; inset: 0;
    background:
      radial-gradient(circle at 86% 16%, rgba(77,163,255,.38), transparent 56%),
      radial-gradient(circle at 10% 96%, rgba(255,255,255,.12), transparent 52%);
  }
  .perfil-acciones { display: flex; flex-wrap: wrap; gap: 9px; padding-bottom: 6px; }
  .perfil-id { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; margin-top: 12px; }
  .perfil-id .perfil-nombre { margin-top: 0; }

  /* ── Rejilla de dos columnas ─────────────────────────── */
  .detalle { display: grid; gap: 18px; grid-template-columns: 1fr; align-items: start; }
  @media (min-width: 900px) {
    .detalle { grid-template-columns: minmax(0, 1.85fr) minmax(0, 1fr); }
    .col-lateral { position: sticky; top: 78px; }
  }
  .col-principal, .col-lateral { min-width: 0; }

  .card-titulo h2 { font-size: 16px; font-weight: 700; letter-spacing: -.2px; }
  .card-cuenta { flex-shrink: 0; }

  /* ── Texto libre ─────────────────────────────────────── */
  .resumen {
    font-size: 14.5px; color: var(--texto-sub); line-height: 1.75;
    white-space: pre-line; overflow-wrap: anywhere; margin-top: 10px;
  }

  /* ── Línea de tiempo (experiencia y educación) ───────── */
  .linea { margin-top: 12px; }
  .linea-item { position: relative; padding: 0 0 22px 28px; }
  .linea-item:last-child { padding-bottom: 0; }
  .linea-item::before {
    content: ''; position: absolute; left: 6px; top: 21px; bottom: 0;
    width: 2px; background: var(--borde);
  }
  .linea-item:last-child::before { display: none; }
  .linea-punto {
    position: absolute; left: 0; top: 5px; width: 14px; height: 14px;
    border-radius: 50%; background: var(--blanco);
    border: 2px solid var(--azul); box-shadow: 0 0 0 3px var(--azul-claro);
  }
  .linea-punto.actual { border-color: var(--verde); box-shadow: 0 0 0 3px var(--verde-bg); }
  .linea-punto.estudio { border-color: var(--texto-tenue); box-shadow: 0 0 0 3px var(--gris-fondo); }
  .linea-titulo { font-size: 14.5px; font-weight: 700; line-height: 1.35; overflow-wrap: anywhere; }
  .linea-sub { font-size: 13.5px; font-weight: 600; color: var(--texto-sub); margin-top: 2px; overflow-wrap: anywhere; }
  .linea-fechas {
    display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
    font-size: 12px; color: var(--texto-tenue); margin-top: 5px;
  }
  .linea-desc {
    font-size: 13px; color: var(--texto-sub); margin-top: 9px;
    line-height: 1.65; white-space: pre-line; overflow-wrap: anywhere;
  }

  /* ── Habilidades ─────────────────────────────────────── */
  .chips { margin-top: 12px; }
  .chip { padding: 7px 13px; }

  /* ── Ficha de contacto ───────────────────────────────── */
  .datos-lista { display: grid; gap: 13px; margin-top: 12px; }
  .dato { display: flex; gap: 10px; align-items: flex-start; }
  .dato > svg { width: 16px; height: 16px; color: var(--texto-tenue); flex-shrink: 0; margin-top: 3px; }
  .dato-etiqueta {
    display: block; font-size: 11px; font-weight: 700; letter-spacing: .5px;
    text-transform: uppercase; color: var(--texto-tenue);
  }
  .dato-valor { font-size: 13.5px; color: var(--texto); overflow-wrap: anywhere; }
  .contacto-acciones { display: grid; gap: 9px; margin-top: 16px; }
  .nota-tenue { font-size: 12.5px; color: var(--texto-tenue); margin-top: 10px; line-height: 1.5; }

  /* ── Estados vacíos dentro de una tarjeta ────────────── */
  .seccion-vacia {
    display: flex; align-items: center; gap: 10px; margin-top: 12px;
    font-size: 13.5px; color: var(--texto-tenue);
    background: var(--gris-fondo); border: 1px dashed var(--borde);
    border-radius: var(--r-sm); padding: 14px 16px;
  }
  .seccion-vacia svg { width: 17px; height: 17px; flex-shrink: 0; }

  /* ── Estado de página completa (error / sin perfil) ──── */
  .estado-pagina {
    background: var(--blanco); border: 1px solid var(--borde);
    border-radius: var(--r-md); box-shadow: var(--sombra-sm);
    text-align: center; padding: 58px 22px;
  }
  .estado-pagina > svg { width: 46px; height: 46px; color: var(--borde); margin-bottom: 14px; }
  .estado-pagina h1 { font-size: 19px; font-weight: 800; letter-spacing: -.3px; margin-bottom: 8px; }
  .estado-pagina p { font-size: 14px; color: var(--texto-sub); max-width: 430px; margin: 0 auto 18px; }

  /* ── Esqueletos de carga ─────────────────────────────── */
  .sk { background: #E7EEF7; border-radius: var(--r-sm); position: relative; overflow: hidden; }
  .sk::after {
    content: ''; position: absolute; inset: 0; transform: translateX(-100%);
    background: linear-gradient(90deg, transparent, rgba(255,255,255,.8), transparent);
    animation: sk-brillo 1.5s infinite;
  }
  .sk-linea { height: 12px; margin-bottom: 10px; }
  .sk-avatar { width: 104px; height: 104px; border-radius: 50%; margin-top: -48px; border: 4px solid var(--blanco); }
  .sk-boton { height: 34px; width: 130px; border-radius: var(--r-sm); }
  @keyframes sk-brillo { 100% { transform: translateX(100%); } }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: .001ms !important; animation-iteration-count: 1 !important;
      transition-duration: .001ms !important;
    }
  }

  /* ── Impresión: el perfil es un CV, debe imprimirse bien ── */
  @media print {
    .navbar, .pie, .volver-link, .perfil-acciones, .contacto-acciones { display: none !important; }
    body { background: #fff; }
    .detalle { grid-template-columns: 1fr; }
    .card, .perfil-card { box-shadow: none; break-inside: avoid; }
    .portada { height: 60px; }
  }
</style>
</head>
<body>

<header id="navbar"></header>

<main class="wrap contenido">
  <a class="volver-link" href="candidatos.html" id="volver"></a>
  <p class="sr-solo" id="aviso-estado" role="status" aria-live="polite"></p>
  <div id="contenido" aria-busy="true"></div>
</main>

<footer id="pie"></footer>

<script src="assets/avba.js"></script>
<script>
let sesion = null;
const idPersona = Number(new URLSearchParams(location.search).get('id') || 0);

/* Los archivos del portal llegan como ruta relativa (uploads/...) y el sitio
   web como URL absoluta. Cualquier otra cosa (javascript:, data:) se descarta
   antes de usarse como href. */
function rutaSegura(valor) {
  const s = String(valor === null || valor === undefined ? '' : valor).trim();
  if (!s) return '';
  if (/^https?:\/\//i.test(s)) return s;
  if (/^[a-z][a-z0-9+.-]*:/i.test(s)) return '';
  if (s.slice(0, 2) === '//') return '';
  return s;
}

function anunciar(texto) {
  const el = document.getElementById('aviso-estado');
  if (el) el.textContent = texto;
}

function seccionVacia(icono, texto) {
  return `<p class="seccion-vacia">${scIcono(icono)}<span>${scEsc(texto)}</span></p>`;
}

function estadoPagina(icono, titulo, texto) {
  return `<div class="estado-pagina">
    ${scIcono(icono)}
    <h1>${scEsc(titulo)}</h1>
    <p>${scEsc(texto)}</p>
    <a class="btn btn-outline" id="btn-estado-volver" href="candidatos.html">${scIcono('atras')}Volver</a>
  </div>`;
}

/* ── Esqueleto de carga ────────────────────────────────── */
function esqueleto() {
  const lineas = (n, anchos) =>
    Array.from({ length: n }, (_, i) =>
      `<div class="sk sk-linea" style="width:${anchos[i % anchos.length]}"></div>`).join('');

  return `
    <div class="perfil-card mb-16">
      <div class="portada"></div>
      <div class="perfil-cuerpo">
        <div class="perfil-avatar-fila">
          <div class="sk sk-avatar"></div>
          <div class="perfil-acciones">
            <div class="sk sk-boton"></div>
            <div class="sk sk-boton"></div>
          </div>
        </div>
        <div style="margin-top:16px;max-width:420px">
          <div class="sk sk-linea" style="height:22px;width:56%"></div>
          <div class="sk sk-linea" style="width:76%"></div>
          <div class="sk sk-linea" style="width:44%;margin-bottom:0"></div>
        </div>
      </div>
    </div>
    <div class="detalle">
      <div class="col-principal">
        <div class="card">
          <div class="sk sk-linea" style="height:16px;width:38%;margin-bottom:16px"></div>
          ${lineas(4, ['100%', '96%', '90%', '62%'])}
        </div>
        <div class="card">
          <div class="sk sk-linea" style="height:16px;width:30%;margin-bottom:16px"></div>
          ${lineas(5, ['70%', '48%', '100%', '92%', '55%'])}
        </div>
      </div>
      <div class="col-lateral">
        <div class="card">
          <div class="sk sk-linea" style="height:16px;width:52%;margin-bottom:16px"></div>
          ${lineas(3, ['86%', '68%', '78%'])}
        </div>
      </div>
    </div>`;
}

/* ── Bloques de contenido ──────────────────────────────── */
function bloqueExperiencia(exp) {
  if (!exp.length) return seccionVacia('maletin', 'Este candidato aún no registra experiencia laboral.');

  return `<div class="linea">${exp.map(e => {
    const actual = Number(e.actual) === 1 || e.actual === true;
    const rango  = scRangoFechas(e.desde, e.hasta, actual);
    return `<div class="linea-item">
      <span class="linea-punto${actual ? ' actual' : ''}" aria-hidden="true"></span>
      <h3 class="linea-titulo">${scEsc(e.puesto)}</h3>
      <p class="linea-sub">${scEsc(e.empresa)}</p>
      <p class="linea-fechas">
        ${rango ? `<span>${scEsc(rango)}</span>` : ''}
        ${actual ? '<span class="badge badge-verde">Puesto actual</span>' : ''}
      </p>
      ${e.descripcion ? `<p class="linea-desc">${scEsc(e.descripcion)}</p>` : ''}
    </div>`;
  }).join('')}</div>`;
}

function bloqueEducacion(edu) {
  if (!edu.length) return seccionVacia('documento', 'Este candidato aún no registra formación académica.');

  return `<div class="linea">${edu.map(e => {
    const rango = [e.anio_inicio, e.anio_fin].filter(Boolean).join(' — ');
    return `<div class="linea-item">
      <span class="linea-punto estudio" aria-hidden="true"></span>
      <h3 class="linea-titulo">${scEsc(e.titulo)}</h3>
      <p class="linea-sub">${scEsc(e.institucion)}</p>
      <p class="linea-fechas"><span>${scEsc(rango || 'Sin fechas registradas')}</span></p>
    </div>`;
  }).join('')}</div>`;
}

function bloqueContacto(p, cv, correoHref) {
  return `<div class="card">
    <div class="card-titulo"><h2>Contacto</h2></div>
    <div class="datos-lista">
      <div class="dato">
        ${scIcono('correo')}
        <div>
          <span class="dato-etiqueta">Correo</span>
          <span class="dato-valor">${scEsc(p.correo)}</span>
        </div>
      </div>
      ${p.ubicacion ? `<div class="dato">
        ${scIcono('ubicacion')}
        <div>
          <span class="dato-etiqueta">Ubicación</span>
          <span class="dato-valor">${scEsc(p.ubicacion)}</span>
        </div>
      </div>` : ''}
    </div>
    <div class="contacto-acciones">
      ${cv
        ? `<button type="button" class="btn btn-primary btn-bloque" data-accion="cv">
             ${scIcono('documento')}Descargar CV</button>`
        : ''}
      <a class="btn btn-outline btn-bloque" href="${scEsc(correoHref)}">${scIcono('enviar')}Enviar correo</a>
    </div>
    ${cv ? '' : '<p class="nota-tenue">Este candidato todavía no adjunta su CV al portal.</p>'}
  </div>`;
}

/* ── Pintado principal ─────────────────────────────────── */
function pintar(datos) {
  const p   = datos.persona || {};
  const exp = datos.experiencia || [];
  const edu = datos.educacion   || [];
  const hab = datos.habilidades || [];

  document.title = (p.nombre || 'Perfil del candidato') + ' — Socios Comerciales AVBA';

  const cv         = rutaSegura(p.cv_url);
  const correoHref = 'mailto:' + encodeURIComponent(p.correo || '');
  const verificado = Number(p.correo_verificado) === 1;
  const enBlanco   = !p.resumen && !exp.length && !edu.length && !hab.length;

  const encabezado = `
    <article class="perfil-card mb-16">
      <div class="portada"></div>
      <div class="perfil-cuerpo">
        <div class="perfil-avatar-fila">
          ${scAvatar(p.foto_url, p.nombre, 'xl')}
          <div class="perfil-acciones">
            ${cv
              ? `<button type="button" class="btn btn-primary btn-sm" data-accion="cv">
                   ${scIcono('documento')}Descargar CV</button>`
              : ''}
            <a class="btn btn-outline btn-sm" href="${scEsc(correoHref)}">${scIcono('correo')}Contactar</a>
          </div>
        </div>

        <div class="perfil-id">
          <h1 class="perfil-nombre">${scEsc(p.nombre)}</h1>
          ${verificado ? scBadgeVerificado(true) : ''}
        </div>
        ${p.headline ? `<p class="perfil-headline">${scEsc(p.headline)}</p>` : ''}
        <div class="perfil-meta">
          ${p.ubicacion ? `<span>${scIcono('ubicacion')}${scEsc(p.ubicacion)}</span>` : ''}
          <span>${scIcono('correo')}${scEsc(p.correo)}</span>
          ${cv ? `<span>${scIcono('documento')}CV disponible</span>` : ''}
        </div>
      </div>
    </article>`;

  const principal = enBlanco
    ? `<div class="card">
         <div class="card-titulo"><h2>Perfil en construcción</h2></div>
         ${seccionVacia('persona', 'Este candidato todavía no completa su experiencia, formación ni habilidades.')}
         <p class="nota-tenue">Puedes escribirle directamente para conocer más sobre su trayectoria.</p>
       </div>`
    : `${p.resumen ? `<div class="card">
           <div class="card-titulo"><h2>Resumen profesional</h2></div>
           <p class="resumen">${scEsc(p.resumen)}</p>
         </div>` : ''}

       <div class="card">
         <div class="card-titulo">
           <h2>Experiencia</h2>
           ${exp.length ? `<span class="badge badge-gris card-cuenta">${exp.length}</span>` : ''}
         </div>
         ${bloqueExperiencia(exp)}
       </div>

       <div class="card">
         <div class="card-titulo">
           <h2>Educación</h2>
           ${edu.length ? `<span class="badge badge-gris card-cuenta">${edu.length}</span>` : ''}
         </div>
         ${bloqueEducacion(edu)}
       </div>`;

  const lateral = `
    ${hab.length ? `<div class="card">
       <div class="card-titulo">
         <h2>Habilidades</h2>
         <span class="badge badge-gris card-cuenta">${hab.length}</span>
       </div>
       <div class="chips">${hab.map(h => `<span class="chip">${scEsc(h.habilidad)}</span>`).join('')}</div>
     </div>` : ''}
    ${bloqueContacto(p, cv, correoHref)}`;

  document.getElementById('contenido').innerHTML = `
    ${encabezado}
    <div class="detalle">
      <div class="col-principal">${principal}</div>
      <aside class="col-lateral" aria-label="Contacto y habilidades">${lateral}</aside>
    </div>`;

  anunciar('Perfil de ' + (p.nombre || 'candidato') + ' cargado.');
}

/* ── Carga ─────────────────────────────────────────────── */
async function cargar() {
  const cont = document.getElementById('contenido');
  cont.setAttribute('aria-busy', 'true');
  cont.innerHTML = esqueleto();
  anunciar('Cargando perfil...');

  const fallar = (titulo, texto) => {
    cont.innerHTML = estadoPagina('alerta', titulo, texto);
    const btn = document.getElementById('btn-estado-volver');
    if (btn) btn.href = document.getElementById('volver').href;
    anunciar(titulo);
  };

  try {
    if (!idPersona) {
      fallar('Perfil no indicado', 'El enlace no incluye un candidato válido. Vuelve al listado y elige un perfil.');
      return;
    }

    const datos = await scGet('GET_PERSONA_PUBLICA', { id: idPersona });
    if (datos.status !== 'success' || !datos.persona) {
      fallar('No encontramos este perfil',
             datos.message || 'El candidato ya no está disponible o el enlace es incorrecto.');
      return;
    }
    pintar(datos);
  } catch (e) {
    fallar('No pudimos cargar el perfil', e.message || 'Revisa tu conexión e intenta de nuevo.');
  } finally {
    cont.setAttribute('aria-busy', 'false');
  }
}

/* El CV ya no es un archivo estático: se pide al API con la sesión.
   Delegación para que sirva en los botones de la cabecera y del lateral. */
document.addEventListener('click', (e) => {
  const b = e.target.closest('[data-accion="cv"]');
  if (b && idPersona) scVerCV(idPersona);
});

window.addEventListener('DOMContentLoaded', () => {
  sesion = scExigirSesion();
  if (!sesion) return;

  const esEmpresa = sesion.tipo === 'empresa';
  scPintarNavbar(esEmpresa ? 'candidatos.html' : 'perfil-persona.html');
  scPintarPie();

  const volver = document.getElementById('volver');
  volver.innerHTML = scIcono('atras') + (esEmpresa ? 'Volver a candidatos' : 'Volver');
  volver.href = esEmpresa ? 'candidatos.html' : 'perfil-persona.html';

  // Una empresa aquí ve la ficha de un candidato, así que exige correo
  // confirmado. Un candidato solo puede abrir la suya (el API lo verifica),
  // y ver su propio perfil sí está permitido sin verificar.
  if (esEmpresa && !scBloquearSinVerificar('contenido', 'El perfil del candidato')) {
    document.getElementById('contenido').setAttribute('aria-busy', 'false');
    return;
  }

  cargar();
});
</script>
</body>
</html>
