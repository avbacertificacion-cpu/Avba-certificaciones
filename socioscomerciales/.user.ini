; Socios Comerciales AVBA — Configuración PHP para Hostinger (php-fpm)
; PHP-FPM lee este archivo automáticamente; las directivas php_value en
; .htaccess NO funcionan en este host (darían Error 500).

; ── Sesiones aisladas del sistema de certificaciones ──────
; Limita la cookie de sesión a /socioscomerciales para que nunca
; colisione con la sesión del sistema principal en la raíz del dominio.
session.cookie_path = /socioscomerciales
session.cookie_httponly = 1
session.cookie_secure = 1
session.use_strict_mode = 1

; ── Uploads (CV en PDF hasta 8M, imágenes hasta 4M) ───────
upload_max_filesize = 10M
post_max_size = 12M
max_input_time = 120

; ── Seguridad ─────────────────────────────────────────────
display_errors = Off
display_startup_errors = Off
log_errors = On
expose_php = Off

; ── Ejecución ─────────────────────────────────────────────
max_execution_time = 120
memory_limit = 256M
