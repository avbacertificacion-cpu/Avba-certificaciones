; Socios Comerciales AVBA — Configuración PHP para Hostinger (php-fpm)
;
; OJO: el diagnóstico (api/index.php?action=DIAGNOSTICO) muestra los
; límites globales del host, no los de este archivo, así que en este
; servidor .user.ini NO se está aplicando. Los ajustes que el portal
; necesita de verdad se fijan por código en api/index.php con ini_set().
; Este archivo se conserva porque no estorba y sirve si el host llega a
; habilitar user_ini.
;
; Las directivas php_value en .htaccess NO funcionan aquí (darían 500):
; el host corre PHP-FPM y Apache no reconoce esa directiva.

; ── Sesiones aisladas del sistema de certificaciones ──────
; Limita la cookie de sesión a /socioscomerciales para que nunca
; colisione con la sesión del sistema principal en la raíz del dominio.
session.cookie_path = /socioscomerciales
session.cookie_httponly = 1
session.cookie_secure = 1
session.use_strict_mode = 1

; ── Uploads (CV en PDF hasta 8M, imágenes hasta 4M) ───────
upload_max_filesize = 10M
post_max_size = 12M
max_input_time = 120

; ── Seguridad ─────────────────────────────────────────────
display_errors = Off
display_startup_errors = Off
log_errors = On
expose_php = Off

; ── Ejecución ─────────────────────────────────────────────
max_execution_time = 120
memory_limit = 256M
