<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mis postulaciones — Socios Comerciales AVBA</title>
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="stylesheet" href="assets/avba.css">
<style>
  /* ── Foco visible consistente ─────────────────────────── */
  a:focus-visible, button:focus-visible, select:focus-visible {
    outline: 3px solid rgba(24, 95, 165, .42);
    outline-offset: 2px;
  }

  /* ── Resumen superior ─────────────────────────────────── */
  .resumen { display: grid; gap: 10px; grid-template-columns: repeat(2, 1fr); margin-bottom: 20px; }
  @media (min-width: 700px) { .resumen { grid-template-columns: repeat(4, 1fr); } }
  .resumen-caja {
    background: var(--blanco); border: 1px solid var(--borde);
    border-radius: var(--r); padding: 14px 15px;
  }
  .resumen-valor { font-size: 24px; font-weight: 800; letter-spacing: -.5px; line-height: 1.15; }
  .resumen-etq { font-size: 11.5px; font-weight: 700; color: var(--texto-sub); margin-top: 3px; }
  .resumen-caja.v-azul  .resumen-valor { color: var(--azul); }
  .resumen-caja.v-ambar .resumen-valor { color: #B45309; }
  .resumen-caja.v-verde .resumen-valor { color: #15803D; }
  .resumen-caja.v-rojo  .resumen-valor { color: #B91C1C; }

  /* ── Barra de filtros ─────────────────────────────────── */
  .barra-tabs {
    display: flex; align-items: center; gap: 10px 12px;
    flex-wrap: wrap; margin-bottom: 16px;
  }
  .barra-tabs[hidden] { display: none; }
  .tabs-filtro {
    display: flex; gap: 6px; flex-wrap: nowrap; overflow-x: auto;
    padding: 4px; background: var(--blanco); border: 1px solid var(--borde);
    border-radius: 999px; scrollbar-width: none; max-width: 100%;
  }
  .tabs-filtro::-webkit-scrollbar { display: none; }
  .tab-filtro {
    display: inline-flex; align-items: center; gap: 7px; white-space: nowrap;
    padding: 8px 15px; border-radius: 999px; border: none;
    background: transparent; color: var(--texto-sub);
    font-family: inherit; font-size: 13px; font-weight: 700; cursor: pointer;
    transition: background .15s, color .15s;
  }
  .tab-filtro:hover { background: var(--gris-fondo); color: var(--azul); }
  .tab-filtro[aria-pressed="true"] { background: var(--azul); color: #fff; }
  .tab-num {
    font-size: 11px; font-weight: 800; line-height: 1;
    background: var(--gris-fondo); color: var(--texto-sub);
    padding: 3px 7px; border-radius: 999px;
  }
  .tab-filtro[aria-pressed="true"] .tab-num { background: rgba(255,255,255,.24); color: #fff; }

  .orden { display: flex; align-items: center; gap: 8px; margin-left: auto; }
  .orden label { font-size: 12px; font-weight: 700; color: var(--texto-sub); white-space: nowrap; }
  .orden select {
    padding: 7px 11px; border: 1.5px solid var(--borde); border-radius: var(--r-sm);
    font-size: 13px; font-weight: 600; color: var(--texto); background: var(--blanco);
    outline: none; cursor: pointer;
  }
  .orden select:focus { border-color: var(--azul); }

  .estado-lista { font-size: 13px; font-weight: 600; color: var(--texto-sub); margin-bottom: 12px; min-height: 18px; }

  /* ── Tarjeta de postulación ───────────────────────────── */
  .tarjeta-post { position: relative; border-left: 4px solid var(--borde); }
  .tarjeta-post.e-enviada     { border-left-color: var(--azul); }
  .tarjeta-post.e-en_revision { border-left-color: var(--ambar); }
  .tarjeta-post.e-aceptada    { border-left-color: var(--verde); }
  .tarjeta-post.e-rechazada   { border-left-color: var(--rojo); }
  .post-mensaje {
    font-size: 12.5px; color: var(--texto-sub); line-height: 1.55; margin-top: 10px;
    padding: 9px 12px; background: var(--gris-fondo); border-radius: var(--r-sm);
    border-left: 2px solid var(--borde);
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
  }
  .post-mensaje b { color: var(--texto-tenue); font-weight: 700; }

  /* ── Seguimiento del estatus ──────────────────────────── */
  .pasos { display: flex; align-items: flex-start; margin: 14px 0 2px; }
  .paso { flex: 1; text-align: center; position: relative; }
  .paso-punto {
    width: 14px; height: 14px; border-radius: 50%; margin: 0 auto 6px;
    background: var(--borde); border: 2px solid var(--blanco); box-shadow: 0 0 0 1px var(--borde);
  }
  .paso-etq { font-size: 10.5px; font-weight: 700; color: var(--texto-tenue); line-height: 1.3; }
  .paso::before {
    content: ''; position: absolute; top: 6px; left: -50%; width: 100%; height: 2px; background: var(--borde);
  }
  .paso:first-child::before { display: none; }
  .paso.hecho .paso-punto { background: var(--azul); box-shadow: 0 0 0 1px var(--azul); }
  .paso.hecho .paso-etq { color: var(--azul-oscuro); }
  .paso.hecho::before { background: var(--azul); }
  .paso.ok .paso-punto { background: var(--verde); box-shadow: 0 0 0 1px var(--verde); }
  .paso.ok .paso-etq { color: #15803D; }
  .paso.no .paso-punto { background: var(--rojo); box-shadow: 0 0 0 1px var(--rojo); }
  .paso.no .paso-etq { color: #B91C1C; }
  .paso-nota { font-size: 12px; color: var(--texto-sub); margin-top: 10px; line-height: 1.5; }

  /* ── Esqueletos ───────────────────────────────────────── */
  .esq { background: #E9EFF7; border-radius: 6px; position: relative; overflow: hidden; }
  .esq::after {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,.8), transparent);
    transform: translateX(-100%); animation: sc-brillo 1.4s infinite;
  }
  @keyframes sc-brillo { 100% { transform: translateX(100%); } }
  .esq-linea { height: 11px; }
  .esq-pie { margin-top: 14px; padding-top: 13px; border-top: 1px solid var(--borde); display: flex; justify-content: space-between; gap: 10px; }

  .sugerencias { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }

  @media (prefers-reduced-motion: reduce) {
    .esq::after { animation: none; }
    .tarjeta-lista, .btn, .tab-filtro { transition: none !important; }
    .tarjeta-lista:hover { transform: none; }
  }
</style>
</head>
<body>

<header id="navbar"></header>

<main class="wrap contenido">
  <div class="pagina-titulo">
    <h1>Mis postulaciones</h1>
    <p>Sigue el estatus de cada vacante a la que te postulaste.</p>
  </div>

  <div id="resumen"></div>

  <div class="barra-tabs" id="barra-tabs" hidden>
    <div class="tabs-filtro" id="tabs" role="group" aria-label="Filtrar por estatus"></div>
    <div class="orden">
      <label for="f-orden">Ordenar por</label>
      <select id="f-orden">
        <option value="reciente">Más recientes</option>
        <option value="antigua">Más antiguas</option>
      </select>
    </div>
  </div>

  <p class="estado-lista" id="estado-lista" role="status" aria-live="polite"></p>
  <div id="lista" aria-busy="false"></div>
</main>

<footer id="pie"></footer>

<script src="assets/avba.js"></script>
<script>
let sesion = null;
let todas  = [];
let filtro = 'todas';

const FILTROS = [
  { clave: 'todas',       texto: 'Todas' },
  { clave: 'enviada',     texto: 'Enviadas' },
  { clave: 'en_revision', texto: 'En revisión' },
  { clave: 'aceptada',    texto: 'Aceptadas' },
  { clave: 'rechazada',   texto: 'No avanzaron' },
];
const CLAVES_VALIDAS = FILTROS.map(f => f.clave);

/* ── Utilidades ─────────────────────────────────────────── */

function fechaMs(valor) {
  if (!valor) return 0;
  const d = new Date(String(valor).replace(' ', 'T'));
  return isNaN(d) ? 0 : d.getTime();
}

function cuenta(clave) {
  return clave === 'todas' ? todas.length : todas.filter(p => p.estatus === clave).length;
}

const NOTA_ESTATUS = {
  enviada:     'La empresa aún no abre tu postulación. Mantén tu perfil al día por si la revisan hoy.',
  en_revision: 'Alguien de la empresa ya está revisando tu perfil. Atento a tu correo.',
  aceptada:    '¡La empresa avanzó contigo! Te contactarán al correo de tu cuenta.',
  rechazada:   'Esta vez no avanzaste. Hay más vacantes abiertas que van con tu perfil.',
};

/** Línea de avance de la postulación. */
function pasosHtml(estatus) {
  const orden = { enviada: 1, en_revision: 2, aceptada: 3, rechazada: 3 };
  const n = orden[estatus] || 1;
  const finClase = estatus === 'aceptada' ? 'ok' : estatus === 'rechazada' ? 'no' : '';
  const finTexto = estatus === 'aceptada' ? 'Aceptada'
                 : estatus === 'rechazada' ? 'No avanzó' : 'Resultado';

  const pasos = [
    { etq: 'Enviada',     clase: n >= 1 ? 'hecho' : '' },
    { etq: 'En revisión', clase: n >= 2 ? 'hecho' : '' },
    { etq: finTexto,      clase: n >= 3 ? (finClase || 'hecho') : '' },
  ];

  return `<div class="pasos" role="img" aria-label="Avance: ${scEsc(finTexto)}">
    ${pasos.map(p => `<div class="paso ${p.clase}">
        <div class="paso-punto"></div><div class="paso-etq">${scEsc(p.etq)}</div>
      </div>`).join('')}
  </div>`;
}

/* ── Pintado ────────────────────────────────────────────── */

function pintarResumen() {
  const cont = document.getElementById('resumen');
  if (!todas.length) { cont.innerHTML = ''; return; }

  const proceso = cuenta('enviada') + cuenta('en_revision');
  const cajas = [
    { clase: 'v-azul',  valor: todas.length,        etq: todas.length === 1 ? 'Postulación' : 'Postulaciones' },
    { clase: 'v-ambar', valor: proceso,             etq: 'En proceso' },
    { clase: 'v-verde', valor: cuenta('aceptada'),  etq: 'Aceptadas' },
    { clase: 'v-rojo',  valor: cuenta('rechazada'), etq: 'No avanzaron' },
  ];
  cont.innerHTML = `<div class="resumen">${cajas.map(c => `
    <div class="resumen-caja ${c.clase}">
      <div class="resumen-valor">${scEsc(c.valor)}</div>
      <div class="resumen-etq">${scEsc(c.etq)}</div>
    </div>`).join('')}</div>`;
}

function pintarTabs() {
  document.getElementById('barra-tabs').hidden = !todas.length;
  // data-filtro solo lleva claves fijas del arreglo FILTROS.
  document.getElementById('tabs').innerHTML = FILTROS.map(f => {
    const n = cuenta(f.clave);
    return `<button type="button" class="tab-filtro" data-filtro="${f.clave}"
              aria-pressed="${filtro === f.clave ? 'true' : 'false'}">
              ${scEsc(f.texto)}<span class="tab-num">${n}</span>
            </button>`;
  }).join('');
}

function esqueletos(n) {
  const uno = `
    <div class="tarjeta-lista" aria-hidden="true">
      <div class="tarjeta-encabezado">
        <div class="esq" style="width:48px;height:48px;border-radius:var(--r);flex-shrink:0"></div>
        <div style="flex:1;min-width:0">
          <div class="esq esq-linea" style="width:56%;height:14px"></div>
          <div class="esq esq-linea" style="width:36%;margin-top:9px"></div>
          <div class="esq esq-linea" style="width:72%;margin-top:14px"></div>
        </div>
      </div>
      <div class="esq-pie">
        <div class="esq esq-linea" style="width:104px;height:20px;border-radius:999px"></div>
        <div class="esq esq-linea" style="width:104px;height:30px;border-radius:var(--r-sm)"></div>
      </div>
    </div>`;
  let html = '';
  for (let i = 0; i < n; i++) html += uno;
  return `<div class="resultados">${html}</div>`;
}

function tarjeta(p) {
  const est = SC_ESTATUS_POSTULACION[p.estatus] || { texto: p.estatus, clase: 'badge-gris' };
  const cerrada = p.vacante_estatus === 'cerrada';
  const modKey  = String(p.modalidad || '').toLowerCase();
  // Clase por estatus desde una lista blanca: nunca metemos datos del API en class="".
  const claseEst = CLAVES_VALIDAS.indexOf(p.estatus) > 0 ? 'e-' + p.estatus : '';

  return `
    <article class="tarjeta-lista tarjeta-post ${claseEst}">
      <div class="tarjeta-encabezado">
        ${scAvatar(p.logo_url, p.empresa, 'md', true)}
        <div style="flex:1;min-width:0">
          <h2 class="tarjeta-nombre"><a href="vacante.html?id=${Number(p.vacante_id)}">${scEsc(p.titulo)}</a></h2>
          <div class="tarjeta-sub">
            <a href="ver-empresa.html?id=${Number(p.empresa_id)}">${scEsc(p.empresa)}</a>
          </div>
          <div class="tarjeta-datos">
            ${p.ubicacion ? `<span>${scIcono('ubicacion')}${scEsc(p.ubicacion)}</span>` : ''}
            <span>${scIcono('maletin')}${scEsc(SC_MODALIDADES[modKey] || p.modalidad || 'Sin especificar')}</span>
            ${p.salario ? `<span>${scIcono('dinero')}${scEsc(p.salario)}</span>` : ''}
            <span>${scIcono('reloj')}Postulado ${scEsc(scHace(p.fecha))}</span>
          </div>
          ${p.mensaje ? `<p class="post-mensaje"><b>Tu mensaje:</b> ${scEsc(p.mensaje)}</p>` : ''}
        </div>
      </div>

      ${pasosHtml(p.estatus)}
      ${NOTA_ESTATUS[p.estatus] ? `<p class="paso-nota">${scEsc(NOTA_ESTATUS[p.estatus])}</p>` : ''}

      <div class="tarjeta-pie">
        <div class="fila" style="gap:8px">
          <span class="badge ${est.clase}">${scEsc(est.texto)}</span>
          ${cerrada ? '<span class="badge badge-gris">Vacante cerrada</span>' : ''}
        </div>
        <a class="btn btn-sm btn-gris" href="vacante.html?id=${Number(p.vacante_id)}">Ver vacante</a>
      </div>
    </article>`;
}

function vacioDelFiltro() {
  const f = FILTROS.find(x => x.clave === filtro) || FILTROS[0];
  const textos = {
    enviada:     'No tienes postulaciones esperando revisión ahora mismo.',
    en_revision: 'Ninguna empresa está revisando tu perfil en este momento.',
    aceptada:    'Todavía no tienes una postulación aceptada. Sigue postulándote: entre más vacantes, más oportunidades.',
    rechazada:   'Ninguna de tus postulaciones fue descartada. Buena señal.',
  };
  return scVacio('vacia', 'Nada en “' + f.texto + '”',
    textos[filtro] || 'No hay postulaciones con ese estatus.',
    `<div class="sugerencias">
       <button type="button" class="btn btn-sm btn-outline" data-filtro="todas">Ver todas mis postulaciones</button>
       <a class="btn btn-sm btn-primary" href="vacantes.html">Buscar más vacantes</a>
     </div>`);
}

function pintarLista() {
  const cont  = document.getElementById('lista');
  const orden = document.getElementById('f-orden').value;
  const est   = document.getElementById('estado-lista');

  if (!todas.length) {
    est.textContent = '';
    cont.innerHTML = scVacio('enviar', 'Aún no te has postulado',
      'Explora la bolsa de trabajo y postúlate a las vacantes que van con tu experiencia. Con el perfil completo tardas menos de un minuto por vacante.',
      `<div class="sugerencias">
         <a class="btn btn-primary" href="vacantes.html">${scIcono('lupa')}Buscar vacantes</a>
         <a class="btn btn-outline" href="perfil-persona.html">Completar mi perfil</a>
       </div>`);
    return;
  }

  let lista = filtro === 'todas' ? todas.slice() : todas.filter(p => p.estatus === filtro);
  lista.sort((a, b) => orden === 'antigua'
    ? fechaMs(a.fecha) - fechaMs(b.fecha)
    : fechaMs(b.fecha) - fechaMs(a.fecha));

  const nombreFiltro = (FILTROS.find(x => x.clave === filtro) || FILTROS[0]).texto.toLowerCase();
  est.textContent = lista.length === 0
    ? 'Sin postulaciones en “' + nombreFiltro + '”'
    : (lista.length === 1 ? '1 postulación' : lista.length + ' postulaciones') +
      (filtro === 'todas' ? '' : ' en “' + nombreFiltro + '”');

  cont.innerHTML = lista.length
    ? `<div class="resultados">${lista.map(tarjeta).join('')}</div>`
    : vacioDelFiltro();
}

function cambiarFiltro(clave) {
  if (CLAVES_VALIDAS.indexOf(clave) === -1) return;
  filtro = clave;
  pintarTabs();
  pintarLista();
}

/* ── Carga ──────────────────────────────────────────────── */

async function cargar() {
  const cont = document.getElementById('lista');
  cont.setAttribute('aria-busy', 'true');
  cont.innerHTML = esqueletos(3);

  try {
    const datos = await scGet('MIS_POSTULACIONES');
    cont.setAttribute('aria-busy', 'false');

    if (datos.status !== 'success') {
      document.getElementById('estado-lista').textContent = '';
      cont.innerHTML = scVacio('alerta', 'No se pudieron cargar tus postulaciones',
        datos.message || 'Intenta de nuevo en un momento.',
        '<button type="button" class="btn btn-outline" onclick="cargar()">Reintentar</button>');
      return;
    }

    todas = datos.postulaciones || [];
    pintarResumen();
    pintarTabs();
    pintarLista();

  } catch (e) {
    cont.setAttribute('aria-busy', 'false');
    document.getElementById('estado-lista').textContent = '';
    cont.innerHTML = scVacio('alerta', 'Error al cargar', e.message,
      '<button type="button" class="btn btn-outline" onclick="cargar()">Reintentar</button>');
  }
}

/* ── Eventos ────────────────────────────────────────────── */

// Delegación: pestañas y botones del estado vacío.
// data-filtro solo contiene claves fijas, nunca datos del API.
document.addEventListener('click', (e) => {
  const btn = e.target.closest && e.target.closest('[data-filtro]');
  if (!btn) return;
  e.preventDefault();
  cambiarFiltro(btn.getAttribute('data-filtro'));
});

document.getElementById('f-orden').addEventListener('change', pintarLista);

window.addEventListener('DOMContentLoaded', () => {
  sesion = scExigirSesion('persona');
  if (!sesion) return;

  scPintarNavbar('mis-postulaciones.html');
  scPintarPie();
  cargar();
});
</script>
</body>
</html>
