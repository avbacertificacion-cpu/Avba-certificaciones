<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Perfil de la empresa — Socios Comerciales AVBA</title>
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="stylesheet" href="assets/avba.css">
<style>
  .volver-link {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 13.5px; font-weight: 600; color: var(--texto-sub); margin: 22px 0 14px;
  }
  .volver-link:hover { color: var(--azul); }
  .volver-link svg { width: 15px; height: 15px; }
  .descripcion { font-size: 14.5px; color: var(--texto-sub); line-height: 1.7; white-space: pre-line; }
</style>
</head>
<body>

<header id="navbar"></header>

<main class="wrap contenido">
  <a class="volver-link" href="empresas.html" id="volver"></a>
  <div id="contenido"></div>
</main>

<footer id="pie"></footer>

<script src="assets/avba.js"></script>
<script>
let sesion = null;
const idEmpresa = Number(new URLSearchParams(location.search).get('id') || 0);

function pintar(datos) {
  const e = datos.empresa;
  const vacantes = datos.vacantes || [];
  document.title = e.nombre + ' — Socios Comerciales AVBA';

  document.getElementById('contenido').innerHTML = `
    <div class="perfil-card mb-16">
      <div class="portada"></div>
      <div class="perfil-cuerpo">
        <div class="perfil-avatar-fila">
          ${scAvatar(e.logo_url, e.nombre, 'xl', true)}
          ${e.sitio_web ? `<div class="fila" style="padding-bottom:6px">
            <a class="btn btn-outline btn-sm" href="${scEsc(e.sitio_web)}" target="_blank" rel="noopener">
              ${scIcono('enlace')}Sitio web</a>
          </div>` : ''}
        </div>

        <div class="fila" style="gap:9px;margin-top:12px">
          <h1 class="perfil-nombre" style="margin-top:0">${scEsc(e.nombre)}</h1>
          ${Number(e.correo_verificado) ? scBadgeVerificado(true) : ''}
        </div>
        ${e.giro ? `<p class="perfil-headline">${scEsc(e.giro)}</p>` : ''}
        <div class="perfil-meta">
          ${e.ubicacion ? `<span>${scIcono('ubicacion')}${scEsc(e.ubicacion)}</span>` : ''}
          <span>${scIcono('maletin')}${vacantes.length} vacante${vacantes.length === 1 ? '' : 's'} abierta${vacantes.length === 1 ? '' : 's'}</span>
        </div>
      </div>
    </div>

    ${e.descripcion ? `<div class="card">
      <div class="card-titulo"><h3>Sobre la empresa</h3></div>
      <div class="descripcion">${scEsc(e.descripcion)}</div>
    </div>` : ''}

    <div class="card">
      <div class="card-titulo"><h3>Vacantes abiertas</h3></div>
      ${vacantes.length ? vacantes.map(v => `
        <div class="item">
          <div class="item-cuerpo">
            <div class="item-titulo"><a href="vacante.html?id=${v.id}">${scEsc(v.titulo)}</a></div>
            <div class="tarjeta-datos">
              ${v.ubicacion ? `<span>${scIcono('ubicacion')}${scEsc(v.ubicacion)}</span>` : ''}
              <span>${scIcono('maletin')}${scEsc(SC_MODALIDADES[v.modalidad] || v.modalidad)}</span>
              ${v.salario ? `<span>${scIcono('dinero')}${scEsc(v.salario)}</span>` : ''}
              <span>${scIcono('reloj')}${scEsc(scHace(v.creado))}</span>
            </div>
          </div>
          <div class="item-acciones">
            <a class="btn btn-sm btn-suave" href="vacante.html?id=${v.id}">Ver</a>
          </div>
        </div>`).join('')
        : '<p class="texto-tenue" style="font-size:13.5px">Esta empresa no tiene vacantes abiertas por ahora.</p>'}
    </div>`;
}

async function cargar() {
  const cont = document.getElementById('contenido');
  cont.innerHTML = scCargando('Cargando empresa...');

  if (!idEmpresa) {
    cont.innerHTML = scVacio('alerta', 'Empresa no indicada', 'El enlace no incluye una empresa válida.', '');
    return;
  }

  try {
    const datos = await scGet('GET_EMPRESA_PUBLICA', { id: idEmpresa });
    if (datos.status !== 'success') {
      cont.innerHTML = scVacio('alerta', 'No se encontró la empresa', datos.message, '');
      return;
    }
    pintar(datos);
  } catch (e) {
    cont.innerHTML = scVacio('alerta', 'Error al cargar', e.message, '');
  }
}

window.addEventListener('DOMContentLoaded', () => {
  sesion = scExigirSesion();
  if (!sesion) return;

  scPintarNavbar(sesion.tipo === 'empresa' ? 'perfil-empresa.html' : 'empresas.html');
  scPintarPie();

  const volver = document.getElementById('volver');
  const esEmpresa = sesion.tipo === 'empresa';
  volver.innerHTML = scIcono('atras') + (esEmpresa ? 'Volver' : 'Volver a empresas');
  volver.href = esEmpresa ? 'inicio.html' : 'empresas.html';

  cargar();
});
</script>
</body>
</html>
