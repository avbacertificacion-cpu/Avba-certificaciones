<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Iniciar sesión — Socios Comerciales AVBA</title>
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="stylesheet" href="assets/avba.css">
<style>
  body {
    background: linear-gradient(160deg, var(--hero-1) 0%, var(--hero-2) 100%);
    min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px 20px;
  }
  .acceso { width: 100%; max-width: 410px; }
  .acceso-marca { text-align: center; padding-bottom: 18px; margin-bottom: 20px; border-bottom: 1px solid var(--borde); }
  .acceso-marca p { font-size: 12px; font-weight: 700; color: var(--azul); letter-spacing: .5px; text-transform: uppercase; }
  .acceso .card { box-shadow: var(--sombra-lg); border: none; padding: 30px 28px 26px; border-radius: var(--r-lg); }
  .acceso h1 { font-size: 19px; font-weight: 700; margin-bottom: 4px; }
  .acceso-sub { font-size: 13px; color: var(--texto-sub); margin-bottom: 22px; }
  .acceso-pie { text-align: center; margin-top: 18px; font-size: 13px; color: var(--texto-sub); }
  .acceso-pie a { color: var(--azul); font-weight: 600; }
  .volver { display: block; text-align: center; margin-top: 18px; font-size: 13px; color: rgba(255,255,255,.72); }
  .volver:hover { color: #fff; }
  .legal { text-align: center; margin-top: 14px; font-size: 11.5px; color: rgba(255,255,255,.45); }
  .ver-pass {
    background: none; border: none; cursor: pointer; color: var(--texto-tenue);
    font-size: 12px; font-weight: 600; padding: 0;
  }
  .campo-fila { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
  .campo-fila label { margin-bottom: 0; }
</style>
</head>
<body>

<div class="acceso">
  <div class="card">
    <div class="acceso-marca">
      <img src="assets/avba-logo.png" alt="AVBA" class="logo logo-acceso">
      <p>Socios Comerciales</p>
    </div>

    <h1>Iniciar sesión</h1>
    <p class="acceso-sub">Accede a tu cuenta de candidato o empresa</p>

    <div class="alerta alerta-error oculto" id="error"></div>

    <form id="form-login" novalidate>
      <div class="campo">
        <label for="correo">Correo electrónico</label>
        <input type="email" id="correo" autocomplete="email" placeholder="tucorreo@ejemplo.com" required>
      </div>

      <div class="campo">
        <div class="campo-fila">
          <label for="password">Contraseña</label>
          <button type="button" class="ver-pass" id="ver-pass">Mostrar</button>
        </div>
        <input type="password" id="password" autocomplete="current-password" placeholder="Tu contraseña" required>
      </div>

      <div style="text-align:right;margin:-6px 0 16px">
        <a href="recuperar.html" style="font-size:12.5px;font-weight:600;color:var(--azul)">¿Olvidaste tu contraseña?</a>
      </div>

      <button type="submit" class="btn btn-primary btn-bloque btn-lg" id="btn-entrar">Entrar</button>
    </form>

    <p class="acceso-pie">¿No tienes cuenta? <a href="registro.html">Regístrate gratis</a></p>
  </div>

  <a class="volver" href="index.html">&larr; Volver al inicio</a>
  <p class="legal">AVBA Inspections, Certifications and Maintenance S.A.S. de C.V.</p>
</div>

<script src="assets/avba.js"></script>
<script>
const $error = document.getElementById('error');

function mostrarError(msg) {
  $error.innerHTML = scIcono('alerta') + '<div>' + scEsc(msg) + '</div>';
  $error.classList.remove('oculto');
}
function limpiarError() { $error.classList.add('oculto'); }

document.getElementById('ver-pass').addEventListener('click', () => {
  const inp = document.getElementById('password');
  const btn = document.getElementById('ver-pass');
  const mostrando = inp.type === 'text';
  inp.type = mostrando ? 'password' : 'text';
  btn.textContent = mostrando ? 'Mostrar' : 'Ocultar';
});

document.getElementById('form-login').addEventListener('submit', async (e) => {
  e.preventDefault();
  limpiarError();

  const correo   = document.getElementById('correo').value.trim();
  const password = document.getElementById('password').value;

  if (!correo || !password) { mostrarError('Ingresa tu correo y contraseña.'); return; }

  const btn = document.getElementById('btn-entrar');
  btn.disabled = true;
  btn.innerHTML = '<div class="spin"></div> Verificando...';

  try {
    const datos = await scPost('LOGIN', { correo, password });

    if (datos.status !== 'success') {
      mostrarError(datos.message || 'No se pudo iniciar sesión.');
      return;
    }

    scSesion.guardar({
      usuario_id: datos.usuario_id,
      tipo:       datos.tipo,
      correo:     datos.correo,
      nombre:     datos.nombre,
      token:      datos.token,
      correo_verificado: datos.correo_verificado,
    });

    location.href = 'inicio.html';

  } catch (err) {
    mostrarError(err.message || 'Error de conexión. Intenta de nuevo.');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Entrar';
  }
});

window.addEventListener('DOMContentLoaded', () => {
  document.getElementById('correo').focus();
});
</script>
</body>
</html>
