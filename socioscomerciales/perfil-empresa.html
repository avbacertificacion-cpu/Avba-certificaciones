<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mi empresa — Socios Comerciales AVBA</title>
<style>
  :root {
    --azul:        #185FA5;
    --azul-oscuro: #0C447C;
    --azul-claro:  #E6F1FB;
    --acento:      #4DA3FF;
    --verde:       #22C55E;
    --rojo:        #EF4444;
    --rojo-claro:  #FDECEC;
    --texto:       #1A2A44;
    --texto-sub:   #566079;
    --gris-fondo:  #F4F7FB;
    --borde:       #DBE3EE;
    --blanco:      #FFFFFF;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { overflow-x: hidden; max-width: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    background: var(--gris-fondo); color: var(--texto);
  }
  a { text-decoration: none; color: inherit; }
  .wrap { max-width: 880px; margin: 0 auto; padding: 0 20px; }

  .navbar { background: linear-gradient(160deg, #0B1A33 0%, #123A6B 100%); }
  .navbar .wrap { display: flex; align-items: center; justify-content: space-between; height: 64px; }
  .brand-mark { font-size: 20px; font-weight: 800; color: #fff; letter-spacing: -.5px; }
  .brand-mark .accent { color: var(--acento); }
  .nav-actions { display: flex; align-items: center; gap: 10px; }
  .nav-actions span { font-size: 13px; color: rgba(255,255,255,0.75); display: none; }
  @media (min-width: 560px) { .nav-actions span { display: inline; } }
  .btn-logout {
    padding: 8px 16px; border-radius: 9px; font-size: 13px; font-weight: 600;
    background: transparent; color: #fff; border: 1.5px solid rgba(255,255,255,0.35); cursor: pointer;
  }
  .btn-logout:hover { background: rgba(255,255,255,0.1); }

  .content { padding: 28px 0 60px; }

  .card {
    background: var(--blanco); border: 1px solid var(--borde); border-radius: 16px;
    padding: 22px; margin-bottom: 20px;
  }
  .card h3 { font-size: 15.5px; font-weight: 700; margin-bottom: 4px; }
  .card .card-sub { font-size: 12.5px; color: var(--texto-sub); margin-bottom: 16px; }

  .profile-head { display: flex; flex-wrap: wrap; gap: 18px; align-items: center; }
  .logo-box {
    width: 84px; height: 84px; border-radius: 16px; background: var(--azul-claro);
    display: flex; align-items: center; justify-content: center; overflow: hidden;
    border: 3px solid var(--blanco); box-shadow: 0 0 0 1px var(--borde); flex-shrink: 0;
  }
  .logo-box img { width: 100%; height: 100%; object-fit: cover; }
  .logo-box svg { width: 34px; height: 34px; color: var(--azul); }
  .profile-info { flex: 1; min-width: 180px; }
  .profile-info h2 { font-size: 20px; font-weight: 800; }
  .profile-info .giro { font-size: 13.5px; color: var(--texto-sub); margin-top: 2px; }
  .profile-info .meta { font-size: 12.5px; color: var(--texto-sub); margin-top: 6px; display: flex; gap: 14px; flex-wrap: wrap; }
  .upload-actions { display: flex; flex-direction: column; gap: 8px; }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    padding: 9px 15px; border-radius: 9px; font-size: 13px; font-weight: 600;
    cursor: pointer; border: none; transition: background .15s, transform .1s;
  }
  .btn:active { transform: scale(0.98); }
  .btn-primary { background: var(--azul); color: #fff; }
  .btn-primary:hover { background: var(--azul-oscuro); }
  .btn-outline { background: transparent; color: var(--azul); border: 1.5px solid var(--azul); }
  .btn-outline:hover { background: var(--azul-claro); }
  .btn-sm { padding: 6px 11px; font-size: 12px; }
  input[type=file] { display: none; }

  .grid2 { display: grid; gap: 14px; grid-template-columns: 1fr; }
  @media (min-width: 620px) { .grid2 { grid-template-columns: 1fr 1fr; } }
  .field label { display: block; font-size: 12px; font-weight: 600; color: var(--texto-sub); margin-bottom: 6px; }
  .field input, .field textarea {
    width: 100%; padding: 10px 12px; border: 1.5px solid var(--borde); border-radius: 9px;
    font-size: 13.5px; color: var(--texto); outline: none; font-family: inherit;
    transition: border-color .15s, box-shadow .15s;
  }
  .field input:focus, .field textarea:focus { border-color: var(--azul); box-shadow: 0 0 0 3px rgba(24,95,165,0.1); }
  .field textarea { resize: vertical; min-height: 90px; }
  .field-full { grid-column: 1 / -1; }
  .form-actions { display: flex; justify-content: flex-end; margin-top: 14px; }

  .banner {
    background: var(--azul-claro); border: 1px solid #c9e0f5; border-radius: 12px;
    padding: 14px 16px; font-size: 13px; color: var(--azul-oscuro); margin-bottom: 20px;
  }

  .toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: var(--texto); color: #fff; padding: 11px 18px; border-radius: 10px;
    font-size: 13.5px; opacity: 0; pointer-events: none; transition: opacity .2s, bottom .2s; z-index: 50;
  }
  .toast.show { opacity: 1; bottom: 30px; }
  .toast.error { background: var(--rojo); }
  .toast.success { background: var(--verde); }
</style>
</head>
<body>

<nav class="navbar">
  <div class="wrap">
    <div class="brand-mark">AV<span class="accent">BA</span></div>
    <div class="nav-actions">
      <span id="nav-correo"></span>
      <button class="btn-logout" onclick="salir()">Salir</button>
    </div>
  </div>
</nav>

<div class="content wrap">

  <div class="card">
    <div class="profile-head">
      <div class="logo-box" id="logo-box">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 21h18M5 21V7l7-4 7 4v14M9 21v-6h6v6"/></svg>
      </div>
      <div class="profile-info">
        <h2 id="e-nombre">—</h2>
        <div class="giro" id="e-giro">Agrega el giro de tu empresa</div>
        <div class="meta">
          <span id="e-ubicacion"></span>
          <span id="e-correo"></span>
        </div>
      </div>
      <div class="upload-actions">
        <label class="btn btn-outline btn-sm" for="input-logo">Cambiar logo</label>
        <input type="file" id="input-logo" accept="image/png,image/jpeg,image/webp" onchange="subirLogo(this)">
      </div>
    </div>
  </div>

  <div class="banner">
    Próximamente: publica vacantes y busca candidatos calificados directamente desde este panel.
  </div>

  <div class="card">
    <h3>Datos de la empresa</h3>
    <div class="card-sub">Esta información aparece en tu perfil público dentro del portal.</div>
    <div class="grid2">
      <div class="field">
        <label>Nombre de la empresa</label>
        <input type="text" id="f-nombre">
      </div>
      <div class="field">
        <label>Giro / Industria</label>
        <input type="text" id="f-giro" placeholder="Ej. Inspección de maquinaria">
      </div>
      <div class="field">
        <label>Ubicación</label>
        <input type="text" id="f-ubicacion" placeholder="Ciudad, Estado">
      </div>
      <div class="field">
        <label>Sitio web</label>
        <input type="text" id="f-sitio" placeholder="https://...">
      </div>
      <div class="field field-full">
        <label>Descripción</label>
        <textarea id="f-descripcion" placeholder="Cuéntanos sobre tu empresa..."></textarea>
      </div>
    </div>
    <div class="form-actions">
      <button class="btn btn-primary" onclick="guardarDatos()">Guardar cambios</button>
    </div>
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
const API = "api/index.php";
let sesion = null;

function cargarSesion() {
  const raw = localStorage.getItem("sc_session");
  if (!raw) { window.location.href = "login.html"; return null; }
  const s = JSON.parse(raw);
  if (s.tipo !== "empresa") { window.location.href = "perfil-persona.html"; return null; }
  return s;
}

function mostrarToast(msg, tipo) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.className = "toast show" + (tipo ? " " + tipo : "");
  setTimeout(() => { t.className = "toast"; }, 2600);
}

async function apiFetch(action, payload) {
  const res = await fetch(API, {
    method: "POST",
    headers: { "Authorization": "Bearer " + sesion.token },
    body: JSON.stringify({ action, payload: payload || {} })
  });
  return res.json();
}

async function apiUpload(action, inputEl) {
  const file = inputEl.files[0];
  if (!file) return null;
  const fd = new FormData();
  fd.append("action", action);
  fd.append("archivo", file);
  const res = await fetch(API, {
    method: "POST",
    headers: { "Authorization": "Bearer " + sesion.token },
    body: fd
  });
  return res.json();
}

function salir() {
  apiFetch("LOGOUT").catch(() => {});
  localStorage.removeItem("sc_session");
  window.location.href = "index.html";
}

function pintarPerfil(e) {
  document.getElementById("e-nombre").textContent = e.nombre || "—";
  document.getElementById("e-giro").textContent = e.giro || "Agrega el giro de tu empresa";
  document.getElementById("e-ubicacion").textContent = e.ubicacion || "";
  document.getElementById("e-correo").textContent = e.correo || "";
  document.getElementById("nav-correo").textContent = e.correo || "";

  document.getElementById("f-nombre").value      = e.nombre || "";
  document.getElementById("f-giro").value        = e.giro || "";
  document.getElementById("f-ubicacion").value   = e.ubicacion || "";
  document.getElementById("f-sitio").value       = e.sitio_web || "";
  document.getElementById("f-descripcion").value = e.descripcion || "";

  if (e.logo_url) {
    document.getElementById("logo-box").innerHTML = `<img src="${e.logo_url}" alt="Logo">`;
  }
}

async function cargarPerfil() {
  const res = await fetch(API + "?action=GET_PERFIL_EMPRESA", {
    headers: { "Authorization": "Bearer " + sesion.token }
  });
  const data = await res.json();
  if (data.status !== "success") {
    mostrarToast(data.message || "No se pudo cargar el perfil.", "error");
    return;
  }
  pintarPerfil(data.empresa);
}

async function guardarDatos() {
  const payload = {
    nombre:      document.getElementById("f-nombre").value.trim(),
    giro:        document.getElementById("f-giro").value.trim(),
    ubicacion:   document.getElementById("f-ubicacion").value.trim(),
    sitio_web:   document.getElementById("f-sitio").value.trim(),
    descripcion: document.getElementById("f-descripcion").value.trim(),
  };
  const data = await apiFetch("ACTUALIZAR_PERFIL_EMPRESA", payload);
  if (data.status === "success") {
    mostrarToast("Perfil actualizado.", "success");
    cargarPerfil();
  } else {
    mostrarToast(data.message || "Error al guardar.", "error");
  }
}

async function subirLogo(input) {
  const data = await apiUpload("SUBIR_LOGO", input);
  if (!data) return;
  if (data.status === "success") {
    mostrarToast("Logo actualizado.", "success");
    document.getElementById("logo-box").innerHTML = `<img src="${data.logo_url}" alt="Logo">`;
  } else {
    mostrarToast(data.message || "Error al subir el logo.", "error");
  }
  input.value = "";
}

window.onload = function() {
  sesion = cargarSesion();
  if (sesion) cargarPerfil();
};
</script>
</body>
</html>
