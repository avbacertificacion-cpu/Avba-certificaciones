<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mi empresa — Socios Comerciales AVBA</title>
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="stylesheet" href="assets/avba.css">
<style>
  .foto-envoltura { position: relative; }
  .foto-boton {
    position: absolute; right: -2px; bottom: -2px;
    width: 34px; height: 34px; border-radius: 50%;
    background: var(--azul); color: #fff; border: 3px solid #fff;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
    box-shadow: var(--sombra); transition: background .15s;
  }
  .foto-boton:hover { background: var(--azul-oscuro); }
  .foto-boton svg { width: 15px; height: 15px; }
</style>
</head>
<body>

<header id="navbar"></header>

<main class="wrap contenido" style="padding-top:22px">
  <div id="aviso-verificacion"></div>

  <div class="perfil-card mb-16">
    <div class="portada"></div>
    <div class="perfil-cuerpo">
      <div class="perfil-avatar-fila">
        <div class="foto-envoltura">
          <div id="logo-caja"></div>
          <button class="foto-boton" id="btn-logo" title="Cambiar logo"></button>
          <input type="file" id="input-logo" accept="image/jpeg,image/png,image/webp,image/gif" class="oculto-file">
        </div>
        <div class="fila" style="padding-bottom:6px">
          <a class="btn btn-outline btn-sm" id="btn-ver-publico" href="#">Ver perfil público</a>
          <a class="btn btn-primary btn-sm" href="mis-vacantes.html?nueva=1">Publicar vacante</a>
        </div>
      </div>

      <h1 class="perfil-nombre" id="e-nombre">—</h1>
      <p class="perfil-headline" id="e-giro"></p>
      <div class="perfil-meta" id="e-meta"></div>
    </div>
  </div>

  <div class="card">
    <div class="card-titulo"><h3>Datos de la empresa</h3></div>
    <p class="card-sub">Esta información aparece en tu perfil público y junto a tus vacantes.</p>

    <form id="form-datos">
      <div class="rejilla rejilla-2">
        <div class="campo">
          <label for="f-nombre">Nombre de la empresa</label>
          <input type="text" id="f-nombre" required>
        </div>
        <div class="campo">
          <label for="f-giro">Giro o industria</label>
          <input type="text" id="f-giro" placeholder="Ej. Manufactura, construcción, logística">
        </div>
        <div class="campo">
          <label for="f-ubicacion">Ubicación</label>
          <input type="text" id="f-ubicacion" placeholder="Ciudad, Estado">
        </div>
        <div class="campo">
          <label for="f-sitio">Sitio web</label>
          <input type="text" id="f-sitio" placeholder="www.tuempresa.com">
        </div>
        <div class="campo col-full">
          <label for="f-descripcion">Descripción</label>
          <textarea id="f-descripcion" placeholder="A qué se dedica tu empresa, servicios, certificaciones..."></textarea>
        </div>
      </div>
      <div class="form-acciones">
        <button type="submit" class="btn btn-primary" id="btn-guardar">Guardar cambios</button>
      </div>
    </form>
  </div>
</main>

<footer id="pie"></footer>

<script src="assets/avba.js"></script>
<script>
let sesion  = null;
let empresa = null;

function pintar(e) {
  empresa = e;

  document.getElementById('logo-caja').innerHTML = scAvatar(e.logo_url, e.nombre, 'xl', true);
  document.getElementById('e-nombre').textContent = e.nombre || '—';
  document.getElementById('e-giro').textContent   = e.giro || 'Agrega el giro de tu empresa';
  document.getElementById('btn-ver-publico').href = 'ver-empresa.html?id=' + e.id;

  const meta = [];
  if (e.ubicacion) meta.push(`<span>${scIcono('ubicacion')}${scEsc(e.ubicacion)}</span>`);
  meta.push(`<span>${scIcono('correo')}${scEsc(e.correo)}</span>`);
  if (e.sitio_web) {
    meta.push(`<span>${scIcono('enlace')}<a href="${scEsc(e.sitio_web)}" target="_blank" rel="noopener"
      style="color:var(--azul);font-weight:600">${scEsc(e.sitio_web.replace(/^https?:\/\//, ''))}</a></span>`);
  }
  meta.push(`<span>${scIcono('maletin')}${e.vacantes_abiertas || 0} vacantes abiertas</span>`);
  if (Number(e.correo_verificado)) meta.push(scBadgeVerificado(true));
  document.getElementById('e-meta').innerHTML = meta.join('');

  document.getElementById('f-nombre').value      = e.nombre || '';
  document.getElementById('f-giro').value        = e.giro || '';
  document.getElementById('f-ubicacion').value   = e.ubicacion || '';
  document.getElementById('f-sitio').value       = e.sitio_web || '';
  document.getElementById('f-descripcion').value = e.descripcion || '';

  scAvisoVerificacion(Number(e.correo_verificado));
  scSesion.actualizar({ nombre: e.nombre, correo_verificado: Number(e.correo_verificado) });
}

async function cargar() {
  try {
    const datos = await scGet('GET_PERFIL_EMPRESA');
    if (datos.status !== 'success') { scToast(datos.message, 'error'); return; }
    pintar(datos.empresa);
  } catch (e) {
    scToast(e.message, 'error');
  }
}

/* Subida del logo con manejo real de errores */
document.getElementById('btn-logo').addEventListener('click', () => document.getElementById('input-logo').click());
document.getElementById('input-logo').addEventListener('change', async (e) => {
  const archivo = e.target.files[0];
  if (!archivo) return;

  scToast('Subiendo logo...');
  try {
    const datos = await scSubir('SUBIR_LOGO', archivo);
    if (datos.status === 'success') {
      scToast(datos.message, 'ok');
      const url = datos.logo_url + '?v=' + Date.now();
      document.getElementById('logo-caja').innerHTML =
        scAvatar(url, empresa ? empresa.nombre : '', 'xl', true);
    } else {
      scToast(datos.message || 'No se pudo subir el logo.', 'error');
    }
  } catch (err) {
    scToast(err.message, 'error');
  } finally {
    e.target.value = '';
  }
});

document.getElementById('form-datos').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('btn-guardar');
  btn.disabled = true;
  btn.innerHTML = '<div class="spin"></div> Guardando...';

  try {
    const datos = await scPost('ACTUALIZAR_PERFIL_EMPRESA', {
      nombre:      document.getElementById('f-nombre').value.trim(),
      giro:        document.getElementById('f-giro').value.trim(),
      ubicacion:   document.getElementById('f-ubicacion').value.trim(),
      sitio_web:   document.getElementById('f-sitio').value.trim(),
      descripcion: document.getElementById('f-descripcion').value.trim(),
    });
    scToast(datos.message, datos.status === 'success' ? 'ok' : 'error');
    if (datos.status === 'success') cargar();
  } catch (err) {
    scToast(err.message, 'error');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Guardar cambios';
  }
});

window.addEventListener('DOMContentLoaded', () => {
  sesion = scExigirSesion('empresa');
  if (!sesion) return;

  scPintarNavbar('perfil-empresa.html');
  scPintarPie();
  document.getElementById('btn-logo').innerHTML = scIcono('camara');

  cargar();
});
</script>
</body>
</html>
