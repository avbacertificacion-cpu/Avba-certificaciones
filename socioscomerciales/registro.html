<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crear cuenta — Socios Comerciales AVBA</title>
<meta name="description" content="Crea tu cuenta gratis en Socios Comerciales AVBA, como candidato o como empresa.">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="stylesheet" href="assets/avba.css">
<style>
  body {
    background: linear-gradient(160deg, var(--hero-1) 0%, var(--hero-2) 100%);
    min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px 20px;
  }
  .acceso { width: 100%; max-width: 430px; }
  .acceso-marca { text-align: center; padding-bottom: 18px; margin-bottom: 20px; border-bottom: 1px solid var(--borde); }
  .acceso-marca p { font-size: 12px; font-weight: 700; color: var(--azul); letter-spacing: .5px; text-transform: uppercase; }
  .acceso .card { box-shadow: var(--sombra-lg); border: none; padding: 26px 26px 24px; border-radius: var(--r-lg); }
  .acceso h1 { font-size: 19px; font-weight: 700; margin-bottom: 4px; }
  .acceso-sub { font-size: 13px; color: var(--texto-sub); margin-bottom: 20px; }
  .acceso-pie { text-align: center; margin-top: 18px; font-size: 13px; color: var(--texto-sub); }
  .acceso-pie a { color: var(--azul); font-weight: 600; }
  .volver { display: block; text-align: center; margin-top: 18px; font-size: 13px; color: rgba(255,255,255,.72); }
  .volver:hover { color: #fff; }
  .legal { text-align: center; margin-top: 14px; font-size: 11.5px; color: rgba(255,255,255,.45); }

  .tabs { display: flex; background: var(--gris-fondo); border-radius: var(--r); padding: 4px; margin-bottom: 22px; }
  .tab {
    flex: 1; display: flex; align-items: center; justify-content: center; gap: 7px;
    padding: 11px 8px; border-radius: var(--r-sm); font-size: 13.5px; font-weight: 700;
    color: var(--texto-sub); cursor: pointer; user-select: none; border: none; background: none;
    transition: background .15s, color .15s, box-shadow .15s;
  }
  .tab svg { width: 16px; height: 16px; }
  .tab.activo { background: #fff; color: var(--azul); box-shadow: var(--sombra-sm); }

  .fuerza { height: 5px; background: var(--borde); border-radius: 999px; overflow: hidden; margin-top: 7px; }
  .fuerza span { display: block; height: 100%; width: 0; border-radius: 999px; transition: width .25s, background .25s; }
</style>
</head>
<body>

<div class="acceso">
  <div class="card">
    <div class="acceso-marca">
      <img src="assets/avba-logo.png" alt="AVBA" class="logo logo-acceso">
      <p>Socios Comerciales</p>
    </div>

    <div class="tabs">
      <button type="button" class="tab activo" id="tab-persona" data-tipo="persona"></button>
      <button type="button" class="tab" id="tab-empresa" data-tipo="empresa"></button>
    </div>

    <h1 id="titulo">Crear cuenta de candidato</h1>
    <p class="acceso-sub" id="subtitulo">Regístrate para armar tu perfil profesional</p>

    <div class="alerta alerta-error oculto" id="error"></div>

    <form id="form-registro" novalidate>
      <div class="campo">
        <label for="nombre" id="label-nombre">Nombre completo</label>
        <input type="text" id="nombre" autocomplete="name" placeholder="Nombre completo" required>
      </div>

      <div class="campo">
        <label for="correo">Correo electrónico</label>
        <input type="email" id="correo" autocomplete="email" placeholder="tucorreo@ejemplo.com" required>
        <div class="campo-ayuda">Te enviaremos un enlace para confirmarlo.</div>
      </div>

      <div class="campo">
        <label for="password">Contraseña</label>
        <input type="password" id="password" autocomplete="new-password" placeholder="Mínimo 8 caracteres" minlength="8" required>
        <div class="fuerza"><span id="barra-fuerza"></span></div>
        <div class="campo-ayuda" id="texto-fuerza">Usa al menos 8 caracteres.</div>
      </div>

      <button type="submit" class="btn btn-primary btn-bloque btn-lg" id="btn-crear">Crear cuenta</button>
    </form>

    <p class="acceso-pie">¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a></p>
  </div>

  <a class="volver" href="index.html">&larr; Volver al inicio</a>
  <p class="legal">AVBA Inspections, Certifications and Maintenance S.A.S. de C.V.</p>
</div>

<script src="assets/avba.js"></script>
<script>
const TEXTOS = {
  persona: {
    tab: 'Candidato', icono: 'persona',
    titulo: 'Crear cuenta de candidato',
    sub: 'Regístrate para armar tu perfil profesional',
    label: 'Nombre completo',
    placeholder: 'Ej. Ana Ramírez Soto',
  },
  empresa: {
    tab: 'Empresa', icono: 'edificio',
    titulo: 'Crear cuenta de empresa',
    sub: 'Regístrate para publicar tus vacantes',
    label: 'Nombre de la empresa',
    placeholder: 'Razón social o nombre comercial',
  },
};

let tipoActual = 'persona';
const $error = document.getElementById('error');

function mostrarError(msg) {
  $error.innerHTML = scIcono('alerta') + '<div>' + scEsc(msg) + '</div>';
  $error.classList.remove('oculto');
}
function limpiarError() { $error.classList.add('oculto'); }

function cambiarTipo(tipo) {
  tipoActual = tipo;
  const t = TEXTOS[tipo];

  document.getElementById('tab-persona').classList.toggle('activo', tipo === 'persona');
  document.getElementById('tab-empresa').classList.toggle('activo', tipo === 'empresa');
  document.getElementById('titulo').textContent = t.titulo;
  document.getElementById('subtitulo').textContent = t.sub;
  document.getElementById('label-nombre').textContent = t.label;
  document.getElementById('nombre').placeholder = t.placeholder;
  limpiarError();
}

/* Indicador visual de fuerza de contraseña */
document.getElementById('password').addEventListener('input', (e) => {
  const v = e.target.value;
  let puntos = 0;
  if (v.length >= 6)  puntos++;
  if (v.length >= 10) puntos++;
  if (/[A-Z]/.test(v) && /[a-z]/.test(v)) puntos++;
  if (/[0-9]/.test(v)) puntos++;
  if (/[^A-Za-z0-9]/.test(v)) puntos++;

  const niveles = [
    { w: '0%',   c: 'transparent',  t: 'Usa al menos 8 caracteres.' },
    { w: '25%',  c: 'var(--rojo)',  t: 'Contraseña débil.' },
    { w: '50%',  c: 'var(--ambar)', t: 'Contraseña aceptable.' },
    { w: '75%',  c: '#84cc16',      t: 'Contraseña buena.' },
    { w: '100%', c: 'var(--verde)', t: 'Contraseña fuerte.' },
  ];
  const n = niveles[Math.min(puntos, 4)];
  const barra = document.getElementById('barra-fuerza');
  barra.style.width = n.w;
  barra.style.background = n.c;
  document.getElementById('texto-fuerza').textContent = v ? n.t : niveles[0].t;
});

document.getElementById('form-registro').addEventListener('submit', async (e) => {
  e.preventDefault();
  limpiarError();

  const nombre   = document.getElementById('nombre').value.trim();
  const correo   = document.getElementById('correo').value.trim();
  const password = document.getElementById('password').value;

  if (!nombre)   { mostrarError('Escribe tu ' + TEXTOS[tipoActual].label.toLowerCase() + '.'); return; }
  if (!correo)   { mostrarError('Escribe tu correo electrónico.'); return; }
  if (password.length < 8) { mostrarError('La contraseña debe tener al menos 8 caracteres.'); return; }

  const btn = document.getElementById('btn-crear');
  btn.disabled = true;
  btn.innerHTML = '<div class="spin"></div> Creando cuenta...';

  const accion = tipoActual === 'empresa' ? 'REGISTRO_EMPRESA' : 'REGISTRO_PERSONA';

  try {
    const datos = await scPost(accion, { nombre, correo, password });

    if (datos.status !== 'success') {
      mostrarError(datos.message || 'No se pudo crear la cuenta.');
      return;
    }

    scSesion.guardar({
      usuario_id: datos.usuario_id,
      tipo:       datos.tipo,
      correo:     datos.correo,
      nombre:     datos.nombre,
      token:      datos.token,
      correo_verificado: 0,
    });

    // Si el correo no salió, avisamos en la siguiente pantalla
    sessionStorage.setItem('sc_bienvenida', datos.correo_enviado ? 'correo' : 'sin_correo');
    location.href = 'inicio.html';

  } catch (err) {
    mostrarError(err.message || 'Error de conexión. Intenta de nuevo.');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Crear cuenta';
  }
});

window.addEventListener('DOMContentLoaded', () => {
  // Etiquetas de las pestañas con icono
  ['persona', 'empresa'].forEach(tipo => {
    const t = TEXTOS[tipo];
    document.getElementById('tab-' + tipo).innerHTML = scIcono(t.icono) + '<span>' + t.tab + '</span>';
    document.getElementById('tab-' + tipo).addEventListener('click', () => cambiarTipo(tipo));
  });

  const tipo = new URLSearchParams(location.search).get('tipo');
  cambiarTipo(tipo === 'empresa' ? 'empresa' : 'persona');
  document.getElementById('nombre').focus();
});
</script>
</body>
</html>
