<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Servicios Directos — AVBA</title>
<style>

:root{--azul:#185FA5;--azul-dark:#0C447C;--azul-light:#E6F1FB;--verde:#3B6D11;--verde-light:#EAF3DE;--ambar:#854F0B;--ambar-light:#FAEEDA;--rojo:#A32D2D;--rojo-light:#FCEBEB;--gris-bg:#f4f7fb;--borde:#dfe5ef;--texto:#1a1a2e;--texto-sub:#5a6072;--texto-hint:#9299a8;--blanco:#fff;}
*{box-sizing:border-box;margin:0;padding:0}
html,body{overflow-x:hidden;max-width:100%}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--gris-bg)}
.header{background:var(--azul-dark);padding:0 20px;display:flex;align-items:center;justify-content:space-between;height:60px;box-shadow:0 2px 12px rgba(12,68,124,.3);position:sticky;top:0;z-index:50}
.hdr-l{display:flex;align-items:center;gap:10px}
.hdr-t{font-size:15px;font-weight:600;color:#fff}.hdr-s{font-size:11px;color:rgba(255,255,255,.6)}
.btn-logout{padding:6px 12px;border-radius:7px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.1);color:#fff;font-size:12px;font-weight:600;cursor:pointer}
.wrap{max-width:1000px;margin:0 auto;padding:20px 16px 60px}
.tabs{display:flex;gap:4px;background:var(--blanco);border-radius:12px;padding:6px;border:1px solid rgba(0,0,0,.05);box-shadow:0 2px 10px rgba(0,0,0,.04);margin-bottom:18px;overflow-x:auto}
.tab-btn{flex:1;padding:9px 14px;border-radius:8px;border:none;background:transparent;font-size:13px;font-weight:600;color:var(--texto-sub);cursor:pointer;white-space:nowrap}
.tab-btn.active{background:var(--azul);color:#fff}
.tab-btn:disabled{opacity:.5;cursor:not-allowed}
.tab-panel{display:none}.tab-panel.active{display:block}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
@media(max-width:640px){.stats{grid-template-columns:repeat(2,1fr)}}
.stat{background:var(--blanco);border-radius:12px;padding:14px 16px;border:1px solid rgba(0,0,0,.05);box-shadow:0 2px 10px rgba(0,0,0,.04)}
.stat-n{font-size:24px;font-weight:700}.stat-l{font-size:12px;color:var(--texto-sub);margin-top:2px}
.sec-hdr{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:14px}
.btn-prim{padding:9px 16px;border-radius:9px;border:none;background:var(--azul);color:#fff;font-size:13px;font-weight:600;cursor:pointer}
.btn-prim:hover{background:var(--azul-dark)}
.btn-sec{padding:8px 12px;border-radius:8px;border:1.5px solid var(--borde);background:var(--blanco);color:var(--texto-sub);font-size:12px;font-weight:600;cursor:pointer}
.btn-del{padding:8px 10px;border-radius:8px;border:1.5px solid var(--rojo);background:var(--rojo-light);color:var(--rojo);font-size:12px;font-weight:600;cursor:pointer}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.card{background:var(--blanco);border-radius:14px;border:1px solid rgba(0,0,0,.05);box-shadow:0 2px 12px rgba(0,0,0,.05);overflow:hidden}
.card-top{padding:14px 16px;border-bottom:1px solid var(--borde);display:flex;gap:10px;align-items:flex-start}
.card-ico{width:40px;height:40px;border-radius:10px;background:var(--azul-light);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.card-nombre{font-size:14px;font-weight:700;color:var(--texto)}
.card-sub{font-size:12px;color:var(--texto-sub);margin-top:2px}
.card-body{padding:12px 16px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.chip{font-size:11px;background:var(--gris-bg);border:1px solid var(--borde);border-radius:20px;padding:3px 9px;color:var(--texto-sub)}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600}
.b-ok{background:var(--verde-light);color:var(--verde)}.b-warn{background:var(--ambar-light);color:var(--ambar)}.b-bad{background:var(--rojo-light);color:var(--rojo)}.b-off{background:#f0f0f0;color:#888}
.card-foot{padding:10px 14px 14px;display:flex;gap:6px;flex-wrap:wrap}
.empty{text-align:center;padding:44px 20px;color:var(--texto-hint)}
.empty-t{font-size:15px;font-weight:600}.empty-s{font-size:13px;margin-top:4px}
.loading{text-align:center;padding:34px;color:var(--texto-hint)}
.spin{width:20px;height:20px;border:2px solid var(--borde);border-top-color:var(--azul);border-radius:50%;display:inline-block;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px;opacity:0;pointer-events:none;transition:opacity .2s}
.overlay.open{opacity:1;pointer-events:all}
.modal{background:var(--blanco);border-radius:14px;width:100%;max-width:560px;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.2);padding:22px 22px 18px}
.modal-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.modal-title{font-size:16px;font-weight:700;color:var(--texto)}
.modal-close{background:none;border:none;font-size:18px;cursor:pointer;color:var(--texto-hint)}
.frow{margin-bottom:10px}.fgrid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.flabel{font-size:12px;font-weight:600;color:var(--texto-sub);display:block;margin-bottom:4px}
.finput{width:100%;padding:9px 11px;border:1.5px solid var(--borde);border-radius:8px;font-size:13px;color:var(--texto);outline:none;background:var(--blanco)}
.finput:focus{border-color:var(--azul)}
.fact{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.msec{font-size:12px;font-weight:700;color:var(--azul-dark);margin:12px 0 6px;border-bottom:1px solid var(--borde);padding-bottom:4px}
.doc-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px;border:1px solid var(--borde);border-radius:9px;margin-bottom:8px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#1a1a2e;color:#fff;padding:10px 20px;border-radius:20px;font-size:13px;font-weight:600;z-index:9999;opacity:0;pointer-events:none;transition:opacity .25s;white-space:nowrap;max-width:90vw;overflow:hidden;text-overflow:ellipsis}
.toast.show{opacity:1}

.paso{display:flex;gap:6px;align-items:center;margin:10px 0 14px}
.paso-i{flex:1;text-align:center;font-size:11px;font-weight:700;padding:7px 6px;border-radius:8px;background:#f0f0f0;color:#888}
.paso-i.on{background:var(--azul);color:#fff}
.paso-i.hecho{background:var(--verde-light);color:var(--verde)}
.bit-row{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--borde);font-size:12px}
.bit-row:last-child{border-bottom:none}
.bit-cuando{color:var(--texto-hint);white-space:nowrap;font-size:11px}
.fotos{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:8px;margin-top:8px}
.fotos figure{position:relative;margin:0}
.fotos img{width:100%;height:80px;object-fit:cover;border-radius:8px;border:1px solid var(--borde)}
.fotos button{position:absolute;top:3px;right:3px;background:rgba(0,0,0,.6);color:#fff;border:none;border-radius:6px;font-size:11px;padding:2px 6px;cursor:pointer}
</style>
</head>
<body>

<div class="header">
  <div class="hdr-l">
    <div><div class="hdr-t">Servicios Directos</div><div class="hdr-s">AVBA · Expediente independiente</div></div>
  </div>
  <div style="display:flex;align-items:center;gap:10px">
    <span class="hdr-s" id="hdr-user"></span>
    <button class="btn-logout" onclick="cerrarSesion()">Salir</button>
  </div>
</div>

<div class="wrap">
  <div class="stats">
    <div class="stat"><div class="stat-n" id="s-captura" style="color:var(--ambar)">—</div><div class="stat-l">En captura</div></div>
    <div class="stat"><div class="stat-n" id="s-revisado" style="color:var(--azul)">—</div><div class="stat-l">Revisados</div></div>
    <div class="stat"><div class="stat-n" id="s-emitido" style="color:var(--verde)">—</div><div class="stat-l">Emitidos</div></div>
    <div class="stat"><div class="stat-n" id="s-nc" style="color:var(--rojo)">—</div><div class="stat-l">No cumplen</div></div>
  </div>

  <div class="sec-hdr">
    <div><h2 style="margin:0;font-size:18px;color:var(--azul-dark)">Servicios</h2>
      <p style="margin:3px 0 0;font-size:13px;color:var(--texto-sub)">Captura, revisa y emite. Cada paso queda firmado en la bitácora.</p></div>
    <button class="btn-prim" onclick="abrirServicio(null)">+ Nuevo servicio</button>
  </div>

  <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px">
    <input class="finput" id="f-buscar" placeholder="Buscar por cliente, folio, serie o código…" style="flex:1;min-width:200px" oninput="filtrar()">
    <select class="finput" id="f-estado" style="width:auto;min-width:150px" onchange="filtrar()">
      <option value="">Todos</option>
      <option value="CAPTURA">En captura</option>
      <option value="REVISADO">Revisados</option>
      <option value="EMITIDO">Emitidos</option>
    </select>
  </div>

  <div id="lista"><div class="loading"><span class="spin"></span></div></div>
</div>

<!-- Alta / edición -->
<div class="overlay" id="modal-serv">
  <div class="modal">
    <div class="modal-hdr"><div class="modal-title" id="serv-titulo">Nuevo servicio</div><button class="modal-close" onclick="cerrarServicio()">✕</button></div>
    <input type="hidden" id="v-id">
    <div class="frow"><label class="flabel">Cliente *</label><input class="finput" id="v-cliente"></div>
    <div class="fgrid2">
      <div class="frow"><label class="flabel">Domicilio</label><input class="finput" id="v-direccion"></div>
      <div class="frow"><label class="flabel">Fecha de inspección</label><input class="finput" id="v-fecha" type="date"></div>
    </div>
    <div class="fgrid2">
      <div class="frow"><label class="flabel">Tipo de equipo</label><input class="finput" id="v-maquinaria" placeholder="Ej: GRÚA TELESCÓPICA"></div>
      <div class="frow"><label class="flabel">Capacidad</label><input class="finput" id="v-capacidad" placeholder="Ej: 35 TON"></div>
    </div>
    <div class="fgrid2">
      <div class="frow"><label class="flabel">Marca</label><input class="finput" id="v-marca"></div>
      <div class="frow"><label class="flabel">Modelo</label><input class="finput" id="v-modelo"></div>
    </div>
    <div class="fgrid2">
      <div class="frow"><label class="flabel">No. de serie</label><input class="finput" id="v-serie"></div>
      <div class="frow"><label class="flabel">No. de identificación</label><input class="finput" id="v-idequipo"></div>
    </div>
    <div class="fgrid2">
      <div class="frow"><label class="flabel">Resultado</label>
        <select class="finput" id="v-resultado"><option value="CUMPLE">Cumple</option><option value="NO CUMPLE">No cumple</option></select></div>
      <div class="frow"><label class="flabel">Código QR</label>
        <div style="display:flex;gap:6px">
          <input class="finput" id="v-qr" maxlength="10" inputmode="numeric" placeholder="9 o 10 dígitos" style="flex:1">
          <button type="button" class="btn-sec" onclick="sugerirQr()" title="Siguiente placa libre">→</button>
        </div></div>
    </div>
    <div class="frow"><label class="flabel">Observaciones</label><textarea class="finput" id="v-obs" rows="2"></textarea></div>
    <div class="fact"><button class="btn-sec" onclick="cerrarServicio()">Cancelar</button><button class="btn-prim" id="v-btn" onclick="guardarServicio()">Guardar</button></div>
  </div>
</div>

<!-- Expediente -->
<div class="overlay" id="modal-det">
  <div class="modal" style="max-width:660px">
    <div class="modal-hdr"><div class="modal-title" id="det-titulo">Expediente</div><button class="modal-close" onclick="cerrarDetalle()">✕</button></div>
    <div class="paso" id="det-paso"></div>
    <div id="det-resumen" style="background:#f4f7fb;border:1px solid var(--borde);border-radius:10px;padding:11px 13px;font-size:12.5px;line-height:1.65;margin-bottom:12px"></div>

    <div class="msec">Evidencia fotográfica</div>
    <input type="file" id="det-foto" accept="image/*" capture="environment" style="display:none" onchange="subirFoto(this)">
    <button class="btn-sec" id="det-foto-btn" onclick="document.getElementById('det-foto').click()">📷 Agregar foto</button>
    <div class="fotos" id="det-fotos"></div>

    <div class="msec">Bitácora</div>
    <div id="det-bit"></div>

    <div class="fact" id="det-acciones"></div>
  </div>
</div>

<div class="toast" id="toast" style="position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#1a1a2e;color:#fff;padding:10px 20px;border-radius:20px;font-size:13px;font-weight:600;z-index:9999;opacity:0;pointer-events:none;transition:opacity .25s;max-width:90vw"></div>

<script>
const API = 'api/index.php';
const _origFetch = window.fetch.bind(window);
const _sesion = JSON.parse(localStorage.getItem('avba_session') || '{}');
if (!_sesion.token) location.href = 'login.html';
// Este expediente es sólo de su gente: una cuenta del sistema de siempre no
// entra aquí ni aunque escriba la dirección a mano. El servidor lo vuelve a
// comprobar en cada petición; esto sólo evita la pantalla en blanco.
if (_sesion.modulo !== 'directo') { localStorage.removeItem('avba_session'); location.href = 'login.html'; }
document.getElementById('hdr-user').textContent = _sesion.nombre || _sesion.usuario || '';

window.fetch = function(url, opts = {}) {
  const t = _sesion.token || '';
  if (typeof url === 'string' && url.includes('api/index.php')) {
    if (!opts.method || opts.method.toUpperCase() === 'GET') {
      opts.headers = Object.assign({}, opts.headers || {}, {'Authorization':'Bearer '+t,'X-Token':t});
    } else if (!(opts.body instanceof FormData)) {
      try { const b = JSON.parse(opts.body||'{}'); if(!b.token) b.token=t; opts.body=JSON.stringify(b); } catch(_){}
    }
    return _origFetch(url, opts).then(r => { if (r.status===401){localStorage.removeItem('avba_session');setTimeout(()=>location.href='login.html',40);} return r; });
  }
  return _origFetch(url, opts);
};

function cerrarSesion(){ localStorage.removeItem('avba_session'); location.href='login.html'; }
function esc(s){ return (s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
let _tT; function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.style.opacity='1'; clearTimeout(_tT); _tT=setTimeout(()=>t.style.opacity='0',2800); }
async function post(action, payload){
  const r = await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,payload})});
  return r.json();
}

// ── Listado ──
let _data = [];
async function cargar(){
  const cont=document.getElementById('lista'); cont.innerHTML='<div class="loading"><span class="spin"></span></div>';
  try{
    const r=await fetch(API+'?action=LISTAR_SD_SERVICIOS'); const d=await r.json();
    if(d.status!=='success'){ cont.innerHTML=`<p style="color:var(--rojo);text-align:center;padding:20px">${esc(d.message||'Error.')}</p>`; return; }
    _data=d.servicios||[];
    const rs=d.resumen||{};
    document.getElementById('s-captura').textContent  = rs.captura ?? 0;
    document.getElementById('s-revisado').textContent = rs.revisado ?? 0;
    document.getElementById('s-emitido').textContent  = rs.emitido ?? 0;
    document.getElementById('s-nc').textContent       = rs.no_cumple ?? 0;
    filtrar();
  }catch(_){ cont.innerHTML='<p style="color:var(--rojo);text-align:center;padding:20px">Error de red.</p>'; }
}

function filtrar(){
  const q=(document.getElementById('f-buscar').value||'').trim().toLowerCase();
  const e=document.getElementById('f-estado').value;
  render(_data.filter(s=>(!e||s.estado===e) &&
    (!q||[s.cliente,s.control,s.serie,s.qr_codigo,s.maquinaria,s.marca].join(' ').toLowerCase().includes(q))));
}

const ETAPA={CAPTURA:['b-warn','✎ En captura'],REVISADO:['b-ok','✔ Revisado'],EMITIDO:['b-ok','📄 Emitido']};

function render(lista){
  const cont=document.getElementById('lista');
  if(!lista.length){ cont.innerHTML='<div class="empty"><div class="empty-t">Sin servicios</div><div class="empty-s">Captura el primero con <b>+ Nuevo servicio</b>.</div></div>'; return; }
  cont.innerHTML='<div class="cards">'+lista.map(s=>{
    const [cls,txt]=ETAPA[s.estado]||['b-off',s.estado];
    return `
    <div class="card">
      <div class="card-top">
        <div class="card-ico">🔧</div>
        <div style="flex:1;min-width:0">
          <div class="card-nombre">${esc(s.cliente)}</div>
          <div class="card-sub">${esc(s.control||'—')}${s.maquinaria?' · '+esc(s.maquinaria):''}</div>
        </div>
        <span class="badge ${cls}">${txt}</span>
      </div>
      <div class="card-body">
        <div class="chips">
          ${s.fecha?`<span class="chip">📅 ${esc(s.fecha)}</span>`:''}
          ${s.serie?`<span class="chip">🔢 ${esc(s.serie)}</span>`:''}
          ${s.qr_codigo?`<span class="chip">🏷 ${esc(s.qr_codigo)}</span>`:'<span class="chip" style="color:var(--rojo)">Sin código QR</span>'}
          ${s.total_fotos?`<span class="chip">📷 ${s.total_fotos}</span>`:''}
        </div>
        <div style="display:flex;justify-content:space-between;align-items:center">
          <span class="badge ${s.resultado==='CUMPLE'?'b-ok':'b-bad'}">${s.resultado==='CUMPLE'?'✓ Cumple':'✗ No cumple'}</span>
          ${s.cert_url?`<a class="btn-sec" style="text-decoration:none" href="${esc(s.cert_url)}" target="_blank">Ver certificado</a>`:''}
        </div>
      </div>
      <div class="card-foot">
        <button class="btn-prim" style="flex:1;font-size:12px;padding:8px" onclick="verExpediente(${s.id})">📁 Expediente</button>
        ${s.estado!=='EMITIDO'?`<button class="btn-sec" onclick='abrirServicio(${JSON.stringify(s).replace(/'/g,"&#39;")})'>✏</button>`:''}
        <button class="btn-del" onclick="eliminar(${s.id})">🗑</button>
      </div>
    </div>`;}).join('')+'</div>';
}

// ── Alta / edición ──
function abrirServicio(s){
  document.getElementById('serv-titulo').textContent = s?'Editar servicio':'Nuevo servicio';
  const set=(id,v)=>document.getElementById(id).value=v||'';
  set('v-id', s?s.id:'');
  set('v-cliente', s&&s.cliente);
  set('v-direccion', s&&s.direccion);
  set('v-fecha', s?s.fecha_iso:new Date().toISOString().slice(0,10));
  set('v-maquinaria', s&&s.maquinaria);
  set('v-capacidad', s&&s.capacidad);
  set('v-marca', s&&s.marca);
  set('v-modelo', s&&s.modelo);
  set('v-serie', s&&s.serie);
  set('v-idequipo', s&&s.id_equipo);
  set('v-qr', s&&s.qr_codigo);
  set('v-obs', s&&s.observaciones);
  document.getElementById('v-resultado').value = s?(s.resultado||'CUMPLE'):'CUMPLE';
  document.getElementById('modal-serv').classList.add('open');
}
function cerrarServicio(){ document.getElementById('modal-serv').classList.remove('open'); }

async function sugerirQr(){
  try{
    const r=await fetch(API+'?action=SD_SIGUIENTE_QR'); const d=await r.json();
    if(d.status!=='success'){ toast(d.message||'Sin placas libres.'); return; }
    document.getElementById('v-qr').value=d.qr;
  }catch(_){ toast('Error de red.'); }
}

async function guardarServicio(){
  const v=id=>document.getElementById(id).value.trim();
  if(!v('v-cliente')){ toast('Indica el cliente.'); return; }
  const btn=document.getElementById('v-btn'); btn.disabled=true; btn.textContent='Guardando…';
  try{
    const d=await post('GUARDAR_SD_SERVICIO',{
      id:+v('v-id')||0, cliente:v('v-cliente'), direccion:v('v-direccion'),
      fecha_inspeccion:v('v-fecha'), maquinaria:v('v-maquinaria'), capacidad:v('v-capacidad'),
      marca:v('v-marca'), modelo:v('v-modelo'), serie:v('v-serie'), id_equipo:v('v-idequipo'),
      resultado:document.getElementById('v-resultado').value,
      qr_codigo:v('v-qr').replace(/\D/g,''), observaciones:v('v-obs'),
    });
    if(d.status!=='success'){ toast(d.message||'Error.'); return; }
    cerrarServicio(); toast('Servicio guardado.'); cargar();
  }catch(_){ toast('Error de red.'); }
  finally{ btn.disabled=false; btn.textContent='Guardar'; }
}

async function eliminar(id){
  const s=_data.find(x=>x.id===id);
  if(!confirm(`¿Eliminar el servicio de ${s?s.cliente:''} con toda su evidencia y su bitácora?\n\nEsto no se puede deshacer.`)) return;
  const motivo=prompt('Motivo (queda en el historial):','');
  if(motivo===null) return;
  const d=await post('ELIMINAR_SD_SERVICIO',{id,motivo});
  if(d.status!=='success'){ toast(d.message||'Error.'); return; }
  toast('Servicio eliminado.'); cargar();
}

// ── Expediente ──
let _detId=0, _det=null;
async function verExpediente(id){
  _detId=id;
  document.getElementById('modal-det').classList.add('open');
  document.getElementById('det-bit').innerHTML='<div class="loading"><span class="spin"></span></div>';
  cargarDetalle();
}
function cerrarDetalle(){ document.getElementById('modal-det').classList.remove('open'); cargar(); }

async function cargarDetalle(){
  try{
    const r=await fetch(API+'?action=DETALLE_SD_SERVICIO&id='+_detId); const d=await r.json();
    if(d.status!=='success'){ toast(d.message||'Error.'); return; }
    _det=d;
    const s=d.servicio;
    document.getElementById('det-titulo').textContent='Expediente — '+(s.control||'');

    const pasos=['CAPTURA','REVISADO','EMITIDO'], et=['Captura','Revisión','Emisión'];
    const i=pasos.indexOf(s.estado);
    document.getElementById('det-paso').innerHTML=pasos.map((p,k)=>
      `<div class="paso-i ${k<i?'hecho':(k===i?'on':'')}">${k<i?'✔ ':''}${et[k]}</div>`).join('');

    const li=(e,v)=>v?`<div><b>${e}:</b> ${esc(v)}</div>`:'';
    document.getElementById('det-resumen').innerHTML =
      li('Cliente',s.cliente)+li('Domicilio',s.direccion)+li('Equipo',s.maquinaria)+
      li('Marca',s.marca)+li('Modelo',s.modelo)+li('Serie',s.serie)+li('Capacidad',s.capacidad)+
      li('Identificación',s.id_equipo)+li('Fecha',s.fecha)+li('Código QR',s.qr_codigo)+
      `<div style="margin-top:4px"><b>Resultado:</b> <span class="badge ${s.resultado==='CUMPLE'?'b-ok':'b-bad'}">${s.resultado}</span></div>`+
      (s.observaciones?`<div style="margin-top:5px;color:var(--texto-sub)">${esc(s.observaciones)}</div>`:'');

    const puedeCambiar = s.estado!=='EMITIDO';
    document.getElementById('det-foto-btn').style.display = puedeCambiar?'':'none';
    document.getElementById('det-fotos').innerHTML = (d.fotos||[]).map(f=>`
      <figure><img src="${esc(f.url)}" alt="Evidencia">
      ${puedeCambiar?`<button onclick="borrarFoto(${f.id})">✕</button>`:''}</figure>`).join('')
      || '<div style="font-size:12px;color:var(--texto-hint);padding:6px 0">Sin fotos.</div>';

    document.getElementById('det-bit').innerHTML=(d.bitacora||[]).map(b=>`
      <div class="bit-row">
        <div style="flex:1">
          <b>${esc(b.accion)}</b> <span class="badge b-off">${esc(b.papel||'')}</span>
          <div style="color:var(--texto-sub);font-size:11.5px">${esc(b.usuario||'')}${b.detalle?' · '+esc(b.detalle):''}</div>
        </div>
        <div class="bit-cuando">${esc(b.cuando||'')}</div>
      </div>`).join('') || '<div style="font-size:12px;color:var(--texto-hint)">Sin movimientos.</div>';

    const acc=[];
    if(s.estado==='CAPTURA') acc.push(`<button class="btn-prim" onclick="avanzar()">Revisar y aprobar →</button>`);
    if(s.estado==='REVISADO'){
      acc.push(`<button class="btn-sec" onclick="regresar()">← Regresar a captura</button>`);
      acc.push(`<button class="btn-prim" onclick="avanzar()">Emitir certificado →</button>`);
    }
    if(s.estado==='EMITIDO'){
      if(s.cert_url) acc.push(`<a class="btn-sec" style="text-decoration:none" href="${esc(s.cert_url)}" target="_blank">Ver certificado</a>`);
      acc.push(`<button class="btn-sec" onclick="regresar()">← Regresar a revisión</button>`);
    }
    document.getElementById('det-acciones').innerHTML=acc.join('');
  }catch(_){ toast('Error de red.'); }
}

async function avanzar(){
  const s=_det&&_det.servicio;
  if(s&&s.estado==='REVISADO'&&!confirm('Se emitirá el certificado con este expediente.\n\n¿Continuar?')) return;
  const d=await post('SD_AVANZAR',{id:_detId});
  if(d.status!=='success'){ toast(d.message||'Error.'); return; }
  toast(d.message||'Listo.'); cargarDetalle();
}

async function regresar(){
  const motivo=prompt('¿Por qué se regresa? (queda en la bitácora)','');
  if(motivo===null) return;
  if(!motivo.trim()){ toast('Sin motivo no se puede regresar.'); return; }
  const d=await post('SD_REGRESAR',{id:_detId,motivo:motivo.trim()});
  if(d.status!=='success'){ toast(d.message||'Error.'); return; }
  toast(d.message||'Listo.'); cargarDetalle();
}

async function subirFoto(input){
  const f=input.files[0]; if(!f) return;
  const fd=new FormData();
  fd.append('action','SUBIR_FOTO_SD'); fd.append('servicio_id',_detId); fd.append('archivo',f);
  const btn=document.getElementById('det-foto-btn'); btn.disabled=true; btn.textContent='Subiendo…';
  try{
    const r=await _origFetch(API,{method:'POST',headers:{'X-Token':_sesion.token||''},body:fd});
    const d=await r.json();
    if(d.status!=='success'){ toast(d.message||'Error.'); return; }
    toast('Foto agregada.'); cargarDetalle();
  }catch(_){ toast('Error de red.'); }
  finally{ btn.disabled=false; btn.textContent='📷 Agregar foto'; input.value=''; }
}

async function borrarFoto(id){
  if(!confirm('¿Eliminar esta foto?')) return;
  const d=await post('ELIMINAR_FOTO_SD',{id});
  if(d.status!=='success'){ toast(d.message||'Error.'); return; }
  toast('Foto eliminada.'); cargarDetalle();
}

cargar();
</script>
</body>
</html>
