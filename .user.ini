; AVBA Certificaciones — Configuración PHP para Hostinger (php-fpm)
; Este archivo es leído automáticamente por PHP-FPM en Hostinger.

; ── Seguridad ─────────────────────────────────────────────
; No mostrar errores al usuario en producción
display_errors = Off
display_startup_errors = Off
; Guardar errores en el log del servidor
log_errors = On
error_log = /dev/stderr

; Ocultar la versión de PHP en headers HTTP
expose_php = Off

; ── Uploads ───────────────────────────────────────────────
upload_max_filesize = 25M
post_max_size = 30M
; Tiempo máximo para subir un archivo grande
max_input_time = 120

; ── Ejecución ─────────────────────────────────────────────
max_execution_time = 120
memory_limit = 256M

; ── Sesiones ──────────────────────────────────────────────
session.cookie_httponly = 1
session.cookie_secure = 1
session.use_strict_mode = 1
