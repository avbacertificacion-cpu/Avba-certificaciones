<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Administración — AVBA</title>
  <style>
    :root {
      --azul:       #185FA5;
      --azul-dark:  #0C447C;
      --azul-light: #E6F1FB;
      --verde:      #3B6D11;
      --verde-light:#EAF3DE;
      --ambar:      #854F0B;
      --ambar-light:#FAEEDA;
      --rojo:       #A32D2D;
      --rojo-light: #FCEBEB;
      --gris-bg:    #f4f7fb;
      --borde:      #dfe5ef;
      --texto:      #1a1a2e;
      --texto-sub:  #5a6072;
      --texto-hint: #9299a8;
      --blanco:     #ffffff;
      --radio:      10px;
      --radio-lg:   15px;
      --sombra:     0 2px 16px rgba(0,0,0,0.07);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--gris-bg); min-height: 100vh; }

    .header {
      background: var(--azul-dark);
      padding: 16px 24px;
      display: flex; align-items: center; gap: 14px;
      box-shadow: 0 2px 12px rgba(12,68,124,0.3);
      position: sticky; top: 0; z-index: 50;
    }
    .logo {
      width: 36px; height: 36px; border-radius: 50%;
      background: rgba(255,255,255,0.15); border: 1.5px solid rgba(255,255,255,0.25);
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 15px; color: white;
    }
    .header-text .t { font-size: 16px; font-weight: 600; color: white; }
    .header-text .s { font-size: 12px; color: rgba(255,255,255,0.6); margin-top: 1px; }
    .header-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }
    .header-user { font-size: 12px; color: rgba(255,255,255,0.75); }
    .btn-logout {
      padding: 6px 14px; border-radius: 7px;
      border: 1.5px solid rgba(255,255,255,0.3); background: transparent;
      color: white; font-size: 12px; cursor: pointer;
    }
    .btn-logout:hover { background: rgba(255,255,255,0.1); }

    .wrap { max-width: 900px; margin: 0 auto; padding: 24px 16px 40px; }

    .stats { display: grid; grid-template-columns: repeat(4,1fr); gap: 10px; margin-bottom: 20px; }
    @media(max-width:600px) { .stats { grid-template-columns: repeat(2,1fr); } }
    .stat {
      background: var(--blanco); border-radius: var(--radio);
      border: 1px solid rgba(0,0,0,0.05); padding: 14px 16px; box-shadow: var(--sombra);
    }
    .stat-n { font-size: 26px; font-weight: 600; }
    .stat-l { font-size: 12px; color: var(--texto-sub); margin-top: 2px; }

    .panel {
      background: var(--blanco); border-radius: var(--radio-lg);
      border: 1px solid rgba(0,0,0,0.05); box-shadow: var(--sombra); overflow: hidden;
    }
    .panel-hdr {
      padding: 14px 18px; border-bottom: 1px solid var(--borde);
      display: flex; align-items: center; justify-content: space-between;
    }
    .panel-title { font-size: 14px; font-weight: 700; color: var(--texto); }

    .btn-primary {
      padding: 8px 16px; border-radius: var(--radio);
      border: none; background: var(--azul); color: white;
      font-size: 13px; font-weight: 600; cursor: pointer;
    }
    .btn-primary:hover { background: var(--azul-dark); }
    .btn-danger {
      padding: 6px 12px; border-radius: 7px;
      border: 1.5px solid var(--rojo); background: var(--rojo-light);
      color: var(--rojo); font-size: 12px; font-weight: 600; cursor: pointer;
    }
    .btn-danger:hover { background: var(--rojo); color: white; }
    .btn-edit {
      padding: 6px 12px; border-radius: 7px;
      border: 1.5px solid var(--borde); background: var(--blanco);
      color: var(--texto-sub); font-size: 12px; cursor: pointer;
    }
    .btn-edit:hover { border-color: var(--azul); color: var(--azul); }

    table { width: 100%; border-collapse: collapse; }
    th {
      font-size: 11px; font-weight: 600; color: var(--texto-sub);
      text-align: left; padding: 10px 14px; border-bottom: 1px solid var(--borde);
      text-transform: uppercase; letter-spacing: .05em; background: var(--gris-bg);
    }
    td { font-size: 13px; padding: 11px 14px; border-bottom: 1px solid #f0f2f7; vertical-align: middle; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: #fafbff; }

    .badge {
      display: inline-flex; align-items: center;
      padding: 3px 10px; border-radius: 20px;
      font-size: 11px; font-weight: 600;
    }
    .b-admin { background:#F0E6FB; color:#5B1FA3; }
    .b-cal   { background: var(--azul-light); color: var(--azul-dark); }
    .b-insp  { background: var(--ambar-light); color: var(--ambar); }
    .b-cert  { background: var(--verde-light); color: var(--verde); }
    .b-inact { background: #f0f0f0; color: #888; }
    .b-activo{ background: var(--verde-light); color: var(--verde); }

    .td-actions { display: flex; gap: 6px; }

    .overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.45); backdrop-filter: blur(2px);
      display: flex; align-items: center; justify-content: center;
      z-index: 100; padding: 20px; opacity: 0; pointer-events: none; transition: opacity .2s;
    }
    .overlay.open { opacity: 1; pointer-events: all; }
    .modal {
      background: var(--blanco); border-radius: var(--radio-lg);
      width: 100%; max-width: 440px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.2);
      padding: 28px 24px;
      animation: slideUp .22s ease;
    }
    @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } }
    .modal-title { font-size: 17px; font-weight: 700; color: var(--texto); margin-bottom: 20px; }
    .field { margin-bottom: 14px; }
    .field label { font-size: 12px; font-weight: 600; color: var(--texto-sub); display: block; margin-bottom: 5px; }
    .field input, .field select {
      width: 100%; padding: 10px 12px;
      border: 1.5px solid var(--borde); border-radius: 8px;
      font-size: 13px; color: var(--texto); background: var(--blanco); outline: none;
    }
    .field input:focus, .field select:focus { border-color: var(--azul); }
    .field .hint { font-size: 11px; color: var(--texto-hint); margin-top: 4px; }
    .modal-btns { display: flex; gap: 8px; margin-top: 20px; }
    .modal-btns button { flex: 1; }
    .btn-cancel {
      padding: 11px; border-radius: 8px;
      border: 1.5px solid var(--borde); background: var(--blanco);
      color: var(--texto-sub); font-size: 13px; font-weight: 600; cursor: pointer;
    }
    .btn-confirm {
      padding: 11px; border-radius: 8px;
      border: none; background: var(--azul); color: white;
      font-size: 13px; font-weight: 600; cursor: pointer;
    }
    .btn-confirm:hover { background: var(--azul-dark); }

    .loading-row td { text-align:center; padding:36px; color:var(--texto-hint); font-size:13px; }
    .spin {
      width: 20px; height: 20px; border: 2px solid var(--borde);
      border-top-color: var(--azul); border-radius: 50%;
      animation: giro .7s linear infinite; margin: 0 auto 8px;
    }
    @keyframes giro { to { transform: rotate(360deg); } }

    .activo-toggle { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
    .activo-toggle input[type=checkbox] { width: 16px; height: 16px; cursor: pointer; }
  </style>
</head>
<body>

<!-- HEADER -->
<div class="header">
  <div class="logo">A</div>
  <div class="header-text">
    <div class="t">Panel de Administración</div>
    <div class="s">Gestión de usuarios y accesos</div>
  </div>
  <div class="header-right">
    <span class="header-user" id="header-user"></span>
    <button class="btn-logout" onclick="logout()">Cerrar sesión</button>
  </div>
</div>

<div class="wrap">

  <!-- Stats -->
  <div class="stats">
    <div class="stat">
      <div class="stat-n" id="s-total"    style="color:var(--azul)">—</div>
      <div class="stat-l">Total usuarios</div>
    </div>
    <div class="stat">
      <div class="stat-n" id="s-activos"  style="color:var(--verde)">—</div>
      <div class="stat-l">Activos</div>
    </div>
    <div class="stat">
      <div class="stat-n" id="s-inactivos" style="color:var(--texto-hint)">—</div>
      <div class="stat-l">Inactivos</div>
    </div>
    <div class="stat">
      <div class="stat-n" id="s-roles"    style="color:var(--ambar)">—</div>
      <div class="stat-l">Roles distintos</div>
    </div>
  </div>

  <!-- Tabla usuarios -->
  <div class="panel">
    <div class="panel-hdr">
      <span class="panel-title">Usuarios del sistema</span>
      <button class="btn-primary" onclick="abrirCrear()">+ Nuevo usuario</button>
    </div>
    <div style="overflow-x:auto">
      <table>
        <thead>
          <tr>
            <th>Usuario</th>
            <th>Nombre</th>
            <th>Rol</th>
            <th>Estado</th>
            <th>Último acceso</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="tabla-usuarios">
          <tr class="loading-row">
            <td colspan="6"><div class="spin"></div>Cargando...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

</div><!-- /wrap -->


<!-- ══ MODAL CREAR/EDITAR USUARIO ══ -->
<div class="overlay" id="overlay-usr">
  <div class="modal">
    <div class="modal-title" id="modal-usr-title">Nuevo usuario</div>

    <input type="hidden" id="usr-id">

    <div class="field">
      <label>Usuario <span style="color:var(--rojo)">*</span></label>
      <input type="text" id="usr-usuario" placeholder="nombre_usuario" autocomplete="off">
    </div>
    <div class="field">
      <label>Nombre completo <span style="color:var(--rojo)">*</span></label>
      <input type="text" id="usr-nombre" placeholder="Juan Pérez">
    </div>
    <div class="field">
      <label>Contraseña <span id="pass-req" style="color:var(--rojo)">*</span></label>
      <input type="password" id="usr-password" placeholder="Mínimo 6 caracteres" autocomplete="new-password">
      <div class="hint" id="pass-hint"></div>
    </div>
    <div class="field">
      <label>Rol <span style="color:var(--rojo)">*</span></label>
      <select id="usr-rol">
        <option value="">— Seleccionar rol —</option>
        <option value="INSPECTOR">INSPECTOR</option>
        <option value="CALIDAD">CALIDAD</option>
        <option value="CERTIFICACIONES">CERTIFICACIONES</option>
        <option value="ADMIN">ADMIN</option>
      </select>
    </div>
    <div class="field" id="campo-activo" style="display:none">
      <label>Estado</label>
      <div class="activo-toggle">
        <input type="checkbox" id="usr-activo" checked>
        <span style="font-size:13px;color:var(--texto)">Usuario activo</span>
      </div>
    </div>

    <div class="modal-btns">
      <button class="btn-cancel"  onclick="cerrarModal()">Cancelar</button>
      <button class="btn-confirm" onclick="guardarUsuario()">Guardar</button>
    </div>
  </div>
</div>


<script>
const API = "api/index.php";

/* ── Interceptor token ── */
(function() {
  const _fetch = window.fetch;
  window.fetch = function(url, opts = {}) {
    if (typeof url === 'string' && url.includes('api/index.php')) {
      const s = JSON.parse(localStorage.getItem('avba_session') || '{}');
      const t = s.token || '';
      if (opts.method === 'POST') {
        if (!(opts.body instanceof FormData)) {
          try { const b = JSON.parse(opts.body || '{}'); b.token = t; opts.body = JSON.stringify(b); } catch(e) {}
        }
      } else {
        url = url + (url.includes('?') ? '&' : '?') + 'token=' + encodeURIComponent(t);
      }
    }
    return _fetch.call(this, url, opts);
  };
}());

/* ── Auth guard ── */
const sesion = JSON.parse(localStorage.getItem('avba_session') || '{}');
if (!sesion.token || sesion.rol !== 'ADMIN') {
  location.href = 'login.html';
}
document.getElementById('header-user').textContent = sesion.nombre || sesion.usuario || '';

function logout() {
  localStorage.removeItem('avba_session');
  location.href = 'login.html';
}

/* ── Estado ── */
let usuariosGlobal = [];
let modoEdicion    = false;

/* ── Cargar usuarios ── */
async function cargar() {
  try {
    const res  = await fetch(API + "?action=LISTAR_USUARIOS");
    const data = await res.json();
    if (!Array.isArray(data)) throw new Error("Respuesta inválida");
    usuariosGlobal = data;
    render(data);
    actualizarStats(data);
  } catch (e) {
    document.getElementById("tabla-usuarios").innerHTML =
      `<tr class="loading-row"><td colspan="6">Error al cargar. <button onclick="cargar()" style="color:var(--azul);background:none;border:none;cursor:pointer;font-size:13px;text-decoration:underline">Reintentar</button></td></tr>`;
  }
}

function actualizarStats(d) {
  document.getElementById("s-total").textContent     = d.length;
  document.getElementById("s-activos").textContent   = d.filter(u => u.activo == 1).length;
  document.getElementById("s-inactivos").textContent = d.filter(u => u.activo == 0).length;
  document.getElementById("s-roles").textContent     = [...new Set(d.map(u => u.rol))].length;
}

function rolBadge(rol) {
  const cls = { ADMIN:'b-admin', CALIDAD:'b-cal', INSPECTOR:'b-insp', CERTIFICACIONES:'b-cert' };
  return `<span class="badge ${cls[rol] || ''}">${esc(rol)}</span>`;
}

function render(data) {
  const tbody = document.getElementById("tabla-usuarios");
  if (!data.length) {
    tbody.innerHTML = `<tr class="loading-row"><td colspan="6">No hay usuarios registrados.</td></tr>`;
    return;
  }
  tbody.innerHTML = data.map(u => `
    <tr>
      <td><strong>${esc(u.usuario)}</strong></td>
      <td>${esc(u.nombre || '—')}</td>
      <td>${rolBadge(u.rol)}</td>
      <td>${u.activo == 1
        ? `<span class="badge b-activo">Activo</span>`
        : `<span class="badge b-inact">Inactivo</span>`}</td>
      <td style="color:var(--texto-hint);font-size:12px">${esc(u.ultimo_acceso || '—')}</td>
      <td>
        <div class="td-actions">
          <button class="btn-edit" onclick="abrirEditar(${u.id})">Editar</button>
          ${u.activo == 1
            ? `<button class="btn-danger" onclick="desactivar(${u.id})">Desactivar</button>`
            : `<button class="btn-edit"   onclick="reactivar(${u.id})">Reactivar</button>`}
        </div>
      </td>
    </tr>`).join("");
}

/* ── Modal crear ── */
function abrirCrear() {
  modoEdicion = false;
  document.getElementById("modal-usr-title").textContent  = "Nuevo usuario";
  document.getElementById("usr-id").value                 = "";
  document.getElementById("usr-usuario").value            = "";
  document.getElementById("usr-usuario").disabled         = false;
  document.getElementById("usr-nombre").value             = "";
  document.getElementById("usr-password").value           = "";
  document.getElementById("usr-rol").value                = "";
  document.getElementById("pass-req").textContent         = "*";
  document.getElementById("pass-hint").textContent        = "";
  document.getElementById("campo-activo").style.display   = "none";
  document.getElementById("overlay-usr").classList.add("open");
  setTimeout(() => document.getElementById("usr-usuario").focus(), 150);
}

/* ── Modal editar ── */
function abrirEditar(id) {
  const u = usuariosGlobal.find(x => x.id == id);
  if (!u) return;
  modoEdicion = true;
  document.getElementById("modal-usr-title").textContent  = "Editar usuario";
  document.getElementById("usr-id").value                 = u.id;
  document.getElementById("usr-usuario").value            = u.usuario;
  document.getElementById("usr-usuario").disabled         = true;
  document.getElementById("usr-nombre").value             = u.nombre || "";
  document.getElementById("usr-password").value           = "";
  document.getElementById("usr-rol").value                = u.rol;
  document.getElementById("usr-activo").checked           = u.activo == 1;
  document.getElementById("pass-req").textContent         = "";
  document.getElementById("pass-hint").textContent        = "Dejar en blanco para no cambiar la contraseña";
  document.getElementById("campo-activo").style.display   = "block";
  document.getElementById("overlay-usr").classList.add("open");
  setTimeout(() => document.getElementById("usr-nombre").focus(), 150);
}

function cerrarModal() {
  document.getElementById("overlay-usr").classList.remove("open");
}

/* ── Guardar ── */
async function guardarUsuario() {
  const usuario  = document.getElementById("usr-usuario").value.trim();
  const nombre   = document.getElementById("usr-nombre").value.trim();
  const password = document.getElementById("usr-password").value;
  const rol      = document.getElementById("usr-rol").value;
  const activo   = document.getElementById("usr-activo").checked ? 1 : 0;
  const id       = document.getElementById("usr-id").value;

  if (!nombre || !rol) { alert("Nombre y rol son obligatorios."); return; }
  if (!modoEdicion && (!usuario || !password)) { alert("Usuario y contraseña son obligatorios."); return; }
  if (password && password.length < 6) { alert("La contraseña debe tener al menos 6 caracteres."); return; }

  const action  = modoEdicion ? "EDITAR_USUARIO" : "CREAR_USUARIO";
  const payload = modoEdicion
    ? { id: parseInt(id), nombre, ...(password ? { password } : {}), rol, activo }
    : { usuario, nombre, password, rol };

  try {
    const res  = await fetch(API, {
      method: "POST",
      body: JSON.stringify({ action, payload })
    });
    const data = await res.json();
    if (data.status === "success") {
      cerrarModal();
      cargar();
    } else {
      alert("Error: " + (data.message || "No se pudo guardar"));
    }
  } catch (e) {
    alert("Error de conexión.");
  }
}

/* ── Desactivar ── */
async function desactivar(id) {
  const u = usuariosGlobal.find(x => x.id == id);
  if (!confirm(`¿Desactivar al usuario "${u?.usuario}"?`)) return;
  const res  = await fetch(API, {
    method: "POST",
    body: JSON.stringify({ action: "DESACTIVAR_USUARIO", payload: { id } })
  });
  const data = await res.json();
  if (data.status === "success") cargar();
  else alert(data.message || "Error al desactivar");
}

/* ── Reactivar (editar con activo=1) ── */
async function reactivar(id) {
  const res  = await fetch(API, {
    method: "POST",
    body: JSON.stringify({ action: "EDITAR_USUARIO", payload: { id, activo: 1 } })
  });
  const data = await res.json();
  if (data.status === "success") cargar();
  else alert(data.message || "Error al reactivar");
}

/* ── Escape HTML ── */
function esc(v) {
  return (v || "").toString()
    .replace(/&/g,"&amp;").replace(/"/g,"&quot;")
    .replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

/* ── Cerrar modal al click fuera ── */
document.getElementById("overlay-usr").addEventListener("click", function(e) {
  if (e.target === this) cerrarModal();
});

cargar();
</script>
</body>
</html>
