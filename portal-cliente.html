<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Portal Cliente — AVBA</title>
<style>
:root{--azul:#185FA5;--azul-dark:#0C447C;--azul-light:#E6F1FB;--verde:#3B6D11;--verde-light:#EAF3DE;--ambar:#854F0B;--ambar-light:#FAEEDA;--rojo:#A32D2D;--rojo-light:#FCEBEB;--gris-bg:#f4f7fb;--borde:#dfe5ef;--texto:#1a1a2e;--texto-sub:#5a6072;--texto-hint:#9299a8;--blanco:#ffffff;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--gris-bg);}
.header{background:var(--azul);padding:0 20px;display:flex;align-items:center;justify-content:space-between;height:60px;box-shadow:0 2px 12px rgba(24,95,165,.25);position:sticky;top:0;z-index:50;}
.hdr-l{display:flex;align-items:center;gap:10px;}
.hdr-logo{width:32px;height:32px;border-radius:8px;background:rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;}
.hdr-t{font-size:15px;font-weight:600;color:#fff;}
.hdr-s{font-size:11px;color:rgba(255,255,255,.6);}
.hdr-r{display:flex;align-items:center;gap:10px;}
.hdr-user-t{font-size:13px;font-weight:600;color:#fff;text-align:right;}
.hdr-user-s{font-size:11px;color:rgba(255,255,255,.6);text-align:right;}
.btn-logout{padding:6px 12px;border-radius:7px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.1);color:#fff;font-size:12px;font-weight:600;cursor:pointer;}
.btn-logout:hover{background:rgba(255,255,255,.2);}
.wrap{max-width:1000px;margin:0 auto;padding:20px 16px 60px;}
/* Stats */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px;}
@media(max-width:500px){.stats{grid-template-columns:1fr 1fr;}}
.stat{background:var(--blanco);border-radius:12px;padding:14px 16px;border:1px solid rgba(0,0,0,.05);box-shadow:0 2px 10px rgba(0,0,0,.04);}
.stat-n{font-size:24px;font-weight:700;}
.stat-l{font-size:12px;color:var(--texto-sub);margin-top:2px;}
/* Tabs */
.tabs{display:flex;gap:4px;background:var(--blanco);border-radius:12px;padding:6px;border:1px solid rgba(0,0,0,.05);box-shadow:0 2px 10px rgba(0,0,0,.04);margin-bottom:18px;}
.tab-btn{flex:1;padding:9px 14px;border-radius:8px;border:none;background:transparent;font-size:13px;font-weight:600;color:var(--texto-sub);cursor:pointer;transition:all .15s;}
.tab-btn.active{background:var(--azul);color:#fff;}
.tab-btn:hover:not(.active){background:var(--gris-bg);}
.tab-panel{display:none;}
.tab-panel.active{display:block;}
/* Cards maquinaria */
.cards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;}
.card{background:var(--blanco);border-radius:14px;border:1px solid rgba(0,0,0,.05);box-shadow:0 2px 12px rgba(0,0,0,.05);overflow:hidden;}
.card-top{padding:16px 18px 14px;border-bottom:1px solid var(--borde);display:flex;align-items:flex-start;gap:12px;}
.card-icon{width:40px;height:40px;border-radius:10px;background:var(--azul-light);flex-shrink:0;display:flex;align-items:center;justify-content:center;}
.card-folio{font-family:monospace;font-size:11px;color:var(--texto-hint);margin-bottom:2px;}
.card-nombre{font-size:14px;font-weight:700;color:var(--texto);}
.card-serie{font-size:12px;color:var(--texto-sub);margin-top:2px;}
.card-body{padding:14px 18px;}
.info-row{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid #f0f2f7;font-size:13px;}
.info-row:last-child{border-bottom:none;}
.info-key{color:var(--texto-sub);}
.info-val{font-weight:600;color:var(--texto);text-align:right;}
.vig-wrap{margin:10px 0 0;}
.vig-hdr{display:flex;justify-content:space-between;margin-bottom:5px;}
.vig-lbl{font-size:11px;color:var(--texto-sub);font-weight:600;}
.vig-dias{font-size:12px;font-weight:700;}
.vig-track{height:6px;background:var(--borde);border-radius:3px;overflow:hidden;}
.vig-fill{height:100%;border-radius:3px;}
.card-footer{padding:12px 18px;background:var(--gris-bg);border-top:1px solid var(--borde);display:flex;gap:8px;flex-wrap:wrap;}
.btn-doc{flex:1;min-width:90px;padding:8px 10px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px;text-decoration:none;border:1.5px solid;transition:all .15s;}
.btn-cert{background:var(--azul-light);border-color:var(--azul);color:var(--azul-dark);}
.btn-dict{background:var(--verde-light);border-color:#639922;color:var(--verde);}
.btn-qr{background:var(--blanco);border-color:var(--borde);color:var(--texto-sub);}
.btn-doc.dis{opacity:.4;pointer-events:none;}
/* Badges */
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600;}
.b-vigente{background:var(--verde-light);color:var(--verde);}
.b-vence{background:var(--ambar-light);color:var(--ambar);}
.b-vencido{background:var(--rojo-light);color:var(--rojo);}
.b-cumple{background:var(--verde-light);color:var(--verde);}
.b-nocumple{background:var(--rojo-light);color:var(--rojo);}
/* Accesorios cards */
.acc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;}
.acc-card{background:var(--blanco);border-radius:12px;border:1px solid rgba(0,0,0,.05);box-shadow:0 2px 10px rgba(0,0,0,.04);padding:16px 18px;}
.acc-folio{font-family:monospace;font-size:11px;color:var(--texto-hint);margin-bottom:6px;}
.acc-fecha{font-size:13px;font-weight:600;color:var(--texto);margin-bottom:10px;}
.acc-badges{display:flex;gap:8px;flex-wrap:wrap;}
/* Personal tabla */
.tbl{width:100%;border-collapse:collapse;background:var(--blanco);border-radius:12px;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.04);}
.tbl th{background:var(--azul);color:#fff;padding:10px 14px;font-size:12px;font-weight:600;text-align:left;}
.tbl td{padding:10px 14px;border-bottom:1px solid var(--borde);font-size:13px;color:var(--texto);}
.tbl tr:last-child td{border-bottom:none;}
.tbl tr:hover td{background:var(--gris-bg);}
.btn-sm{padding:4px 10px;border-radius:6px;border:1.5px solid;font-size:11px;font-weight:600;cursor:pointer;text-decoration:none;display:inline-block;}
.btn-sm-cert{background:var(--azul-light);border-color:var(--azul);color:var(--azul-dark);}
.btn-sm-dip{background:var(--verde-light);border-color:#639922;color:var(--verde);}
.btn-sm-dc3{background:var(--ambar-light);border-color:var(--ambar);color:var(--ambar);}
/* Modal QR */
.overlay{position:fixed;inset:0;background:rgba(10,20,40,.5);z-index:200;display:none;align-items:center;justify-content:center;padding:20px;}
.overlay.open{display:flex;}
.modal-qr{background:var(--blanco);border-radius:16px;padding:28px 24px;text-align:center;max-width:300px;width:100%;box-shadow:0 24px 60px rgba(0,0,0,.2);}
.qr-folio{font-family:monospace;font-size:18px;font-weight:700;color:var(--texto);margin-bottom:4px;}
.qr-sub{font-size:12px;color:var(--texto-sub);margin-bottom:14px;}
.qr-img{width:160px;height:160px;margin:0 auto 14px;border-radius:8px;border:1px solid var(--borde);padding:6px;}
.qr-img img{width:100%;height:100%;}
.btn-cerrar{width:100%;padding:10px;border-radius:8px;border:none;background:var(--azul);color:#fff;font-size:13px;font-weight:600;cursor:pointer;}
/* Util */
.spin{width:20px;height:20px;border:2px solid var(--borde);border-top-color:var(--azul);border-radius:50%;animation:giro .7s linear infinite;display:inline-block;}
@keyframes giro{to{transform:rotate(360deg)}}
.empty{text-align:center;padding:48px 20px;color:var(--texto-hint);}
.empty-t{font-size:14px;font-weight:600;color:var(--texto-sub);margin-bottom:6px;}
.empty-s{font-size:13px;}
.loading{text-align:center;padding:40px;color:var(--texto-hint);}
</style>
</head>
<body>
<div class="header">
  <div class="hdr-l">
    <div class="hdr-logo">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
    </div>
    <div><div class="hdr-t">AVBA Inspections</div><div class="hdr-s">Portal de certificados</div></div>
  </div>
  <div class="hdr-r">
    <div><div class="hdr-user-t" id="hdr-nombre">—</div><div class="hdr-user-s">Cliente</div></div>
    <button class="btn-logout" onclick="cerrarSesion()">Salir</button>
  </div>
</div>

<div class="wrap">
  <div class="stats">
    <div class="stat"><div class="stat-n" id="s-eq" style="color:var(--azul)">—</div><div class="stat-l">Equipos certificados</div></div>
    <div class="stat"><div class="stat-n" id="s-acc" style="color:var(--verde)">—</div><div class="stat-l">Sesiones accesorios</div></div>
    <div class="stat"><div class="stat-n" id="s-per" style="color:var(--ambar)">—</div><div class="stat-l">Personal certificado</div></div>
  </div>

  <div class="tabs">
    <button class="tab-btn active" onclick="verTab('maq',this)">🔧 Maquinaria</button>
    <button class="tab-btn" onclick="verTab('acc',this)">🔗 Accesorios de Izaje</button>
    <button class="tab-btn" onclick="verTab('per',this)">👷 Personal</button>
  </div>

  <div id="tab-maq" class="tab-panel active">
    <div class="loading" id="maq-load"><span class="spin"></span><p style="margin-top:10px;font-size:13px">Cargando...</p></div>
    <div id="maq-cont" style="display:none"></div>
  </div>

  <div id="tab-acc" class="tab-panel">
    <div id="acc-cont"><div class="loading"><span class="spin"></span></div></div>
  </div>

  <div id="tab-per" class="tab-panel">
    <div id="per-cont"><div class="loading"><span class="spin"></span></div></div>
  </div>
</div>

<div class="overlay" id="qr-overlay">
  <div class="modal-qr">
    <div class="qr-folio" id="qr-folio">—</div>
    <div class="qr-sub">Código de validación</div>
    <div class="qr-img"><img id="qr-img" src="" alt="QR"></div>
    <button class="btn-cerrar" onclick="cerrarQR()">Cerrar</button>
  </div>
</div>

<script>
// ── Fetch interceptor ──────────────────────────────────────────────────────
const _origFetch = window.fetch.bind(window);
window.fetch = function(url, opts = {}) {
  const t = localStorage.getItem('token');
  if (t) {
    if (!opts.method || opts.method.toUpperCase() === 'GET') {
      opts.headers = Object.assign({}, opts.headers || {}, { 'Authorization': 'Bearer ' + t });
    } else {
      if (opts.body && typeof opts.body === 'string') {
        try {
          const b = JSON.parse(opts.body);
          if (!b.token) { b.token = t; opts.body = JSON.stringify(b); }
        } catch(_) {}
      }
    }
  }
  return _origFetch(url, opts);
};

const API = 'api/index.php';

// ── Session guard ──────────────────────────────────────────────────────────
const _tok = localStorage.getItem('token');
const _rol = localStorage.getItem('rol');
if (!_tok || _rol !== 'CLIENTE') { localStorage.clear(); location.href = 'login.html'; }

// ── Tab switching ──────────────────────────────────────────────────────────
function verTab(id, btn) {
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('tab-' + id).classList.add('active');
  btn.classList.add('active');
}

// ── QR modal ───────────────────────────────────────────────────────────────
function verQR(folio, qrUrl) {
  document.getElementById('qr-folio').textContent = folio;
  document.getElementById('qr-img').src = qrUrl;
  document.getElementById('qr-overlay').classList.add('open');
}
function cerrarQR() { document.getElementById('qr-overlay').classList.remove('open'); }

// ── Logout ─────────────────────────────────────────────────────────────────
function cerrarSesion() { localStorage.clear(); location.href = 'login.html'; }

// ── Vigencia bar ───────────────────────────────────────────────────────────
function vigenciaBar(fechaInicio, meses) {
  if (!fechaInicio || !meses) return '';
  const inicio = new Date(fechaInicio);
  const fin = new Date(inicio);
  fin.setMonth(fin.getMonth() + parseInt(meses, 10));
  const hoy = new Date();
  const pct = Math.min(100, Math.max(0, Math.round(((hoy - inicio) / (fin - inicio)) * 100)));
  const diasRest = Math.max(0, Math.round((fin - hoy) / 86400000));
  const vencido = hoy > fin;
  const color = vencido ? 'var(--rojo)' : pct < 60 ? 'var(--verde)' : pct < 85 ? 'var(--ambar)' : 'var(--rojo)';
  return `<div class="vig-wrap">
    <div class="vig-hdr">
      <span class="vig-lbl">Vigencia</span>
      <span class="vig-dias" style="color:${color}">${vencido ? '⚠ VENCIDA' : diasRest + ' días'}</span>
    </div>
    <div class="vig-track"><div class="vig-fill" style="width:${pct}%;background:${color}"></div></div>
    <div style="font-size:11px;color:var(--texto-hint);margin-top:3px;text-align:right">Vence: ${fin.toLocaleDateString('es-MX')}</div>
  </div>`;
}

// ── Badge ──────────────────────────────────────────────────────────────────
function badge(estado) {
  const cls = {
    'VIGENTE':'b-vigente','EMITIDO':'b-vigente','CUMPLE':'b-cumple',
    'POR VENCER':'b-vence','VENCIDO':'b-vencido','SUSPENDIDO':'b-vencido',
    'NO_CUMPLE':'b-nocumple','NO CUMPLE':'b-nocumple'
  };
  return `<span class="badge ${cls[estado]||''}">${estado||'—'}</span>`;
}

// ── Render Maquinaria ──────────────────────────────────────────────────────
function renderMaquinaria(data) {
  const load = document.getElementById('maq-load');
  const cont = document.getElementById('maq-cont');
  load.style.display = 'none';
  if (!data || !data.length) {
    cont.innerHTML = '<div class="empty"><div class="empty-t">Sin maquinaria registrada</div><div class="empty-s">No hay equipos asociados a esta cuenta.</div></div>';
    cont.style.display = 'block';
    return;
  }
  document.getElementById('s-eq').textContent = data.length;
  let html = '<div class="cards-grid">';
  data.forEach(eq => {
    html += `<div class="card">
      <div class="card-top">
        <div class="card-icon">🔧</div>
        <div style="flex:1">
          <div class="card-folio">${eq.control || '—'}</div>
          <div class="card-nombre">${eq.descripcion || eq.tipo || 'Equipo'}</div>
          <div class="card-serie">${eq.numero_serie ? 'S/N: ' + eq.numero_serie : ''}</div>
        </div>
        ${badge(eq.estatus)}
      </div>
      <div class="card-body">
        <div class="info-row"><span class="info-key">Marca / Modelo</span><span class="info-val">${eq.marca || '—'}${eq.modelo ? ' / ' + eq.modelo : ''}</span></div>
        <div class="info-row"><span class="info-key">Capacidad</span><span class="info-val">${eq.capacidad || '—'}</span></div>
        <div class="info-row"><span class="info-key">Fecha inspección</span><span class="info-val">${eq.fecha_inspeccion || eq.fecha || '—'}</span></div>
        ${vigenciaBar(eq.fecha_inspeccion || eq.fecha, eq.vigencia_meses || 12)}
      </div>
      ${eq.pdf_url ? `<div class="card-footer"><a class="btn-doc btn-cert" href="${eq.pdf_url}" target="_blank">📄 Ver certificado</a></div>` : ''}
    </div>`;
  });
  html += '</div>';
  cont.innerHTML = html;
  cont.style.display = 'block';
}

// ── Render Accesorios ──────────────────────────────────────────────────────
function renderAccesorios(data) {
  const cont = document.getElementById('acc-cont');
  if (!data || !data.length) {
    cont.innerHTML = '<div class="empty"><div class="empty-t">Sin accesorios registrados</div><div class="empty-s">No hay sesiones de accesorios asociadas.</div></div>';
    return;
  }
  document.getElementById('s-acc').textContent = data.length;
  let html = '<div class="acc-grid">';
  data.forEach(ses => {
    const accs = ses.accesorios || [];
    const cumple   = accs.filter(a => (a.estado||'').toUpperCase() === 'CUMPLE').length;
    const noCumple = accs.filter(a => (a.estado||'').toUpperCase() !== 'CUMPLE').length;
    html += `<div class="acc-card">
      <div class="acc-folio">${ses.folio || ses.control || ses.id || '—'}</div>
      <div class="acc-fecha">${ses.fecha || '—'}</div>
      <div style="font-size:12px;color:var(--texto-sub);margin-bottom:8px">Inspector: ${ses.inspector || '—'} &bull; ${accs.length} accesorio${accs.length!==1?'s':''}</div>
      <div class="acc-badges">
        ${cumple ? `<span class="badge b-cumple">✔ ${cumple} CUMPLE</span>` : ''}
        ${noCumple ? `<span class="badge b-nocumple">✖ ${noCumple} NO CUMPLE</span>` : ''}
        ${badge(ses.estatus || 'PENDIENTE')}
      </div>
      ${ses.pdf_url ? `<div style="margin-top:10px"><a class="btn-doc btn-cert" href="${ses.pdf_url}" target="_blank">📄 Ver informe</a></div>` : ''}
    </div>`;
  });
  html += '</div>';
  cont.innerHTML = html;
}

// ── Render Personal ────────────────────────────────────────────────────────
function renderPersonal(data) {
  const cont = document.getElementById('per-cont');
  if (!data || !data.length) {
    cont.innerHTML = '<div class="empty"><div class="empty-t">Sin personal registrado</div><div class="empty-s">No hay participantes certificados asociados.</div></div>';
    return;
  }
  document.getElementById('s-per').textContent = data.length;
  let html = '<div style="overflow-x:auto"><table class="tbl"><thead><tr><th>Nombre</th><th>Curso</th><th>Folio</th><th>Fecha</th><th>Resultado</th><th>Docs</th></tr></thead><tbody>';
  data.forEach(p => {
    let docs = '';
    if (p.constancia_url) docs += `<a class="btn-sm btn-sm-cert" href="${p.constancia_url}" target="_blank">Cert.</a> `;
    if (p.diploma_url)    docs += `<a class="btn-sm btn-sm-dip"  href="${p.diploma_url}"    target="_blank">Dip.</a> `;
    if (p.dc3_url)        docs += `<a class="btn-sm btn-sm-dc3"  href="${p.dc3_url}"        target="_blank">DC3</a>`;
    if (!docs) docs = '—';
    html += `<tr>
      <td>${p.nombre || p.participante || '—'}</td>
      <td>${p.curso || p.nombre_curso || '—'}</td>
      <td style="font-family:monospace;font-size:12px">${p.control || p.folio || '—'}</td>
      <td>${p.fecha || p.fecha_certificacion || '—'}</td>
      <td>${badge(p.resultado || p.estatus || '—')}</td>
      <td>${docs}</td>
    </tr>`;
  });
  html += '</tbody></table></div>';
  cont.innerHTML = html;
}

// ── Load all data ──────────────────────────────────────────────────────────
async function cargarDatos() {
  try {
    const res  = await fetch(API, { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({action:'OBTENER_DATOS_CLIENTE'}) });
    const json = await res.json();
    if (json.status !== 'success') throw new Error(json.message || 'Error al cargar datos');
    const d = json.data;
    document.getElementById('hdr-nombre').textContent = localStorage.getItem('nombre') || d.cliente || '—';
    renderMaquinaria(d.equipos   || []);
    renderAccesorios(d.accesorios || []);
    renderPersonal(d.personal    || []);
  } catch(e) {
    ['maq-cont','acc-cont','per-cont'].forEach(id => {
      const el = document.getElementById(id);
      if (el) el.innerHTML = `<p style="color:var(--rojo);text-align:center;padding:20px">Error al cargar: ${e.message}</p>`;
    });
    const load = document.getElementById('maq-load');
    if (load) load.style.display = 'none';
  }
}

cargarDatos();
</script>
</body>
</html>
