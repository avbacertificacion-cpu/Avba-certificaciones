<!DOCTYPE html>
<!-- AVBA Certificaciones · gestion.avba.com.mx · build check 2026-08-02 -->
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AVBA — Acceso al Sistema</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0b3d91">
  <link rel="apple-touch-icon" href="icon-192.png">
  <style>
    :root {
      --azul:      #185FA5;
      --azul-dark: #0C447C;
      --azul-light:#E6F1FB;
      --verde:     #3B6D11;
      --rojo:      #A32D2D;
      --rojo-light:#FCEBEB;
      --gris-bg:   #f0f4f9;
      --borde:     #dfe5ef;
      --texto:     #1a1a2e;
      --texto-sub: #5a6072;
      --blanco:    #ffffff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--gris-bg);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-wrap {
      width: 100%;
      max-width: 400px;
    }

    /* Logo / Header */
    .login-brand {
      text-align: center;
      margin-bottom: 28px;
    }
    .brand-logo { margin: 0 auto 12px; }
    .brand-logo img { display: block; width: 168px; max-width: 62vw; height: auto; margin: 0 auto; }
    /* El logo ya lleva el nombre; el texto queda para lectores de pantalla. */
    .solo-lectores { position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap; }
    .brand-sub  { font-size: 13px; color: var(--texto-sub); margin-top: 4px; }

    /* Card */
    .login-card {
      background: var(--blanco);
      border-radius: 16px;
      padding: 28px 28px 24px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
      border: 1px solid rgba(0,0,0,0.05);
    }
    .card-title { font-size: 17px; font-weight: 600; color: var(--texto); margin-bottom: 4px; }
    .card-sub   { font-size: 13px; color: var(--texto-sub); margin-bottom: 22px; }

    /* Fields */
    .field { margin-bottom: 16px; }
    .field label {
      display: block; font-size: 12px; font-weight: 600;
      color: var(--texto-sub); margin-bottom: 6px;
    }
    .input-wrap { position: relative; }
    .input-wrap svg {
      position: absolute; left: 12px; top: 50%;
      transform: translateY(-50%);
      width: 16px; height: 16px; color: var(--texto-sub);
      pointer-events: none;
    }
    .field input {
      width: 100%; padding: 11px 12px 11px 38px;
      border: 1.5px solid var(--borde); border-radius: 10px;
      font-size: 14px; color: var(--texto); background: var(--blanco);
      outline: none; transition: border-color .15s, box-shadow .15s;
    }
    .field input:focus {
      border-color: var(--azul);
      box-shadow: 0 0 0 3px rgba(24,95,165,0.1);
    }
    .field input.error { border-color: var(--rojo); box-shadow: 0 0 0 3px rgba(163,45,45,0.1); }

    /* Mostrar/ocultar contraseña */
    .toggle-pass {
      position: absolute; right: 12px; top: 50%;
      transform: translateY(-50%);
      cursor: pointer; color: var(--texto-sub);
      background: none; border: none; padding: 2px;
    }
    .toggle-pass svg { width: 16px; height: 16px; }

    /* Error */
    .error-box {
      background: var(--rojo-light);
      border: 1px solid #F09595;
      border-radius: 8px;
      padding: 10px 13px;
      font-size: 13px;
      color: var(--rojo);
      margin-bottom: 16px;
      display: none;
      align-items: center;
      gap: 8px;
    }
    .error-box.show { display: flex; }
    .error-box svg  { width: 15px; height: 15px; flex-shrink: 0; }

    /* Botón */
    .btn-login {
      width: 100%; padding: 13px;
      border: none; border-radius: 10px;
      background: var(--azul); color: white;
      font-size: 15px; font-weight: 600;
      cursor: pointer; transition: background .15s, transform .1s;
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .btn-login:hover  { background: var(--azul-dark); }
    .btn-login:active { transform: scale(0.98); }
    .btn-login:disabled { background: var(--borde); cursor: not-allowed; }
    .btn-login svg { width: 16px; height: 16px; }

    /* Spinner */
    .spin {
      width: 16px; height: 16px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: giro .6s linear infinite;
    }
    @keyframes giro { to { transform: rotate(360deg); } }

    /* Footer */
    .login-footer {
      text-align: center; margin-top: 20px;
      font-size: 12px; color: var(--texto-sub);
    }
  </style>
</head>
<body>

<div class="login-wrap">
  <div class="login-brand">
    <div class="brand-logo"><img src="assets/logos/avba.png" alt="AVBA Certifications"></div>
    <span class="solo-lectores">AVBA Certifications</span>
    <div class="brand-sub">Sistema de Gestión de Certificaciones</div>
  </div>

  <div class="login-card">
    <div class="card-title">Iniciar sesión</div>
    <div class="card-sub" id="card-sub">Ingresa tus credenciales para continuar</div>

    <!-- Banner para participantes (visible solo cuando viene ?sesion=) -->
    <div id="participante-banner" style="display:none;background:#E6F1FB;border:1px solid #85B7EB;border-radius:8px;padding:10px 13px;font-size:13px;color:#0C447C;margin-bottom:16px;align-items:center;gap:8px">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" style="width:15px;height:15px;flex-shrink:0">
        <circle cx="8" cy="5" r="3"/><path d="M2 14c0-3.3 2.7-6 6-6s6 2.7 6 6"/>
      </svg>
      <span>Acceso de participantes — ingresa la contraseña de tu curso</span>
    </div>

    <div class="error-box" id="error-box">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
        <circle cx="8" cy="8" r="6"/><path d="M8 5v3M8 10v.5"/>
      </svg>
      <span id="error-msg">Error</span>
    </div>

    <div class="field">
      <label>Usuario</label>
      <div class="input-wrap">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M8 8a3 3 0 100-6 3 3 0 000 6zM2 14c0-3.3 2.7-6 6-6s6 2.7 6 6"/>
        </svg>
        <input type="text" id="usuario" placeholder="Tu nombre de usuario"
          autocomplete="username" onkeydown="if(event.key==='Enter')focusPass()">
      </div>
    </div>

    <div class="field">
      <label>Contraseña</label>
      <div class="input-wrap">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
          <rect x="3" y="7" width="10" height="8" rx="2"/>
          <path d="M5 7V5a3 3 0 016 0v2"/>
        </svg>
        <input type="password" id="password" placeholder="Tu contraseña"
          autocomplete="current-password" onkeydown="if(event.key==='Enter')login()">
        <button class="toggle-pass" type="button" onclick="togglePass()" title="Mostrar contraseña">
          <svg id="eye-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M1 8s3-5 7-5 7 5 7 5-3 5-7 5-7-5-7-5z"/>
            <circle cx="8" cy="8" r="2"/>
          </svg>
        </button>
      </div>
    </div>

    <button class="btn-login" id="btn-login" onclick="login()">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M6 3H3v10h10v-3M9 8h6M12 5l3 3-3 3"/>
      </svg>
      Entrar
    </button>
  </div>

  <div class="login-footer">
    AVBA Inspections, Certifications and Maintenance S.A.S. de C.V.
  </div>
</div>

<script>
const API = "api/index.php";

// Destinos por rol — ajusta las rutas según tu despliegue
const DESTINOS = {
  ADMIN:           "admin.html",
  INSPECTOR:       "inspector.html",
  CALIDAD:         "calidad.html",
  CERTIFICACIONES: "certificaciones.html",
  ADMINISTRATIVO:  "administrativo.html",
  CLIENTE:         "portal-cliente.html",
  PARTICIPANTE:    "participante.html"
};

function focusPass() { document.getElementById("password").focus(); }

function togglePass() {
  const inp  = document.getElementById("password");
  const icon = document.getElementById("eye-icon");
  if (inp.type === "password") {
    inp.type = "text";
    icon.innerHTML = `<path d="M2 2l12 12M6.7 6.7A3 3 0 0011 11M1 8s3-5 7-5c1.4 0 2.7.4 3.8 1M15 8s-1.2 2-3.2 3.5" stroke="currentColor" stroke-width="1.5" fill="none"/>`;
  } else {
    inp.type = "password";
    icon.innerHTML = `<path d="M1 8s3-5 7-5 7 5 7 5-3 5-7 5-7-5-7-5z"/><circle cx="8" cy="8" r="2"/>`;
  }
}

function mostrarError(msg) {
  const box = document.getElementById("error-box");
  document.getElementById("error-msg").textContent = msg;
  box.classList.add("show");
}

function ocultarError() {
  document.getElementById("error-box").classList.remove("show");
}

async function login() {
  ocultarError();
  const usuario  = document.getElementById("usuario").value.trim();
  const password = document.getElementById("password").value.trim();

  if (!usuario || !password) {
    mostrarError("Ingresa tu usuario y contraseña.");
    return;
  }

  const btn = document.getElementById("btn-login");
  btn.disabled = true;
  btn.innerHTML = `<div class="spin"></div> Verificando...`;

  try {
    const res  = await fetch(API, {
      method: "POST",
      body:   JSON.stringify({ action: "LOGIN", payload: { usuario, password } })
    });
    const texto = await res.text();
    const data  = JSON.parse(texto);

    if (data.status !== "success") {
      mostrarError(data.message || "Error al iniciar sesión.");
      btn.disabled = false;
      btn.innerHTML = `<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 3H3v10h10v-3M9 8h6M12 5l3 3-3 3"/></svg> Entrar`;
      return;
    }

    // Guardar sesión
    localStorage.setItem("avba_session", JSON.stringify({
      usuario:       data.usuario,
      nombre:        data.nombre,
      rol:           data.rol,
      // De qué división es la cuenta. Sólo informativo: el servidor lo resuelve
      // solo en cada petición, según en qué base valió el token.
      division:      data.division || 'principal',
      id_cliente:    data.id_cliente,
      token:         data.token,
      es_subusuario: data.es_subusuario || false,
      permiso_sub:   data.permiso_sub || null,
      ts:            Date.now()
    }));

    // Redirigir según rol
    const destino = DESTINOS[data.rol];
    if (!destino) {
      mostrarError("Rol no reconocido: " + data.rol);
      btn.disabled = false;
      btn.innerHTML = `<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 3H3v10h10v-3M9 8h6M12 5l3 3-3 3"/></svg> Entrar`;
      return;
    }

    btn.innerHTML = `<div class="spin"></div> Entrando...`;
    window.location.href = destino;

  } catch(e) {
    mostrarError("Error de conexión. Intenta de nuevo.");
    btn.disabled = false;
    btn.innerHTML = `<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 3H3v10h10v-3M9 8h6M12 5l3 3-3 3"/></svg> Entrar`;
    console.error("login:", e);
  }
}

window.onload = function() {
  // Limpiar cualquier sesión previa al llegar al login
  // (evita el loop de redirección)
  localStorage.removeItem("avba_session");

  // Pre-llenar identificador si viene de sesión de participante
  const params = new URLSearchParams(window.location.search);
  const sesionId = params.get("sesion");
  if (sesionId) {
    document.getElementById("usuario").value = sesionId;
    document.getElementById("card-sub").textContent = "Ingresa la contraseña de tu curso para continuar.";
    document.getElementById("participante-banner").style.display = "flex";
    document.getElementById("password").focus();
  } else {
    document.getElementById("usuario").focus();
  }
};

// Registrar service worker (PWA instalable)
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function() {
    navigator.serviceWorker.register("service-worker.js").catch(function(){});
  });
}
</script>
</body>
</html>
