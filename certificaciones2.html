<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <meta charset="UTF-8">
  <title>Certificaciones</title>

  <style>
    body {
      font-family: Arial;
      background: #f5f7fa;
      margin: 0;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.1);
      overflow-x: auto;
    }

    table {
      width: 100%;
      min-width: 800px;
      border-collapse: collapse;
    }

    th, td {
      padding: 10px;
      border-bottom: 1px solid #ddd;
    }

    button {
      padding: 6px 10px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    .btn {
      background: #007bff;
      color: white;
    }

    .btn-success {
      background: #28a745;
      color: white;
    }

    .btn-danger {
      background: #dc3545;
      color: white;
    }

    .estado {
      padding: 5px 10px;
      border-radius: 8px;
      font-weight: bold;
    }

    .pendiente {
      background: #fff3cd;
      color: #856404;
    }

    .aprobado {
      background: #d4edda;
      color: #155724;
    }

    .modal {
      position: fixed;
      top:0; left:0;
      width:100%; height:100%;
      background: rgba(0,0,0,0.5);
      display:none;
      justify-content:center;
      align-items:center;
    }
    

 .modal-content {
  background: white;
  padding: 20px;
  border-radius: 10px;
  width: 90%;
  max-width: 700px; /* 🔥 clave */
  max-height: 85vh;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
}

@media (max-width: 600px) {
  .modal-content {
    width: 95%;
    max-height: 90vh;
  }
}

.grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr)); /* 🔥 clave */
  gap: 15px;
}
.grid > .section {
  width: 100%;
}


}

.section h4 {
  margin-bottom: 8px;
  font-size: 14px;
  color: #444;
  border-bottom: 1px solid #eee;
  padding-bottom: 5px;
}

.section p {
  margin: 5px 0;
  font-size: 13px;
  line-height: 1.4;
}
.acciones {
  margin-top: 15px;
  border-top: 1px solid #ddd;
  padding-top: 10px;

  display: flex;
  gap: 10px;
}

.acciones button {
  border-radius: 8px;
  transition: 0.2s;
}

.acciones button:hover {
  transform: scale(1.02);
}

@media (max-width: 600px) {
  .grid {
    grid-template-columns: 1fr;
  }
}



.input-envio:focus {
  border-color: #007bff;
}




textarea {
  box-sizing: border-box;
}
.input-envio {
  width: 100%;
  min-height: 120px;
  padding: 10px;
  border-radius: 10px;
  border: 1px solid #ddd;
  box-sizing: border-box; /* 🔥 clave */
  resize: none;
}
.section {
  background: #f9fafb;
  padding: 15px;
  border-radius: 10px;
  border: 1px solid #eee;
  box-sizing: border-box;
  min-width: 0;
  width: 100%;
}
.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 15px; /* 🔥 más aire */
  margin-top: 10px;
}



.section[style*="span 2"] {
  width: 100%;
}
.section textarea {
  margin-top: 8px;
}
  </style>
</head>

<body>

<h2>📄 Certificaciones</h2>

<div class="card">
  <table>
    <thead>
      <tr>
        <th>Cliente</th>
        <th>Maquinaria</th>
        <th>Serie</th>
        <th>Fecha</th>
        <th>Estado</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody id="tabla"></tbody>
  </table>
</div>

<!-- MODAL -->
<div class="modal" id="modal">
  <div class="modal-content">
    <div id="detalle"></div>
  </div>
</div>

<script>
    

const API = "api/index.php";
// Interceptor: inyecta token en llamadas a /api/index.php
(function() {
  const _fetch = window.fetch;
  window.fetch = function(url, opts = {}) {
    if (typeof url === 'string' && url.includes('api/index.php')) {
      const s = JSON.parse(localStorage.getItem('avba_session') || '{}');
      const t = s.token || '';
      if (opts.method === 'POST') {
        try { const b = JSON.parse(opts.body || '{}'); b.token = t; opts.body = JSON.stringify(b); } catch(e) {}
      } else {
        url = url + (url.includes('?') ? '&' : '?') + 'token=' + encodeURIComponent(t);
      }
    }
    return _fetch.call(this, url, opts);
  };
}());
let datosGlobal = [];
let filaSeleccionada = null;
let fileIdActual = null;




// 🔄 CARGAR DATOS
async function cargar() {
  const res = await fetch(API + "?action=getDataCertificaciones");
  const data = await res.json();

  datosGlobal = data;
  render(data);
}

// 🎯 RENDER TABLA
function render(data) {

  const tabla = document.getElementById("tabla");
  tabla.innerHTML = "";

  data.forEach(d => {

    const claseEstado = d.estado === "APROBADO CALIDAD" ? "pendiente" : "aprobado";

    tabla.innerHTML += `
      <tr>
        <td>${d.cliente}</td>
        <td>${d.maquinaria}</td>
        <td>${d.serie}</td>
        <td>${d.fecha}</td>
        <td><span class="estado ${claseEstado}">${d.estado}</span></td>
        <td>
          <button class="btn" onclick="ver(${d.fila})">Ver</button>
        </td>
      </tr>
    `;
  });
}

// 👁️ VER DETALLE
function ver(fila) {

  filaSeleccionada = fila;
  const d = datosGlobal.find(x => x.fila === fila);

  const html = `
    <div style="flex:1; overflow-y:auto;">

      <h3 style="margin-bottom:10px;">${d.cliente || ""}</h3>

      <div class="grid">

        <div class="section">
          <h4>📍 Ubicación</h4>
          <p><b>Domicilio:</b> ${d.domicilio || ""}</p>
          <p><b>Dirección:</b> ${d.direccion || ""}</p>
        </div>

        <div class="section">
          <h4>⚙️ Equipo</h4>
          <p><b>Maquinaria:</b> ${d.maquinaria || ""}</p>
          <p><b>Marca:</b> ${d.marca || ""}</p>
          <p><b>Modelo:</b> ${d.modelo || ""}</p>
          <p><b>Serie:</b> ${d.serie || ""}</p>
          <p><b>ID:</b> ${d.id || ""}</p>
        </div>

        <div class="section">
          <h4>📅 Servicio</h4>
          <p><b>Fecha:</b> ${d.fecha || ""}</p>
          <p><b>Correo:</b> ${d.correo || ""}</p>
          <p><b>Estado:</b> ${d.estado || ""}</p>
        </div>

        <div class="section">
          <h4>📎 Evidencia</h4>
          <p>
            ${d.evidencia 
              ? `<a href="${d.evidencia}" target="_blank">Abrir evidencia</a>` 
              : "Sin evidencia"}
          </p>
          
          
          <p><b>Envío:</b> ${d.envio || ""}</p>
        </div>
        
      <div class="section" style="grid-column: span 2;">
  <h4>📦 Direccion de envío</h4>

  <textarea id="envio" class="input-envio">${d.envio || ""}</textarea>
</div>
<input type="hidden" id="coordenadas" value="${d.coordenadas || ""}">
<div class="section" style="grid-column: span 2;">
  <div id="map" style="width:100%; height:250px; border-radius:10px;"></div>
</div>

      </div>

      <div class="section" style="margin-top:10px;">
        <h4>📝 Motivo de rechazo</h4>
        <textarea id="motivo" style="width:100%; height:60px;">${d.motivo || ""}</textarea>
      </div>

    </div>

    <!-- 🔥 ACCIONES -->
    <div class="acciones">

      <button class="btn" onclick="imprimirPDF(${d.fila})">🖨️ Imprimir</button>
      
      <button class="btn-success" onclick="generarVista('${d.estado}')">👁️ Vista PDF</button>
      <button class="btn-success" onclick="enviar('${d.estado}')">📧 Enviar</button>
      <button class="btn-danger" onclick="rechazar('${d.estado}')">❌ Rechazar</button>
      <button class="btn" onclick="guardarEnvio()">💾 Guardar</button>
      

      <button onclick="cerrar()">Cerrar</button>

    </div>
  `;

  document.getElementById("detalle").innerHTML = html;
  document.getElementById("modal").style.display = "flex";
  setTimeout(() => {
  initMap();
}, 300);
}
// ❌ CERRAR
function cerrar() {
  document.getElementById("modal").style.display = "none";
}

// 🖨️ IMPRIMIR
async function imprimirPDF(fila) {

  const res = await fetch(`${URL}?action=IMPRIMIR_PDF&fila=${fila}`);
  const data = await res.json();

  const pdfWindow = window.open("");
  pdfWindow.document.write(
    `<iframe width="100%" height="100%" src="data:application/pdf;base64,${data.pdf}"></iframe>`
  );
}

// 👁️ GENERAR VISTA
async function generarVista(estado) {

  if (estado === "CERTIFICADO") {
    alert("Este certificado ya fue emitido");
  }

  const res = await fetch(API, {
    method: "POST",
    body: JSON.stringify({
      action: "GENERAR_PDF_ENVIO",
      payload: { fila: filaSeleccionada }
    })
  });

  const data = await res.json();

  window.open(data.link);

  fileIdActual = data.fileId;
}

// 📧 ENVIAR
async function enviar(estado) {

  if (estado === "CERTIFICADO") {
    alert("Este certificado ya fue emitido");
  }

  if (!fileIdActual) {
    alert("Primero genera la vista del PDF");
    return;
  }

  await fetch(API, {
    method: "POST",
    body: JSON.stringify({
      action: "ENVIAR_CERTIFICADO",
      payload: {
        fila: filaSeleccionada,
        fileId: fileIdActual
      }
    })
  });

  alert("Correo enviado");
  cargar();
}

// ❌ RECHAZAR
async function rechazar(estado) {

  if (estado === "CERTIFICADO") {
    alert("Este certificado ya fue emitido");
  }

  const motivo = document.getElementById("motivo").value;

  if (!motivo) {
    alert("Escribe un motivo");
    return;
  }

  await fetch(API, {
    method: "POST",
    body: JSON.stringify({
      action: "RECHAZAR_CERTIFICACION",
      payload: {
        fila: filaSeleccionada,
        motivo
      }
    })
  });

  alert("Rechazado");
  cargar();
}

async function guardarEnvio() {

  const envio = document.getElementById("envio").value;
  const coordenadas = document.getElementById("coordenadas").value;

  await fetch(API, {
    method: "POST",
    body: JSON.stringify({
      action: "GUARDAR_ENVIO",
      payload: {
        fila: filaSeleccionada,
        envio,
        coordenadas
      }
    })
  });

  alert("Datos de envío guardados");
  cargar();
}

async function guardarEnvio() {

  const envio = document.getElementById("envio").value;
  const coordenadas = document.getElementById("coordenadas").value;

  await fetch(API, {
    method: "POST",
    body: JSON.stringify({
      action: "GUARDAR_ENVIO",
      payload: {
        fila: filaSeleccionada,
        envio,
        coordenadas
      }
    })
  });

  alert("Envío actualizado correctamente");
  cargar();
}
function abrirMapa() {

  const direccion = document.getElementById("envio").value;

  if (!direccion) {
    alert("Escribe una dirección primero");
    return;
  }

  const url = "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(direccion);

  window.open(url, "_blank");
}
function pegarCoordenadas() {
  navigator.clipboard.readText().then(text => {
    document.getElementById("coordenadas").value = text;
  });
}

let map;
let marker;


function initMap() {

  // 🔥 limpiar mapa anterior si existe
  if (map) {
    map.remove();
    map = null;
  }

  const coordInput = document.getElementById("coordenadas")?.value;

  let lat = 19.4326;   // CDMX default
  let lng = -99.1332;

  // 🔥 SI HAY COORDENADAS GUARDADAS
  if (coordInput) {
    const parts = coordInput.split(",");

    if (parts.length === 2) {
      lat = parseFloat(parts[0]);
      lng = parseFloat(parts[1]);
    }
  }

  map = L.map('map').setView([lat, lng], 15);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap'
  }).addTo(map);

  // 🔥 SI YA HABÍA COORDENADAS → PONER MARCADOR
  marker = L.marker([lat, lng]).addTo(map);

  // CLICK EN MAPA
  map.on('click', function(e) {

    const lat = e.latlng.lat;
    const lng = e.latlng.lng;

    marker.setLatLng(e.latlng);

    document.getElementById("coordenadas").value = lat + "," + lng;

    obtenerDireccion(lat, lng);
  });
}

async function obtenerDireccion(lat, lng) {

  try {

    const res = await fetch(
      `https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lng}&format=json`
    );

    const data = await res.json();

    if (data && data.display_name) {
      document.getElementById("envio").value = data.display_name;
    }

  } catch (error) {
    console.log("Error obteniendo dirección", error);
  }
}

// 🚀 INICIO
cargar();

</script>

</body>
</html>
