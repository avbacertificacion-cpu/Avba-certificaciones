name: Deploy Extintores a Hostinger

on:
  push:
    branches:
      - claude/extinguisher-management-system-Y3Om9

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repo
        uses: actions/checkout@v4

      - name: Deploy via FTP - SOLO la carpeta extinguisher-system
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./extinguisher-system/
          server-dir: ./extintores/
          exclude: |
            **/.git*
            **/.git*/**
            config/**
            **/config/**
