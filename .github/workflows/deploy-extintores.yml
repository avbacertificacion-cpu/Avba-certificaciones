name: Deploy Extintores a Hostinger

on:
  push:
    branches:
      - claude/extinguisher-management-system-Y3Om9

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repo
        uses: actions/checkout@v4

      - name: Quitar la config interna antes de subir
        run: rm -rf extinguisher-system/config

      - name: Subir SOLO la carpeta extinguisher-system por SSH (SCP)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          source: "extinguisher-system/*"
          target: "/home/u218429682/domains/gestion.avba.com.mx/public_html/extintores"
          strip_components: 1
          overwrite: true
          
