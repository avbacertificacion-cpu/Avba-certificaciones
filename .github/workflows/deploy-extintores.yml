name: Deploy Extintores a Hostinger

on:
  push:
    branches:
      - claude/extintores-deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repo
        uses: actions/checkout@v4

      - name: Deploy via FTP - raiz del repo a /extintores/
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./
          server-dir: ./extintores/
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            config/**
            **/config/**
