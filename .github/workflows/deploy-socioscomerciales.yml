name: Deploy Socios Comerciales
on:
  push:
    branches: [ claude/socios-comerciales-portal-wco7s3 ]
    paths:
      - 'socioscomerciales/**'
      - '.github/workflows/deploy-socioscomerciales.yml'
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Subir socioscomerciales por SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host:     ${{ secrets.SSH_HOST }}
          port:     ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          source:   "socioscomerciales"
          target:   "/home/u218429682/domains/gestion.avba.com.mx/public_html"
          overwrite: true
          # El timeout por defecto (30s) agotaba la conexion de forma
          # intermitente y tumbaba el deploy sin que nada estuviera mal.
          timeout: 120s
          command_timeout: 10m
