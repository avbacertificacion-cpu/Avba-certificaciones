name: App iOS

# Compila la app de iOS en una Mac de GitHub: no hace falta tener Mac propia.
#
#   · Sin secretos: compila para el simulador, sólo para comprobar que todo
#     arma bien.
#   · Con los secretos: firma la app y la sube a App Store Connect, de donde
#     pasa a TestFlight y a revisión. La firma la resuelven las herramientas
#     de línea de comandos de Codemagic (codemagic-cli-tools, código abierto):
#     con la llave de API de App Store Connect crean o reutilizan el
#     certificado de distribución y el perfil, sin pasos manuales en una Mac.
#
# Secretos (Settings → Secrets and variables → Actions):
#   ASC_ISSUER_ID         Issuer ID de la llave de API de App Store Connect
#   ASC_KEY_ID            Key ID de esa llave
#   ASC_KEY_P8            contenido del archivo AuthKey_XXXX.p8, tal cual
#   IOS_CERT_PRIVATE_KEY  llave privada RSA (PEM) con la que se crea el
#                         certificado de distribución; se genera una sola vez
#
# Sólo corre a mano o con una etiqueta app-v*.

on:
  workflow_dispatch:
    inputs:
      subir_a_app_store:
        description: 'Subir a App Store Connect / TestFlight (requiere secretos)'
        type: boolean
        default: true
  push:
    tags:
      - 'app-v*'

concurrency:
  group: app-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      TIENE_FIRMA: ${{ secrets.ASC_KEY_P8 != '' && secrets.ASC_KEY_ID != '' && secrets.ASC_ISSUER_ID != '' && secrets.IOS_CERT_PRIVATE_KEY != '' }}
      PROYECTO: mobile/ios/App/App.xcodeproj
      BUNDLE_ID: mx.com.avba.certificaciones

    steps:
      - uses: actions/checkout@v4

      # Capacitor 8 pide Xcode 26 o más nuevo
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Dependencias, pantallas y sincronizar iOS
        working-directory: mobile
        run: |
          npm ci
          npm run sync:ios

      - name: Compilar para el simulador (sin firma)
        if: env.TIENE_FIRMA != 'true'
        run: |
          xcodebuild -project "$PROYECTO" -scheme App -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build
          echo "::notice::Sin secretos de App Store Connect: sólo se comprobó que la app compila. Ver mobile/README.md, sección App Store."

      - uses: actions/setup-python@v5
        if: env.TIENE_FIRMA == 'true'
        with:
          python-version: '3.12'

      - name: Firma (certificado y perfil desde App Store Connect)
        if: env.TIENE_FIRMA == 'true'
        env:
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_IDENTIFIER: ${{ secrets.ASC_KEY_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.ASC_KEY_P8 }}
          CERTIFICATE_PRIVATE_KEY: ${{ secrets.IOS_CERT_PRIVATE_KEY }}
        run: |
          pip install --quiet codemagic-cli-tools
          keychain initialize
          # Reutiliza el certificado y el perfil si ya existen; si no, los crea
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE --strict-match-identifier --create
          keychain add-certificates
          xcode-project use-profiles --project "$PROYECTO"

      - name: Compilar y empaquetar (.ipa)
        if: env.TIENE_FIRMA == 'true'
        run: |
          # El número de compilación sube en cada corrida: App Store Connect
          # no acepta dos compilaciones con el mismo número en una versión.
          sed -i '' "s/CURRENT_PROJECT_VERSION = [0-9]*;/CURRENT_PROJECT_VERSION = ${GITHUB_RUN_NUMBER};/g" "$PROYECTO/project.pbxproj"
          xcode-project build-ipa --project "$PROYECTO" --scheme App --ipa-directory "$RUNNER_TEMP/ipa"

      - name: Subir a App Store Connect (TestFlight)
        if: env.TIENE_FIRMA == 'true' && (github.event_name == 'push' || inputs.subir_a_app_store)
        env:
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_IDENTIFIER: ${{ secrets.ASC_KEY_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.ASC_KEY_P8 }}
        run: |
          app-store-connect publish --path "$RUNNER_TEMP"/ipa/*.ipa
          echo "::notice::Compilación $GITHUB_RUN_NUMBER subida a App Store Connect. Aparece en TestFlight en cuanto Apple termine de procesarla (15 a 30 minutos)."

      - uses: actions/upload-artifact@v4
        if: env.TIENE_FIRMA == 'true'
        with:
          name: avba-ios-ipa
          path: ${{ runner.temp }}/ipa/*.ipa
          if-no-files-found: ignore
          retention-days: 30

      - name: Limpiar el llavero
        if: always() && env.TIENE_FIRMA == 'true'
        run: keychain use-login || true
