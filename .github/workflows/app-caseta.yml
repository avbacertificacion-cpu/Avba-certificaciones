name: App Control de Accesos (Android)

# Compila «AVBA Control de Accesos» (mobile/caseta): la app del guardia que lee
# la credencial en el propio teléfono (cámara + reconocimiento de texto sin
# internet) y registra entradas y salidas en la plataforma de Control de Accesos
# (abre gestion.avba.com.mx/controlaccesos/accesos.html; las pantallas no van
# dentro de la app).
#
#   · APK de prueba, instalable directo en el teléfono (artefacto del flujo).
#   · La misma APK se publica en el sitio para descargarla desde el celular:
#     https://gestion.avba.com.mx/controlaccesos/descargas/avba-control-accesos.apk
#
# Es OTRA app que «AVBA Caseta» (la del sistema principal): otro identificador
# (mx.com.avba.controlaccesos) y su propia llave, así se instala junto a ella
# mientras dura el cambio y nunca choca con su firma.
#
# Por ahora está APAGADO: la plataforma nueva todavía no funciona (falta la
# fase 1 de docs/PLAN.md) y una app publicada abriría una pantalla sin servidor.
# Se enciende descomentando el «push» de abajo. (El botón «Run workflow» de
# GitHub sólo aparece para flujos que están en la rama por omisión, main.)

on:
  workflow_dispatch:
  # push:
  #   branches:
  #     - claude/control-accesos
  #   paths:
  #     - 'mobile/caseta/**'
  #     - '.github/workflows/app-caseta.yml'

concurrency:
  group: app-control-accesos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: mobile/caseta

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/caseta/package-lock.json

      # Capacitor 8 pide JDK 21
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # Llave de prueba fija: se crea la primera vez y se guarda en la caché de
      # GitHub, así cada versión se instala encima de la anterior. No se sube al
      # repositorio (*.jks está en .gitignore). Para Google Play se usaría otra.
      - name: Llave de prueba (caché)
        uses: actions/cache@v4
        with:
          path: mobile/caseta/firma-prueba.jks
          key: avba-control-accesos-firma-v1

      - name: Llave de prueba (crear si no existe)
        run: |
          if [ ! -f firma-prueba.jks ]; then
            keytool -genkeypair -keystore firma-prueba.jks -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=AVBA Control de Accesos (prueba), O=AVBA, C=MX"
          fi
          echo "AVBA_FIRMA_PRUEBA=$PWD/firma-prueba.jks" >> "$GITHUB_ENV"
          keytool -list -keystore firma-prueba.jks -storepass android | grep -i "SHA-256\|SHA256" || true

      - name: Dependencias
        run: npm ci

      - name: Armar la pantalla y sincronizar Android
        run: npm run sync

      - name: Número de versión
        run: |
          echo "AVBA_VERSION_CODE=$((100 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          echo "versionCode: $((100 + GITHUB_RUN_NUMBER))"

      - name: Pruebas del lector y APK
        working-directory: mobile/caseta/android
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug

      - name: Preparar la descarga
        run: |
          mkdir -p "$GITHUB_WORKSPACE/publicar/descargas"
          cp android/app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/publicar/descargas/avba-control-accesos.apk"
          ls -l "$GITHUB_WORKSPACE/publicar/descargas"

      - uses: actions/upload-artifact@v4
        with:
          name: avba-control-accesos-apk
          path: publicar/descargas/avba-control-accesos.apk
          retention-days: 30

      # Hostinger a veces no acepta la conexión al primer intento
      - name: Publicar la APK en el sitio (intento 1 de 2)
        id: scp1
        continue-on-error: true
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          source: "publicar/descargas/avba-control-accesos.apk"
          target: "/home/u218429682/domains/gestion.avba.com.mx/public_html/controlaccesos/descargas"
          strip_components: 2
          overwrite: true
          timeout: 60s

      - name: Esperar antes del segundo intento
        if: steps.scp1.outcome == 'failure'
        run: sleep 90

      - name: Publicar la APK en el sitio (intento 2 de 2)
        if: steps.scp1.outcome == 'failure'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          source: "publicar/descargas/avba-control-accesos.apk"
          target: "/home/u218429682/domains/gestion.avba.com.mx/public_html/controlaccesos/descargas"
          strip_components: 2
          overwrite: true
          timeout: 60s
