name: App Android

# Compila la app de Android a partir de mobile/ (las pantallas del portal van
# dentro de la app, ver mobile/scripts/build-www.mjs).
#
#   · Siempre:  APK de prueba (debug) para instalar directo en un teléfono.
#   · Con los secretos de firma: AAB firmado, el que se sube a Google Play.
#   · Con PLAY_SERVICE_ACCOUNT_JSON y "Subir a Google Play" marcado (o con una
#     etiqueta app-v*): lo deja como borrador en la pista de pruebas internas.
#
# Secretos (Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_BASE64   el .jks de firma, en base64
#   ANDROID_KEYSTORE_PASSWORD contraseña del almacén
#   ANDROID_KEY_ALIAS         alias de la llave
#   ANDROID_KEY_PASSWORD      contraseña de la llave
#   PLAY_SERVICE_ACCOUNT_JSON (opcional) cuenta de servicio de Google Play
#
# Este flujo no toca el servidor: el despliegue a Hostinger es otro flujo y
# excluye la carpeta mobile/.

on:
  workflow_dispatch:
    inputs:
      subir_a_play:
        description: 'Subir el AAB firmado a Google Play (pruebas internas, como borrador)'
        type: boolean
        default: false
  push:
    tags:
      - 'app-v*'
    branches:
      - claude/continue-avba-project-bU5LX
    paths:
      - 'mobile/**'
      - 'js/app-shell.js'
      - '.github/workflows/app-android.yml'

concurrency:
  group: app-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TIENE_FIRMA: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
      TIENE_PLAY: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      # Capacitor 8 pide JDK 21
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Dependencias
        run: npm ci

      - name: Armar las pantallas y sincronizar Android
        run: npm run sync:android

      # Google Play rechaza un versionCode repetido: cada corrida usa uno mayor.
      - name: Número de versión
        run: |
          echo "AVBA_VERSION_CODE=$((20000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          echo "versionCode: $((20000 + GITHUB_RUN_NUMBER))"

      - name: APK de prueba
        working-directory: mobile/android
        run: ./gradlew --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: avba-android-prueba-apk
          path: mobile/android/app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Preparar la llave de firma
        if: env.TIENE_FIRMA == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/avba-firma.jks"
          echo "AVBA_KEYSTORE_PATH=$RUNNER_TEMP/avba-firma.jks" >> "$GITHUB_ENV"

      - name: AAB firmado para Google Play
        if: env.TIENE_FIRMA == 'true'
        working-directory: mobile/android
        env:
          AVBA_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          AVBA_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          AVBA_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon bundleRelease

      - uses: actions/upload-artifact@v4
        if: env.TIENE_FIRMA == 'true'
        with:
          name: avba-android-play-aab
          path: mobile/android/app/build/outputs/bundle/release/*.aab
          retention-days: 30

      - name: Aviso sin firma
        if: env.TIENE_FIRMA != 'true'
        run: |
          echo "::notice::Sin secretos de firma: sólo se generó el APK de prueba. Ver mobile/README.md, sección Google Play."

      # La primera subida de una app nueva se hace a mano en Play Console;
      # de ahí en adelante este paso la deja como borrador en pruebas internas.
      - name: Subir a Google Play (pruebas internas)
        if: env.TIENE_FIRMA == 'true' && env.TIENE_PLAY == 'true' && (inputs.subir_a_play || startsWith(github.ref, 'refs/tags/app-v'))
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: mx.com.avba.certificaciones
          releaseFiles: mobile/android/app/build/outputs/bundle/release/*.aab
          track: internal
          status: draft

      - name: Borrar la llave de firma
        if: always()
        run: rm -f "$RUNNER_TEMP/avba-firma.jks"
