name: Deploy Proyecto 1 a Hostinger

on:
  push:
    branches:
      - claude/continue-avba-project-bU5LX

# El SCP a Hostinger falla de forma intermitente con "dial tcp: i/o timeout"
# (la conexión no se establece, no es un problema del contenido). Por eso el
# envío se intenta hasta 3 veces con una pausa entre intentos: los dos
# primeros no marcan el job como fallido, y solo si el tercero también falla
# se reporta el error. Además se amplía el timeout de conexión a 60s, porque
# los intentos fallidos se rendían justo al llegar a los 30s por defecto.
#
# Las pausas son de 1 y 3 minutos porque cuando el servidor deja de aceptar
# conexiones lo hace durante un rato: con esperas de 20 y 40 segundos los tres
# intentos caían dentro del mismo mal momento y el despliegue se perdía entero.
# Ya pasó una vez, y dejó el sistema con media versión subida.
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repo
        uses: actions/checkout@v4

      - name: Quitar archivos que no se deben subir
        run: |
          # Credenciales y metadatos del repositorio.
          rm -rf .git .github config
          # Herramientas de prueba, diagnóstico y mantenimiento. Sirven en
          # desarrollo; en el servidor sólo son superficie expuesta. Siguen en
          # el repositorio, nada más dejan de publicarse.
          rm -f diagnostico_arranque.php diagnostico_pdf.php \
                setup_demo.php mantenimiento_qr_personal.php \
                test_cert.php test_cert_datos.php test_dictamen.php \
                generar_cert_web.php generar_dictamen_web.php generar_dictamen.php
          # Material de desarrollo que el sitio nunca sirve: migraciones de
          # base de datos, el proyecto de la app móvil, utilidades y el
          # convertidor, que va en otro servidor (CONVERT_SERVICE_URL).
          rm -rf db sql mobile tools convert-service

      - name: Subir por SCP (intento 1 de 3)
        id: scp1
        continue-on-error: true
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          source: "."
          target: "/home/u218429682/domains/gestion.avba.com.mx/public_html"
          strip_components: 0
          overwrite: true
          timeout: 60s

      - name: Esperar antes del segundo intento
        if: steps.scp1.outcome == 'failure'
        run: sleep 60

      - name: Subir por SCP (intento 2 de 3)
        id: scp2
        if: steps.scp1.outcome == 'failure'
        continue-on-error: true
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          source: "."
          target: "/home/u218429682/domains/gestion.avba.com.mx/public_html"
          strip_components: 0
          overwrite: true
          timeout: 60s

      - name: Esperar antes del tercer intento
        if: steps.scp1.outcome == 'failure' && steps.scp2.outcome == 'failure'
        run: sleep 180

      # Último intento: sin continue-on-error, así que si este falla el job
      # sí se marca como fallido y el error queda visible.
      - name: Subir por SCP (intento 3 de 3)
        id: scp3
        if: steps.scp1.outcome == 'failure' && steps.scp2.outcome == 'failure'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          source: "."
          target: "/home/u218429682/domains/gestion.avba.com.mx/public_html"
          strip_components: 0
          overwrite: true
          timeout: 60s

      # El envío por SCP sólo agrega y sobrescribe: nunca borra. Lo que subieron
      # los despliegues anteriores sigue en el servidor, así que hay que
      # quitarlo una vez. Es una lista fija, nombre por nombre y sin comodines;
      # si alguno ya no está, rm -f no se queja. Las carpetas no se tocan: no
      # se puede saber desde aquí si alguien dejó algo suyo dentro.
      - name: Quitar del servidor lo que ya no se publica
        continue-on-error: true
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            cd /home/u218429682/domains/gestion.avba.com.mx/public_html || exit 1
            rm -f diagnostico_arranque.php diagnostico_pdf.php
            rm -f setup_demo.php mantenimiento_qr_personal.php
            rm -f test_cert.php test_cert_datos.php test_dictamen.php
            rm -f generar_cert_web.php generar_dictamen_web.php generar_dictamen.php
            # Clases retiradas del sistema. Nadie las incluye ya, pero un .php
            # suelto en api/ sigue siendo accesible desde fuera.
            rm -f api/Facturapi.php
            echo "PHP que queda en la raíz del sitio:"
            ls -1 *.php
            echo "Clases retiradas que siguieran en api/:"
            ls -1 api/Facturapi.php 2>/dev/null || echo "  ninguna"

      - name: Resultado del despliegue
        run: |
          if [ "${{ steps.scp1.outcome }}" = "success" ]; then
            echo "✅ Desplegado al primer intento."
          elif [ "${{ steps.scp2.outcome }}" = "success" ]; then
            echo "✅ Desplegado en el segundo intento (el primero falló por red)."
          else
            echo "✅ Desplegado en el tercer intento (los dos primeros fallaron por red)."
          fi
