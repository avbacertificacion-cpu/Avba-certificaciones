<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validar Extintor - AVBA</title>
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 100%;
            padding: 40px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 28px;
            color: #333;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
            font-size: 14px;
            line-height: 1.6;
        }

        .input-section {
            margin-bottom: 30px;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        #codigo {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        #codigo:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-search {
            background: #667eea;
            color: white;
        }

        .btn-search:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .btn-scan {
            background: #48bb78;
            color: white;
            width: 100%;
            margin-bottom: 10px;
        }

        .btn-scan:hover {
            background: #38a169;
        }

        .btn-close {
            background: #e2e8f0;
            color: #333;
        }

        .btn-close:hover {
            background: #cbd5e0;
        }

        #scanner {
            display: none;
            margin-bottom: 20px;
            border-radius: 8px;
            overflow: hidden;
        }

        #scanner.active {
            display: block;
        }

        .result {
            display: none;
            margin-top: 30px;
            padding: 20px;
            border-radius: 8px;
            animation: slideIn 0.3s ease-out;
        }

        .result.show {
            display: block;
        }

        .result.found {
            background: #f0fdf4;
            border: 2px solid #48bb78;
        }

        .result.not-found {
            background: #fef2f2;
            border: 2px solid #f87171;
        }

        .result-title {
            font-weight: 700;
            font-size: 16px;
            margin-bottom: 15px;
        }

        .result.found .result-title {
            color: #166534;
        }

        .result.not-found .result-title {
            color: #991b1b;
        }

        .result-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            font-size: 14px;
            border-bottom: 1px solid rgba(0, 0, 0, 0.1);
        }

        .result-item:last-child {
            border-bottom: none;
        }

        .result-label {
            font-weight: 600;
            color: #555;
        }

        .result-value {
            color: #333;
            text-align: right;
            flex: 1;
            margin-left: 20px;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .status-activo {
            background: #d1fae5;
            color: #065f46;
        }

        .status-inactivo {
            background: #fee2e2;
            color: #991b1b;
        }

        .status-en_prestamo {
            background: #fef3c7;
            color: #92400e;
        }

        .inspecciones {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid rgba(0, 0, 0, 0.1);
        }

        .inspecciones-title {
            font-weight: 700;
            font-size: 13px;
            text-transform: uppercase;
            color: #555;
            margin-bottom: 10px;
        }

        .inspeccion-item {
            padding: 10px;
            background: rgba(0, 0, 0, 0.05);
            border-radius: 6px;
            margin-bottom: 8px;
            font-size: 13px;
        }

        .inspeccion-fecha {
            font-weight: 600;
            color: #333;
        }

        .inspeccion-inspector {
            color: #666;
            font-size: 12px;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
            color: #667eea;
        }

        .spinner {
            border: 3px solid #e0e0e0;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .error-message {
            background: #fef2f2;
            border: 2px solid #f87171;
            color: #991b1b;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        .footer {
            text-align: center;
            margin-top: 30px;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.8);
        }

        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }

            .header h1 {
                font-size: 22px;
            }

            .input-group {
                flex-direction: column;
            }

            .btn {
                width: 100%;
            }

            .result-item {
                flex-direction: column;
                align-items: flex-start;
            }

            .result-value {
                text-align: left;
                margin-left: 0;
                margin-top: 4px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🧯 Validar Extintor</h1>
            <p>Escanea el código QR o ingresa el código del extintor para ver su información</p>
        </div>

        <div class="input-section">
            <button class="btn btn-scan" id="btnScanner">📱 Escanear Código QR</button>

            <div id="scanner"></div>

            <div class="input-group">
                <input type="text" id="codigo" placeholder="Ej: EXT-001 o código QR" autocomplete="off" autofocus>
                <button class="btn btn-search" id="btnBuscar">Buscar</button>
            </div>
        </div>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Buscando extintor...</p>
        </div>

        <div class="error-message" id="errorMessage"></div>

        <div class="result" id="result"></div>
    </div>

    <div class="footer">
        <p>Sistema de Validación de Extintores © 2026 AVBA</p>
    </div>

    <script>
        let qrScanner = null;
        let scannerActive = false;

        const btnScanner = document.getElementById('btnScanner');
        const btnBuscar = document.getElementById('btnBuscar');
        const codigoInput = document.getElementById('codigo');
        const scannerDiv = document.getElementById('scanner');
        const resultDiv = document.getElementById('result');
        const loadingDiv = document.getElementById('loading');
        const errorDiv = document.getElementById('errorMessage');

        btnScanner.addEventListener('click', toggleScanner);
        btnBuscar.addEventListener('click', buscar);
        codigoInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') buscar();
        });

        // Auto-search si hay parámetro ?qr= en la URL
        const params = new URLSearchParams(window.location.search);
        const qrParam = params.get('qr');
        if (qrParam && qrParam.length <= 50) {  // Validar longitud
            codigoInput.value = qrParam.trim();
            buscar();
        }

        function toggleScanner() {
            if (scannerActive) {
                detenerScanner();
            } else {
                iniciarScanner();
            }
        }

        function iniciarScanner() {
            scannerActive = true;
            btnScanner.textContent = '❌ Cerrar Scanner';
            scannerDiv.classList.add('active');

            qrScanner = new Html5Qrcode('scanner');
            qrScanner.start(
                { facingMode: 'environment' },
                { fps: 10, qrbox: 250 },
                (decodedText) => {
                    console.log('QR detectado:', decodedText);

                    // Extraer código QR de diferentes formatos
                    let codigo = decodedText.trim();

                    // Si es una URL con parámetro qr=, extraer los 11 dígitos
                    const urlMatch = codigo.match(/[?&]qr=(\d{11})/);
                    if (urlMatch) {
                        codigo = urlMatch[1];
                    }
                    // Si es solo 11 dígitos, usar directamente
                    else if (!/^\d{11}$/.test(codigo)) {
                        // Intentar extraer solo los dígitos
                        const digitMatch = codigo.match(/(\d{11})/);
                        if (digitMatch) {
                            codigo = digitMatch[1];
                        }
                    }

                    codigoInput.value = codigo;
                    detenerScanner();
                    buscar();
                },
                (error) => {
                    console.log('Error en scanner:', error);
                }
            ).catch((err) => {
                mostrarError('No se pudo acceder a la cámara. Por favor, verifica los permisos.');
                detenerScanner();
            });
        }

        function detenerScanner() {
            if (qrScanner) {
                qrScanner.stop().catch(() => {});
                qrScanner = null;
            }
            scannerActive = false;
            btnScanner.textContent = '📱 Escanear Código QR';
            scannerDiv.classList.remove('active');
        }

        function buscar() {
            const codigo = codigoInput.value.trim();

            if (!codigo) {
                mostrarError('Por favor, ingresa o escanea un código');
                return;
            }

            loadingDiv.style.display = 'block';
            resultDiv.classList.remove('show');
            errorDiv.classList.remove('show');

            // Usar URL absoluta para asegurar que llega al API correcto
            const apiURL = window.location.origin + '/extintores/api/validar-publico.php?codigo=' + encodeURIComponent(codigo);

            console.log('API URL:', apiURL);
            console.log('Fetching from:', apiURL);

            fetch(apiURL)
                .then(response => {
                    console.log('Response status:', response.status);
                    console.log('Response headers:', response.headers);
                    console.log('Response URL:', response.url);

                    // Leer el cuerpo SIEMPRE para poder mostrar el mensaje real
                    return response.text().then(text => {
                        if (response.status === 401) {
                            throw new Error('No autorizado - Error 401');
                        }
                        if (response.status === 403) {
                            throw new Error('Acceso denegado - Error 403');
                        }
                        if (response.status === 429) {
                            throw new Error('Demasiadas solicitudes. Intenta más tarde.');
                        }
                        if (!response.ok) {
                            // Intentar extraer el mensaje de error del API
                            let detalle = '';
                            try {
                                const j = JSON.parse(text);
                                detalle = j.error ? (': ' + j.error) : '';
                            } catch (e) {
                                detalle = text ? (': ' + text.substring(0, 200)) : '';
                            }
                            throw new Error(`Error HTTP ${response.status}${detalle}`);
                        }
                        return text;
                    });
                })
                .then(text => {
                    console.log('Response text:', text.substring(0, 200));
                    try {
                        const data = JSON.parse(text);
                        loadingDiv.style.display = 'none';

                        if (data.found) {
                            mostrarResultado(data.data);
                        } else {
                            mostrarNoEncontrado();
                        }
                    } catch (e) {
                        console.error('JSON parse error:', e);
                        console.error('Received text:', text.substring(0, 500));
                        loadingDiv.style.display = 'none';
                        mostrarError('Error al procesar respuesta del servidor');
                    }
                })
                .catch(error => {
                    console.error('Fetch error:', error);
                    loadingDiv.style.display = 'none';
                    mostrarError(error.message || 'Error al buscar el extintor');
                });
        }

        function mostrarResultado(datos) {
            let html = '<div class="result found show">';
            html += '<div class="result-title">✅ Extintor Encontrado</div>';

            html += `<div class="result-item">
                <span class="result-label">Código</span>
                <span class="result-value">${datos.codigo_manual}</span>
            </div>`;

            html += `<div class="result-item">
                <span class="result-label">Tipo</span>
                <span class="result-value">${datos.tipo}</span>
            </div>`;

            html += `<div class="result-item">
                <span class="result-label">Capacidad</span>
                <span class="result-value">${datos.capacidad || 'N/A'}</span>
            </div>`;

            html += `<div class="result-item">
                <span class="result-label">Ubicación</span>
                <span class="result-value">${datos.ubicacion}</span>
            </div>`;

            html += `<div class="result-item">
                <span class="result-label">Sección</span>
                <span class="result-value">${datos.seccion || 'Sin sección'}</span>
            </div>`;

            html += `<div class="result-item">
                <span class="result-label">Empresa</span>
                <span class="result-value">${datos.empresa}</span>
            </div>`;

            html += `<div class="result-item">
                <span class="result-label">Estado</span>
                <span class="result-value">
                    <span class="status-badge status-${datos.estado}">
                        ${datos.estado}
                    </span>
                </span>
            </div>`;

            if (datos.observaciones) {
                html += `<div class="result-item">
                    <span class="result-label">Observaciones</span>
                    <span class="result-value">${datos.observaciones}</span>
                </div>`;
            }

            if (datos.inspecciones && datos.inspecciones.length > 0) {
                html += '<div class="inspecciones">';
                html += '<div class="inspecciones-title">Últimas Inspecciones</div>';

                datos.inspecciones.forEach(insp => {
                    const fecha = new Date(insp.fecha + 'T' + insp.hora).toLocaleDateString('es-ES');
                    html += `<div class="inspeccion-item">
                        <div class="inspeccion-fecha">${fecha}</div>
                        <div class="inspeccion-inspector">Por: ${insp.inspector_nombre}</div>
                        ${insp.observaciones ? '<div style="margin-top: 5px; font-size: 12px; color: #555;">' + insp.observaciones + '</div>' : ''}
                    </div>`;
                });

                html += '</div>';
            } else {
                html += '<div class="inspecciones"><div class="inspecciones-title">Sin inspecciones registradas</div></div>';
            }

            html += '</div>';
            resultDiv.innerHTML = html;
            resultDiv.classList.add('show');
            errorDiv.classList.remove('show');
        }

        function mostrarNoEncontrado() {
            const html = `<div class="result not-found show">
                <div class="result-title">❌ Extintor No Encontrado</div>
                <p style="color: #991b1b; font-size: 14px;">
                    No se encontró un extintor con el código ingresado.
                    Verifica que el código sea correcto.
                </p>
            </div>`;

            resultDiv.innerHTML = html;
            resultDiv.classList.add('show');
            errorDiv.classList.remove('show');
        }

        function mostrarError(mensaje) {
            errorDiv.textContent = '⚠️ ' + mensaje;
            errorDiv.classList.add('show');
            resultDiv.classList.remove('show');
        }
    </script>
</body>
</html>
